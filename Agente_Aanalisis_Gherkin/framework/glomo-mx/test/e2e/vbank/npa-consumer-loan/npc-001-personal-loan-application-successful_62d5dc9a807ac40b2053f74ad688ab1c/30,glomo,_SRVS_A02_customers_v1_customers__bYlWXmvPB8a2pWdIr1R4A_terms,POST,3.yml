          de cualesquiera de los terceros antes referidos) utilice la información
          que proporcionaste para la solicitud del producto crediticio como medio
          de acceso a las fuentes que contienen la información antes mencionada. Podrás
          revocar el presente consentimiento para la consulta de tus datos y/o ejercer
