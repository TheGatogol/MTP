    data:
    - difficulty: STARTSAV
      image:
        id: earn-badge-glass.png
        imageType: MICRO_ILLUSTRATION
      modificationDate: '2025-07-14'
      proposalTitle: Una meta en mente, un plan en tu app
      proposalDesc: Contrata la cuenta Plan, una herramienta perfecta para fijarte
        metas financieras y cumplirlas con estrategias que nosotros te proponemos
      proposalDetailDesc: 'Crea una meta: ponle nombre, monto y fecha para lograrla.
        En poco tiempo podrás ver lo que lleves guardado en la pantalla principal
        de tu coach financiero.'
      link:
        rel: internal
        name: Crear Meta
        href: goals
      proposalType: SET_ASIDE_GOALS
      creationDate: '2025-07-14'
      proposalId: '2190200027'
      status: INACTIVE
    - difficulty: STARTSAV
      image:
        id: round-up-rule-glass.png
        imageType: MICRO_ILLUSTRATION
      modificationDate: '2025-07-14'
      proposalTitle: Si no lo ves, no lo gastas
      proposalDesc: Organiza tus finanzas usando Apartados. Pones ahí el dinero que
        quieres separar y así no lo gastas.
      proposalDetailDesc: Crea un apartado con el monto que prefieras. En poco tiempo
        podrás ver lo que lleves guardado en la pantalla principal de tu coach financiero.
      link:
        rel: internal
        name: Crear apartado
        href: pocketsWelcome
      proposalType: POCKETS_CREATE
      creationDate: '2025-07-14'
      proposalId: '2190200048'
      status: INACTIVE
    - difficulty: RESUMESA
      image:
        id: create-section-glass.png
        imageType: MICRO_ILLUSTRATION
      modificationDate: '2025-07-14'
      proposalTitle: No te olvides de tus metas
      proposalDesc: Hace tiempo que no aportas a las metas que te propusiste. Retómalas
        hoy mismo y no pares hasta alcanzarlas.
      proposalDetailDesc: 'Sigue estos pasos: elige una de tus metas, selecciona ''Aportar
        a meta'' y decide la cantidad. En poco tiempo podrás ver lo que lleves guardado
        en la pantalla principal de tu coach financiero.'
      link:
        rel: internal
        name: 'Ir a ''Plan'' '
        href: goals
      proposalType: GOALS_RESUME
      creationDate: '2025-07-14'
      proposalId: '2190200090'
      status: INACTIVE
    - difficulty: SAVINGMO
      image:
        id: end-of-month-savings-rule-glass.png
        imageType: MICRO_ILLUSTRATION
      modificationDate: '2025-07-14'
      proposalTitle: Alcanza tu meta sin mover un dedo
      proposalDesc: ¿Sabías que puedes activar aportaciones automáticas a tus metas?
        ¡Descúbrelo!
      proposalDetailDesc: 'Sigue estos pasos para activar una aportación automática:
        elige una de tus metas, selecciona ''Plan de aportación'' y decide cómo aportar
        (cada que compres o por fecha).'
      link:
        rel: internal
        name: Ir a 'Plan'
        href: goals
      proposalType: GOALS_POWERUP
      creationDate: '2025-07-14'
      proposalId: '2190200077'
      status: INACTIVE
    - difficulty: STARTSAV
      image:
        id: your-goal-your-rules-glass.png
        imageType: MICRO_ILLUSTRATION
      modificationDate: '2025-07-14'
      proposalTitle: Es hora de cumplir tus nuevas metas
      proposalDesc: Alcanza ese objetivo que traes en mente creando una meta en tu
        cuenta Plan. ¿Te animas?
      proposalDetailDesc: 'Crea una meta nueva: ponle nombre, monto y fecha para lograrla.
        En poco tiempo podrás ver lo que lleves guardado en la pantalla principal
        de tu coach financiero.'
      link:
        rel: internal
        name: Ir a 'Plan'
        href: goals
      proposalType: GOALS_CREATE
      creationDate: '2025-07-14'
      proposalId: '2190200079'
      status: INACTIVE
