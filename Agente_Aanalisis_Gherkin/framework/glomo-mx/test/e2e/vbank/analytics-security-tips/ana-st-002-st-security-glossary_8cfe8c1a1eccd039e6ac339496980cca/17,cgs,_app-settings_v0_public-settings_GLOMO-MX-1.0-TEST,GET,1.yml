        de seguridad adicional al momento de hacer compras por teléfono o en internet."]}],"synonyms":["CVV"],"isActive":true},{"id":11,"title":"Datos
        confidenciales","content":[{"type":"p","content":["Es información privada
        cuyo mal uso podría impactar la situación financiera de las personas. Estos
