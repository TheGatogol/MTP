            id: PEVC
          - amount:
            - amount: 100.0
              isMajor: true
              currency: USD
            - amount: 1663.66
              isMajor: false
              currency: MXN
            name: Gastos de Hotel por Convalecencia
            description: Si el médico tratante prescribe que deba de permanecer convaleciente
              en el lugar donde se haya prestado la atención médica, se gestionará
              y coordinará hospedaje hasta de 100 dólares por 5 días.
            id: GAHC
          - amount:
            - amount: 7500.0
              isMajor: true
              currency: USD
            - amount: 124774.50000000001
              isMajor: false
              currency: MXN
            name: Repatriación Sanitaria del Asegurado
            description: A criterio del médico tratante y del equipo médico se determine
              que el asegurado no puede continuar con el itinerario de su viaje, se
              gestionarán y cubrirán los gastos por repatriación de acuerdo al medio
              de traslado más adecuado según su situación médica.
            id: RESA
          - amount:
            - amount: 5000.0
              isMajor: true
              currency: USD
            - amount: 83183.0
              isMajor: false
              currency: MXN
            name: Repatriación de Restos Mortales
            description: A petición del familiar del difunto asegurado, se coordinarán
              los servicios razonables y necesarios para el transporte de los restos
              al lugar de residencia habitual.
            id: RERM
          - amount:
            - amount: 25000.0
              isMajor: true
              currency: USD
            - amount: 415915.00000000006
              isMajor: false
              currency: MXN
            name: Traslado Médico del Asegurado
            description: En caso de accidente o enfermedad grave que ponga en peligro
              la vida del asegurado durante su viaje, se coordinará el envío de una
              ambulancia estándar terrestre para el traslado del asegurado al centro
              hospitalario más cercano.
            id: TMAS
          - amount:
            - amount: 100.0
              isMajor: true
              currency: USD
            - amount: 1663.66
              isMajor: false
              currency: MXN
            name: Acompañamiento de Menores
            description: 'En caso de que el asegurado viaje acompañado y como único
              responsable de menores de 16 años y a causa de haber sufrido un accidente
              o enfermedad grave cubierta lo imposibilite para hacerse cargo de los
              menores, se coordinará el desplazamiento ida y vuelta (viaje redondo
              en clase económica y 100 DLS por 3 días máximo de gasto) de un familiar
              acreditado (mayor de 18 años de edad). '
            id: ACME
          - amount:
            - amount: 200.0
              isMajor: true
              currency: USD
            - amount: 3327.32
              isMajor: false
              currency: MXN
            name: Regreso Anticipado
            description: Regreso anticipado por convalecencia, muerte de un familiar
              o siniestro grave en domicilio.
            id: REAN
          - amount:
            - amount: 0.0
              isMajor: true
              currency: USD
            - amount: 0.0
              isMajor: false
              currency: MXN
            name: Localización de Equipaje
            description: Asesoría al asegurado en la denuncia por robo o extravío
              de su equipaje personal o efectos personales, siempre y cuando hayan
              sido documentados en la línea transportista en la que viaja el asegurado.
            id: LOEQ
          - amount:
            - amount: 0.0
              isMajor: true
              currency: USD
            - amount: 0.0
              isMajor: false
              currency: MXN
            name: Servicios de Asistencia en el Hogar
            description: Apoyo y coordinación con proveedores para cuando el asegurado
              se encuentre de viaje y su hogar (habitado por sus familiares directos)
              sufra de emergencias relacionadas con instalaciones eléctricas, plomería,
              cerrajería y albañilería.
            id: SAHO
          - amount:
            - amount: 0.0
              isMajor: true
              currency: USD
            - amount: 0.0
              isMajor: false
              currency: MXN
            name: Servicios de Viaje y Concierge
            description: 'A solicitud del asegurado, durante su viaje se proporcionará
              asistencia telefónica de Concierge en: recomendaciones y reservaciones
              en viajes, entretenimiento, regalos, compras y asistencia en compras
              personales.'
            id: SEVC
          - amount:
            - amount: 0.0
              isMajor: true
              currency: USD
            - amount: 0.0
              isMajor: false
              currency: MXN
            name: Asistencia Médica Telefónica Mundial
            description: A solicitud del asegurado y durante su viaje, se proporcionarán
              referencias médicas, hospitales y prestadores de servicios médicos dentro
              de la red de proveedores; las 24 h del día, los 365 días del año.
            id: AMTI
          - amount:
            - amount: 0.0
              isMajor: true
              currency: USD
            - amount: 0.0
              isMajor: false
              currency: MXN
            name: Extravío o Robo de Documentos Personales
            description: En caso de que el asegurado pierda o le sean robados sus
              documentos de identificación, se le dará asistencia para poder recuperarlos.
            id: ERDP
          order: 1.0
