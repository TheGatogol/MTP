            description: En caso de que la demora sea mayor a doce horas y sea originada
              por huelga, secuestro del vehículo, falla del vehículo, caso fortuito
              o fuerza mayor que afecte al vehículo marítimo, terrestre o aéreo, o
              bien, a la línea transportista (en la que el asegurado se encuentre
              registrado para viajar), se reembolsará al asegurado los gastos por
              concepto de comida y alojamiento.
            id: DEVU
          - amount:
            - amount: 200.0
              isMajor: true
              currency: USD
            - amount: 3327.32
              isMajor: false
              currency: MXN
            name: Pérdida de Vuelo o Conexión
            description: Pérdida de vuelo o conexión por accidente vial al transportarse
