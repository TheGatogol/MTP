            id: BEDE
          - amount:
            - amount: 10000.0
              isMajor: true
              currency: USD
            - amount: 166366.0
              isMajor: false
              currency: MXN
            name: Muerte accidental en Vuelo
            description: Muerte por accidente ocurrido mientras se encuentre como
