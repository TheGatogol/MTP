            id: BPOA
          - amount:
            - amount: 15000.0
              isMajor: true
              currency: USD
            - amount: 249549.00000000003
              isMajor: false
              currency: MXN
            name: Muerte Accidental
            description: Muerte por accidente cubierto y dentro de los 90 días naturales
              siguientes de la fecha del accidente.
            id: MUAC
          - amount:
            - amount: 5000.0
              isMajor: true
              currency: USD
            - amount: 83183.0
              isMajor: false
              currency: MXN
            name: Responsabilidad Civil en el Extranjero
            description: Gastos de defensa incurridos por el asegurado, derivados
              de cualquier juicio presentado en contra del mismo, generado por la
              responsabilidad civil en que incurra. Adicional, se reembolsarán aquellas
              cantidades que el asegurado llegue a estar legalmente obligado a pagar.
            id: RCIE
          - amount:
            - amount: 2500.0
              isMajor: true
              currency: USD
            - amount: 41591.5
              isMajor: false
              currency: MXN
            name: Daño a Equipaje Personal
            description: Si el equipaje del asegurado es dañado (una o varias maletas,
              incluye artículos personales, maletas, maletines y porta trajes) mientras
              esté bajo la custodia de la línea aérea transportista utilizada por
              el asegurado.
            id: DAEP
          - amount:
            - amount: 200.0
              isMajor: true
              currency: USD
            - amount: 3327.32
              isMajor: false
              currency: MXN
            name: Demora de Equipaje Personal
            description: Se pagará al asegurado mediante reembolso, los gastos incurridos
              por la compra razonable de artículos de primera necesidad (ropa básica,
              calzado de descanso y artículos de higiene personal) para su uso hasta
              que su equipaje registrado llegue o hasta el límite de la suma asegurada.
              Los artículos y gastos deberán ser razonables al tiempo de retraso de
              dicho equipaje.
            id: DEQP
          - amount:
            - amount: 500.0
              isMajor: true
              currency: USD
            - amount: 8318.300000000001
              isMajor: false
              currency: MXN
            name: Cancelación de Viaje
            description: En caso de cancelación por enfermedad grave del asegurado
              y/o familiar directo, el médico tratante deberá recomendar clínicamente
              y por escrito la cancelación de su viaje. Se pagará mediante reembolso
              los gastos no recuperados.
            id: CAVI
          - amount:
            - amount: 200.0
              isMajor: true
              currency: USD
            - amount: 3327.32
              isMajor: false
              currency: MXN
