              de los 90 días naturales siguientes a la fecha del accidente.
            id: BMAV
          - amount:
            - amount: 7500.0
              isMajor: true
              currency: USD
            - amount: 124774.50000000001
              isMajor: false
              currency: MXN
            name: Pérdidas Orgánicas por Accidente
            description: Las pérdidas orgánicas que sufra el asegurado a consecuencia
