        value: En caso de que desee nombrar Beneficiarios a menores de edad, no se
          deberá señalar a un mayor de edad como representante de los menores para
          efecto de que, en su representación, cobre la indemnización. Lo anterior
          porque las legislaciones civiles previenen la forma en que debe designarse
          tutores, albaceas, representantes de herederos u otros cargos similares
          y no consideran al contrato de seguro como el instrumento adecuado para
          tales designaciones. La designación que se hiciera de un mayor de edad como
          representante de menores beneficiarios durante la minoría de edad de ellos,
          legalmente puede implicar que se nombra Beneficiario al mayor de edad, quien
          en todo caso sólo tendría una obligación moral, pues la designación que
          se hace de Beneficiarios en un contrato de seguro le concede el derecho
          incondicionado para disponer de la suma asegurada.
