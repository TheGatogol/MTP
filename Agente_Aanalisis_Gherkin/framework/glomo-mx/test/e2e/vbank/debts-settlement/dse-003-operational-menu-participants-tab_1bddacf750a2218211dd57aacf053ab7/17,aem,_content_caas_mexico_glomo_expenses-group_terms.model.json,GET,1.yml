                    <p><b>COMPARTIR GASTOS</b></p>
                    <p>Los usuarios son responsables de la información que otorgan. Dado que esta herramienta se limita al intercambio informal de datos, BBVA no garantiza que la información sea verdadera. Las personas participantes en los grupos no están vinculadas legalmente.</p>
                    <p><b>USO DE DATOS PERSONALES</b></p>
                    <p>La información proporcionada por los invitados se guardarán por el tiempo que dure el grupo y serán visibles para todos los integrantes. En caso de que alguien no acepte la invitación, sus datos se almacenarán por 15 días.</p>
