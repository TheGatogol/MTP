when:
  sequence: 1
  path: /app-settings/mx/public.app-setting.json
  method: GET
  backend: settings
request:
  headers:
    sec-fetch-mode: cors
    content-length: '0'
    referer: http://localhost:8001/
    sec-fetch-site: same-site
    accept-language: es-MX,es;q=0.9
    origin: http://localhost:8001
    accept: application/json, text/plain, */*; q=0.01
    sec-ch-ua: '"Not:A-Brand";v="99", "Google Chrome";v="145", "Chromium";v="145"'
    sec-ch-ua-mobile: ?0
    x-vbank-session: 73eb75eb-d329-455d-8e22-1020e30e3e88
    sec-ch-ua-platform: '"macOS"'
    host: localhost:9001
    content-type: application/json
    connection: keep-alive
    cache-control: no-cache, no-store, must-revalidate
    accept-encoding: gzip, deflate, br, zstd
    sec-fetch-dest: empty
    user-agent: GLOMO_MX/99.99.99 (Android;14;Samsung)
then:
- return:
    appVersion:
      iOS:
        appStoreUrl: https://apps.apple.com/es/app/bbva-m%C3%A9xico-bancomer-m%C3%B3/id374824226
        minVersion: 25.30.0
        bundleId: com.bancomer.bbva.bancomermovil
        minSDKVersion: 0.0.0
        adviceVersion: 0.0.0
      Android:
        appStoreUrl: https://play.google.com/store/apps/details?id=com.bancomer.mbanking&hl=es_419
        minVersion: 375878030
        inAppUpdates:
          immediate:
            available: true
          flexible:
            period: 1
            available: true
            limit: 3
        packageId: com.bancomer.mbanking
        bySDK:
        - minVersion: 0
          sdk: 23
        adviceVersion: 11170
    travelInsuranceConfig:
      travelers:
        min: 1
        max: 5
    customerLogin:
      globalPrefix: MX00740
    feedbackClientVoiceConnect:
      pushForms:
      - feedbackStep: LOGIN
        feedbackOrigin: NPS
        validators:
        - value: true
          key: isAvailable
        - value:
          - hourEnd: 6
            hourStart: 0
            percent: 0.8
          - hourEnd: 8
            hourStart: 6
            percent: 0.8
          - hourEnd: 20
            hourStart: 8
            percent: 0.8
          - hourEnd: 0
            hourStart: 20
            percent: 0.8
          key: userPercent
        - value: 2
          key: numberSesions
        - value: 180
          key: numberDaysToShow
        - value: 365
          key: numberDaysToAnswered
        event: feedback-client-voice-connect-login
        controlVersions:
        - value: []
          key: useStorage
        - value:
          - appVersion:
              versionInit: 25.100.00
              versionEnd: 99.99.99
            formVersion: '1.0'
            featureVersion:
              versionInit: 5.4.0
              versionEnd: 99.99.99
          key: useBackEnd
      - feedbackStep: LOGOUT
        feedbackOrigin: GRADUAL
        validators:
        - value: true
          key: isAvailable
        - value:
          - hourEnd: 6
            hourStart: 0
            percent: 5
          - hourEnd: 8
            hourStart: 6
            percent: 5
          - hourEnd: 20
            hourStart: 8
            percent: 5
          - hourEnd: 0
            hourStart: 20
            percent: 5
          key: userPercent
        - value: 5
          key: numberSesions
        - value: 30
          key: numberDaysToShow
        - value: 365
          key: numberDaysToAnswered
        event: feedback-client-voice-connect-logout
        controlVersions:
        - value: []
          key: useStorage
        - value:
          - appVersion:
              versionInit: 25.100.00
              versionEnd: 99.99.99
            formVersion: '1.0'
            featureVersion:
              versionInit: 5.4.0
              versionEnd: 99.99.99
          key: useBackEnd
      pullForms:
      - feedbackStep: CARD
        feedbackOrigin: LIFECONTEXT
        validators:
        - value: 2.0
          key: numberCampaign
        event: feedback-client-voice-connect-zpd
        controlVersions:
        - value: []
          key: useStorage
        - value:
          - appVersion:
              versionInit: 25.100.00
              versionEnd: 99.99.99
            formVersion: '1.0'
            featureVersion:
              versionInit: 5.4.0
              versionEnd: 99.99.99
          key: useBackEnd
    disabilityVideocall:
      disabilityVideocallHearingTacticalSchedule:
        Hi: 10
        dFR: 1
        dWE: 0
        dSA: 0
        dTU: 0
        dMO: 1
        dSU: 0
        dTH: 0
        Hc: 18
      disabilityVideocallHearingStrategicConfiguration:
        lastWorkingDay: 5
        openingHour: '10:00:00'
        firstWorkingDay: 1
        meetingRoomUrl: https://bbva-clientes-mex.webex.com/bbva-clientes-mex/j.php?MTID=
        maxTimeInSession: 1200000
        closingHour: '18:00:00'
        listOfTimers:
        - minutesLeft: '3'
          time: 180000
          message: ¡Prepárate! Quedan 3 minutos. Notifica al cliente que la videollamada
            está por terminar y comienza a cerrar el tema. Recuérdale que si necesita
            más tiempo para resolver sus dudas, puede volver a comunicarse y tú o
            algún otro asesor le brindará la atención. ¡Asegúrate de generar una despedida
            amable y empática!
        - minutesLeft: '5'
          time: 300000
          message: ¡Atención! Queda poco tiempo. Es momento de avisar al cliente que
            la videollamada termina en 5 minutos y que podrá comunicarse nuevamente
            si tiene más dudas por resolver.
        - minutesLeft: '10'
          time: 600000
          message: ¡Importante! La videollamada termina en 10 minutos. Cuando queden
            5 minutos, hazle saber al cliente que si necesita más tiempo para resolver
            sus dudas, puede volver a comunicarse.
        aapTarget: '10000228'
