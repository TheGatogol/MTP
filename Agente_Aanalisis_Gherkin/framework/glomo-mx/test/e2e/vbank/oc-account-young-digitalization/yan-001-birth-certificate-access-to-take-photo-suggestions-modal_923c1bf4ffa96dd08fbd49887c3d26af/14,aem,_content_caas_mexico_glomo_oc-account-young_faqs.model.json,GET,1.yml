              elements:
                answer:
                  dataType: multiline
                  ::type: text/html
                  title: Respuesta
                  multiValue: true
                  value:
                  - |
                    <p>Cuando cumpla 18 años, dejarás de ser el o la representante legal de la cuenta y esta cambiará a Libretón Básico Cuenta Digital.&nbsp;</p>
                    <p>Su número de cuenta, CLABE y tarjeta serán los mismos y podrá solicitar la modificación de su cuenta para permitir ingresos superiores a los que recibe la Link Card.</p>
                    <p>Además, podrá activar otros Servicios Digitales como bbva.mx si así lo decide.</p>
