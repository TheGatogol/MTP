then:
- return:
    data:
    - name: Luz
      id: CATS1
      subcategories:
      - name: Focos LED
        description: Los focos LED te ayudan a disminuir tu gasto de iluminación hasta
          en un 70%.
        id: C1PRO1
        tag: RBGR0303
      - name: Páneles solares
        description: Ahorra en el gasto de luz de tu casa. Genera hasta el 100% de
          la energía eléctrica que consumes en tu hogar instalando páneles solares.
        id: C1PRO2
        tag: RBGR0307
      - name: Aires acondicionados inverter
        description: Los sistemas de aire acondicionado con tecnologia inverter te
          permiten regular la temperatura de tu casa con mayor eficiencia y consumen
          menos electricidad que los aires acondicionados tradicionales
        id: C1PRO3
        tag: RBGR0303
      - name: Refrigeradores
        description: Los refrigeradores con el sello FIDE o Energy Star te ayudarán
          a reducir tu consumo de electricidad.
        id: C1PRO4
        tag: RBGR0303
      - name: Lámparas solares
        description: Las lámparas solares utilizan celdas fotovoltaicas para cargarse
          durante el día. Al detectar que el sol se oculta, se encienden de forma
          automática y alumbran utilizando su energía almacenada.
        id: C1PRO5
        tag: RBGR0307
      - name: Ventanas aislantes
        description: Las ventanas con doble o triple cristal mejoran su capacidad
          de aislamiento y reducen la energía necesaria para el aire acondicionado
          o calefacción de los espacios interiores.
        id: C1PRO6
        tag: RBGR0303
    - name: Agua
      id: CATS2
      subcategories:
      - name: Sanitarios
        description: Con cada uso de los sanitarios ahorradores utilizas menos agua
          en comparación con un sanitario tradicional
        id: C2PRO1
        tag: RBGR0303
      - name: Regaderas
        description: 'Las regaderas ahorradoras funcionan con un máximo  de 7 litros
          por minuto, sin importar las condiciones de presión. '
        id: C2PRO2
        tag: RBGR0303
      - name: Lavadoras
        description: 'Las lavadoras con grado ecológico consumen menos agua y menos
          electricidad en cada carga, comparado con una lavadora tradicional. '
        id: C2PRO3
        tag: RBGR0303
      - name: Llaves ahorradoras
        description: Una llave ahorradora brinda un flujo de entre 2 y  6 litros por
          minuto, lo que te permitirá ahorrar agua en tu hogar.
        id: C2PRO4
        tag: RBGR0303
      - name: Sistemas de captación de lluvia
        description: 'Estos sistemas te permiten colectar y filtrar el agua de lluvia
          para que la uses en tus actividades cotidianas como limpieza del hogar o
          riego de áreas verdes. '
        id: C2PRO5
        tag: RBGR0601
    - name: Gas
      id: CATS3
      subcategories:
      - name: 'Estufas de gas '
        description: Las estufas que cumplen con el etiquetado eficiente optimizan
          el uso de gas para la cocción de los  alimentos
        id: C3PRO1
        tag: RBGR0303
      - name: Estufas de inducción
        description: Las estufas de inducción no requieren gas y su diseño cuenta
          con tecnología que optimiza la cocción de los alimentos sin desperdiciar
          energía.
        id: C3PRO2
        tag: RBGR0601
      - name: Calentadores solares
        description: Con un calentador solar podrás aprovechar la energía limpia del
          sol, reduciendo el uso del gas, para satisfacer tu consumo de agua caliente.
        id: C3PRO3
        tag: RBGR0307
      - name: Calentadores de paso de gas
        description: Un calentador de paso eficiente reduce el uso de gas un 50% o
          más, ya que unicamente se enciende al momento de utilizar agua caliente.
        id: C3PRO4
        tag: RBGR0303
      - name: Calentador de paso eléctrico
        description: 'Estos calentadores utilizan electricidad en lugar  de gas y
          además de ser eficientes, pueden ser conectados a los páneles solares. '
        id: C3PRO5
        tag: RBGR0303
      - name: Ventanas Aislantes
        description: ''
        id: C3PRO6
        tag: RBGR0303
