when:
  sequence: 1
  path: /SRVS_A02/accounts/v1/documents-dossiers
  method: GET
  backend: glomo
request:
  headers:
    sec-fetch-mode: cors
    content-length: '0'
    referer: http://localhost:8001/
    sec-fetch-site: same-site
    accept-language: es-MX,es;q=0.9
    origin: http://localhost:8001
    tsec: 
    accept: application/json, text/html, */*; q=0.1
    sec-ch-ua: '"Chromium";v="146", "Not-A.Brand";v="24", "Google Chrome";v="146"'
    sec-ch-ua-mobile: ?0
    x-vbank-session: 'null'
    sec-ch-ua-platform: '"macOS"'
    host: localhost:9000
    content-type: application/json
    connection: keep-alive
    cache-control: no-cache, no-store, must-revalidate
    accept-encoding: gzip, deflate, br, zstd
    sec-fetch-dest: empty
    user-agent: GLOMO_MX/99.99.99 (Android;14;Samsung)
  query:
    indicators.id: IS_PAYROLL_ACCOUNT
    indicators.isActive: 'TRUE'
then:
- close
