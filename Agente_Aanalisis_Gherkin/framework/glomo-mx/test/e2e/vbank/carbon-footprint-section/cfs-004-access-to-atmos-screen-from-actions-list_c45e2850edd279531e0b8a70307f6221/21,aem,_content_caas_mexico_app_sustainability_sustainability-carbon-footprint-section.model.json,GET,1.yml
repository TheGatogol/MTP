                    a ahorrar hasta un 40% de su batería.
                  - Usa fondos de pantalla y salvapantallas oscuros, su proyección
                    consume menos que las imágenes con colores vivos o en las que
                    destaque el color blanco.
                  - Procura bloquear la pantalla de tu computadora, celular o tablet
                    cuando no los vayas a utilizar por un periodo corto.
                  - Apaga tu computadora, celular o tableta cuando no los estés utilizando.
                  - Desactiva las notificaciones que no sean necesarias, así evitarás
                    que la pantalla de tu dispositivo se encienda con frecuencia.
