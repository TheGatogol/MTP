                  multiValue: true
                  value:
                  - '¿Sabías que el calentador de agua es el tercer gasto más grande
                    de tu casa? Representa casi un 13% de tu consumo energético. </br>Hay
                    varias formas en las que puedes reducir las cuentas de tu calentador.
                    </br>Estas son algunas:'
                  - Llevando a cabo estos cambios en tu consumo, conseguirás ahorrar
                    agua y gas, además de reducir tu huella de carbono.
                  translate: true
                bullets:
                  dataType: string
                  ::type: string
                  title: Bullets
                  multiValue: true
                  value:
                  - Utiliza menos agua caliente.
                  - Toma duchas con regadera en vez de baños en tina.
                  - Baja la temperatura del termostato en tu calentador.
                  - Aísla térmicamente el tanque de agua.
                  - Vacía el tanque de tu calentador de forma periódica para evitar
                    que se acumule sedimento.
                  - Cambia tu calentador por uno ahorrador o eléctrico.
                  - Instala un calentador solar.
                  translate: true
              name: optimizar-calentador-de-agua
              description: ''
              model: caascfm/models/global-cells-recommendation
              ::type: dam:Asset
              title: optimizar calentador de agua
