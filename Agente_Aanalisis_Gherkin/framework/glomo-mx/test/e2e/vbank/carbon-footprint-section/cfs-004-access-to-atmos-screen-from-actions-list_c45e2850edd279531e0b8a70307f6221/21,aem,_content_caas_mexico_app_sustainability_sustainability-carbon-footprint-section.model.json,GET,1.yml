                    y la del congelador a -18 grados centígrados. A estas temperaturas,
                    los alimentos se conservarán en perfecto estado.
                  - Si tu refrigerador no tiene termostato en grados, regula la intensidad
                    del frío en función de la estación. Mantén su potencia al mínimo
                    en invierno y súbela a media intensidad en verano.
                  - Para descongelar alimentos, pásalos del congelador al refrigerador.
                    Así evitarás que pierdan propiedades y, al mismo tiempo, se aprovecha
                    su frío para mantener la temperatura de la nevera.
                  - Procura mantener tanto el refrigerador como el congelador libres
                    de escarcha, ya que actúa como un aislante.
                  - Abre el congelador el menor tiempo posible y evita introducir
