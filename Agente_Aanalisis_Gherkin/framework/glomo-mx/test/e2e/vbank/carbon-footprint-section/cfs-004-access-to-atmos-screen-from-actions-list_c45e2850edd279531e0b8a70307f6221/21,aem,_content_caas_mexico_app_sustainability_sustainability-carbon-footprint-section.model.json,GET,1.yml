                items:
                  dataType: string
                  ::type: string
                  title: Items
                  multiValue: true
                  value:
                  - ¿Sabías que el calentador de agua es el tercer gasto más grande
                    de tu casa? Representa casi un 13% de tu consumo energético. </br></br>¿Conoces
                    los beneficios de un calentador solar?
                  - Si bien, un solo calentador puede satisfacer las necesidades de
                    tu hogar, se recomienda instalarlo en serie junto a un calentador
                    eficiente de gas, para que opere como respaldo en época de frío.
                    Con esta idea, tu consumo de gas se reducirá y contarás siempre
                    con agua caliente.
                  translate: true
                bullets:
                  dataType: string
                  ::type: string
                  title: Bullets
                  multiValue: true
                  value:
