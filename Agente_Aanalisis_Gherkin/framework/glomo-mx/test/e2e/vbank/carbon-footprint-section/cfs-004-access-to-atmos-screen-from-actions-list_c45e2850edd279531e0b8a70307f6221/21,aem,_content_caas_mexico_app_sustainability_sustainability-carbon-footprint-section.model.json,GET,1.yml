                  - ' Con estos cambios sencillos, ahorrarás batería en tus dispositivos
                    y disminuirás tu consumo de luz. Además, ayudarás a prolongar
                    la vida útil de tus baterías y pantallas:'
                  translate: true
                bullets:
                  dataType: string
                  ::type: string
                  title: Bullets
                  multiValue: true
                  value:
