                  dataType: string
                  ::type: string
                  title: Items
                  multiValue: true
                  value:
                  - ¿Sabías que una cuarta parte del consumo mundial de electricidad
                    se usa para la iluminación? Es por ello que una de las medidas
                    más eficientes para reducir nuestra huella de carbono y hacer
                    de nuestros espacios más sostenibles es cambiando los focos de
                    nuestra casa por bombillas LED.  ¿Conoces sus beneficios?
