                  - Con estos pequeños cambios, conseguirás ahorrar energía, reducir
                    emisiones de carbono y ahorrar en tus recibos de gas y de luz,
                    evitando consumos innecesarios y favoreciendo al medioambiente.
                  translate: true
                bullets:
                  dataType: string
                  ::type: string
                  title: Bullets
                  multiValue: true
                  value:
