                  value:
                  - 'Una de las mejores medidas para hacer de nuestras viviendas espacios
                    más sostenibles está en nuestras ventanas. A través de ellas se
                    pierde un 30% del calor de una casa, pues se dan intercambios
                    de temperatura entre el interior y el exterior. </br></br>Si quieres
                    controlar la temperatura de tu casa y siempre tener un espacio
                    confortable, sin importar la estación del año ¡vigila tus ventanas!
                    Considera esto:'
                  - Con estos cambios lograrás ahorrar en tus recibos de casa y, además,
                    reducirás tu impacto ambiental.
                  translate: true
                bullets:
