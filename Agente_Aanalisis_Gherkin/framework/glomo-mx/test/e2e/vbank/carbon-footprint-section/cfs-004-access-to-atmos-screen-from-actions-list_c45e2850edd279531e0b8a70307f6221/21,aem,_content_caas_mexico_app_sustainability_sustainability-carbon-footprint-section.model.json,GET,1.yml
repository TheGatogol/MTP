                    de tus emisiones. El volumen de estas emisiones supone aproximadamente
                    un 53.2% de tus emisiones totales, el resto están asociadas a
                    consumos y hábitos que no podemos estimar. '
                  - 'Utilizamos el valor en pesos (MXN) de los recibos y pagos antes
                    mencionados y lo multiplicamos por las variables ofrecidas por
                    el Instituto Nacional de Ecología y Cambio Climatico (INECC).
                    Para ello, consultamos siempre la última publicación de datos
                    oficiales. '
