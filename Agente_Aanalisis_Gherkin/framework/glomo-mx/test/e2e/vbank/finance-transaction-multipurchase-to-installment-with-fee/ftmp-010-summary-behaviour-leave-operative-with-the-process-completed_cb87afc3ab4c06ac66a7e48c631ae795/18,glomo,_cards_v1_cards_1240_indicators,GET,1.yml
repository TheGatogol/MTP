      isActive: false
    - description: The card can be related to virtual cards
      id: ASSOCIABLE_TO_VIRTUAL_CARDS
      isActive: false
    - description: Indica si la tarjeta cuenta con sticker asociado
      id: ASSOCIABLE_TO_STICKER_CARDS
