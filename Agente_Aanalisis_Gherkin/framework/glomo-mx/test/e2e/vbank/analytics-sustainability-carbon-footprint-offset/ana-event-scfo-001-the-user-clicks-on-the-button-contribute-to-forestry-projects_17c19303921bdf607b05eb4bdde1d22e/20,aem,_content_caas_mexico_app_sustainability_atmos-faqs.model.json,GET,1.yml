                  - |
                    <p>Los montos de aportación se basan en la capacidad de los proyectos para absorber CO₂. Consideramos tu huella de carbono para equilibrar el CO₂ que emitiste con el que los proyectos pueden absorber.<br>
                    Si no puedes aportar puede deberse a dos razones:</p>
