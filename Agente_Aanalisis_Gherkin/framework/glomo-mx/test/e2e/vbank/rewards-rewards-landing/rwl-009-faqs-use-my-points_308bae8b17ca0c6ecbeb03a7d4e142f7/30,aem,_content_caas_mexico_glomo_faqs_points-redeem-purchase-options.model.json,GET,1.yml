                    <p>Puedes pagar tus compras con puntos directo en tu app BBVA. En la sección ‘Movimientos’ de tu tarjeta de crédito identifica las compras que tengan la etiqueta ‘Quiero’ y luego selecciona la opción ‘Pagar con puntos’.</p>
