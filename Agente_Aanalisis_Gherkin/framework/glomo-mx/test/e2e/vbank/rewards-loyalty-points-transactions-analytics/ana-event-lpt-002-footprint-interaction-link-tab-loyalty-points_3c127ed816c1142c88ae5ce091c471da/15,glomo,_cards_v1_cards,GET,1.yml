        id: FRONT_CARD
        url: https://cardcovers-stage.caasbbva.com/peru/491947_VISA-CORPORATE_front.png?width=120&height=76
      - name: Back face of the card
        id: BACK_CARD
        url: /imageBack.jpg
      numberType:
        description: Permanent Account Number
        id: PAN
      brandAssociation:
        description: VISA
        id: VISA
      physicalSupport:
        description: Plástico normal
        id: NORMAL_PLASTIC
      cardType:
        description: Tarjeta de crédito
        id: CREDIT_CARD
      disposedBalance:
        currentBalances:
        - amount: 1000000
          currency: MXN
        pendingBalances:
        - amount: 0
          currency: MXN
        postedBalances:
        - amount: 1000000
          currency: MXN
      availableBalance:
        currentBalances:
        - amount: 2000000
          currency: MXN
        pendingBalances:
        - amount: 0
          currency: MXN
        postedBalances:
        - amount: 2000000
          currency: MXN
      number: 4555 4570 8307 0001
      grantedCredits:
      - amount: 3000000
        currency: MXN
      cutOffDate: '2016-10-01T12:00:00Z'
      alias: comprobar máximo de caracteres
      id: '0001'
      expirationDate: '2019-06-09'
      currencies:
      - isMajor: true
        currency: MXN
      status:
        id: OPERATIVE
    :headers:
      content-length: '2271'
      Server: artichoke
      Alt-Svc: h3=":443"; ma=2592000,h3-29=":443"; ma=2592000
      access-control-allow-headers: Content-Type, tsec, authenticationtype, authenticationdata,
        authenticationstate, contactid, consumeruuid, consumerapplicationid, perimetertsec,
        authorization, responsewarningcode, responsewarningdescription, cuf, field,
        bcs-device-app-version, bcs-device-app-version, vnd.bbva.authorization
      tsec: 58855dde6c692a5b53729d2fb40d6156594180d5
      X-Response-Time: 499ms
      Date: Mon, 10 Jul 2023 12:55:35 GMT
      Via: 1.1 google
      access-control-allow-origin: '*'
      Access-Control-Expose-Headers: tsec, vnd.bbva.access-token-type,vnd.bbva.access-token,
        vnd.bbva.sso-pkcs7, authenticationtype, authenticationdata, authenticationstate,
        authenticationchallenge
      Cache-Control: private, no-store
      content-type: application/json;charset=UTF-8
      Vary: Accept-Encoding
    :status: 200 OK
    apiInfo:
      name: cards
      category: products
      version: 0.19.0
