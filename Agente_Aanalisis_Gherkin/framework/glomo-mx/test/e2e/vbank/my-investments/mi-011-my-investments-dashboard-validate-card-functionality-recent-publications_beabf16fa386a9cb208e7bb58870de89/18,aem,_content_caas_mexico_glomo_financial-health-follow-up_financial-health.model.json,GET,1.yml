                title:
                  dataType: string
                  ::type: string
                  title: Title
                  multiValue: false
                  value: ¿Cuál es la función de Banco de México en la economía y las
                    inversiones?
                content:
                  dataType: string
                  ::type: string
                  title: Content
                  multiValue: false
                  value: 'La función principal del Banco de México es mantener la
                    inflación bajo control para que tu dinero conserve su valor. Las
                    decisiones sobre las tasas de interés son importantes para lograrlo.
                    Por ejemplo, si la inflación sube mucho, Banco de México aumentará
                    las tasas para frenar el gasto y el incremento en los precios.
                    Por otro lado, si la economía se desacelera o la inflación está
                    a la baja, Banxico reducirá su tasa objetivo para impulsar la
                    actividad económica.  <br>Hay varias señales que se monitorean
                    para conocer la situación de la economía. La principal es el dato
                    de inflación: si la inflación se acerca a la meta de Banxico (que
                    es 3%), es una señal de que podrían bajar más las tasas. También
                    se observan los datos de empleo y el crecimiento económico: por
                    ejemplo, si la economía se debilita, Banco de México podría considerar
                    bajar las tasas para estimular la economía. Finalmente, los mensajes
                    del propio Banxico en sus comunicados, ya que muestran señales
                    sobre su visión y sus planes a futuro. <br>En el mundo de las
                    inversiones de renta fija, existen dos tipos de fondos: los fondos
                    de liquidez y de renta fija. Dichos fondos se ven influenciados
                    por las decisiones de Banxico de la siguiente manera: <br>En los
                    Fondos de liquidez: Se invierte en instrumentos a corto plazo
                    con plazo menor a un año. En estos fondos, cuando las tasas de
                    interés suben, se benefician y podrían dar más rendimiento. <br>En
                    el segundo caso, en los Fondos de renta fija: Se invierte en instrumentos
                    a más largo plazo, con plazo a más de un año). En estos fondos,
                    si las tasas de interés aumentan, aunque podrían ganar más intereses,
                    también podrían perder valor debido a que los bonos que tienen
                    en su cartera se devalúan un poco.'
              name: articulo-3
              description: ''
              model: caascfm/models/mexico-glomo-financial-healt-follow-up
              ::type: dam:Asset
