                  value: Es como una “alcancía compartida”, donde muchas personas
                    ponen su dinero. Un experto se encarga de invertir ese dinero
                    en diferentes lugares para que tenga la posibilidad de crecer.
                image:
                  dataType: string
                  ::type: string
                  title: Image
                  multiValue: false
                  value: /content/dam/caas/mexico/glomo/content-fragment/follow-up/financial-help-image/imagen_financial_health.webp
                title:
                  dataType: string
                  ::type: string
                  title: Title
                  multiValue: false
                  value: Te has preguntado…¿Qué es un Fondo de Inversión?
                content:
                  dataType: string
                  ::type: string
                  title: Content
                  multiValue: false
                  value: 'Dentro de sus características encontramos:<br> <b>Diversificación:<b>
                    Tu dinero se reparte en muchas inversiones diferentes.<br> <b>Administración
                    profesional:<b> Un experto maneja las inversiones por ti.<br>
                    <b>Accesibilidad:<b> Puedes empezar desde $50 pesos. <br> <b>Liquidez:<b>
                    Puedes sacar tu dinero cuando lo necesites. Dependiendo del fondo
                    que selecciones. Sin plazos forzosos de permanencia.<br><br>Algunas
                    de las ventajas son:<br> Reducción del probable riesgo, contrario
                    a invertir por tu cuenta en una sola cosa.  <br>No necesitas ser
                    experto en inversiones.  <br>Es más fácil invertir en diferentes
                    países o sectores.  <br>Tener la posibilidad de alcanzar una meta
                    de ahorro.  <br>Puedes elegir fondos que se ajusten a tus objetivos
                    y cuánto riesgo quieres asumir.  <br>Tiene la posibilidad de mantener
                    el valor del dinero.  <br>El dinero tiene la posibilidad de seguir
                    creciendo a medida que pasa el tiempo. <br><br> Existen tres tipos
                    de Fondos de Inversión:  <br> <b>Deuda:<b> Es como prestarle dinero
                    a alguien a cambio de que te lo devuelva con intereses, que son
                    como un premio por haber confiado en ellos. En este caso al gobierno
                    y empresas para financiarse. Y tienen menor riesgo.  <br> <b>Renta
                    Variable:<b> Invierten en acciones de empresas. Tienen la posibilidad
                    de ganar más, pero también son más arriesgados.  <br> <b>Multiestrategia:<b>
                    Combinan un poco de los dos anteriores.'
              name: articulo-1
              description: ''
              model: caascfm/models/mexico-glomo-financial-healt-follow-up
              ::type: dam:Asset
              title: Articulo 1
            - path: /content/dam/caas/mexico/glomo/content-fragment/follow-up/financial-help/articulo-3
