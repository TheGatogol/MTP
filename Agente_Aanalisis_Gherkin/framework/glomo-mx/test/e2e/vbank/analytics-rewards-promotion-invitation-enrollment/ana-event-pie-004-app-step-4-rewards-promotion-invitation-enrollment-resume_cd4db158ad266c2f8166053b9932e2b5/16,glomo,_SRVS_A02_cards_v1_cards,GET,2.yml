        pendingBalances:
        - amount: 0
          currency: MXN
        postedBalances:
        - amount: 1000000
          currency: MXN
      availableBalance:
        currentBalances:
        - amount: 2000000
          currency: MXN
        pendingBalances:
        - amount: 0
          currency: MXN
        postedBalances:
        - amount: 2000000
          currency: MXN
