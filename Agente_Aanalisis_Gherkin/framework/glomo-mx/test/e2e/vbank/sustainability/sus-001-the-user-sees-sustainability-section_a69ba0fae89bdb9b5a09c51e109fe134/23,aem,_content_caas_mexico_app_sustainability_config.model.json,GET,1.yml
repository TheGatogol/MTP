                  title: Items
                  multiValue: true
                  value:
                  - <span style="font-weight:500;font-size:1rem;">¿Cómo se producen
                    estas emisiones?</span>
                  - En México se producen más de 100 mil toneladas de basura al día,
                    las cuales son llevadas a tiraderos donde no se reciclan. Ahí,
                    los productos orgánicos comienzan a descomponerse y producen gases
                    de efecto invernadero. Por otro lado, al no reciclar materiales
                    inorgánicos, se crea la necesidad de extraer nuevas materias primas,
                    lo que produce más emisiones y mayor dependencia a recursos no
                    renovables.
                  - <span style="font-weight:500;font-size:1rem;"></br>¿Qué acciones
                    puedo tomar?</span>
                  - Procura reducir tu consumo de materiales plásticos y reutiliza
                    los que ya tengas, así evitarás los desechos de productos de un
                    solo uso. ¡Recuerda separar la basura! Esto facilita el reciclaje
                    de latas, botellas de plástico y papel y aprovecha tus desechos
                    orgánicos; con ellos podrás hacer composta o fertilizantes caseros.
                  translate: true
