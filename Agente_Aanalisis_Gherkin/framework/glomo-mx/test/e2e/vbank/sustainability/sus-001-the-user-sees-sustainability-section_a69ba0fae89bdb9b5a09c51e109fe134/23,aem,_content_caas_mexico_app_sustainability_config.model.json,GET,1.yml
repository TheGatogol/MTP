                  - <span style="font-weight:500;font-size:1rem;">¿Cómo se producen
                    estas emisiones?</span>
                  - Los vehículos de combustión generan carbono al quemar gasolina
                    o diesel. La cantidad de emisiones que produce cada coche depende
                    del tamaño del carro, potencia y tamaño del motor, condiciones
                    de manejo, velocidad y combustible que usa.
                  - <span style="font-weight:500;font-size:1rem;">¿Qué acciones puedo
                    tomar?</span>
                  - 'Recuerda llevar tu coche a servicio, el mantenimiento constante
                    es una de las acciones más efectivas para tener vehículos más
                    sostenibles. No olvides que a mayor gasto de combustible, mayores
                    emisiones: respeta los límites de velocidad y si realizas trayectos
                    por una ruta definida, ¡comparte tu auto! </br>Utiliza el transporte
                    público siempre que te sea posible y si piensas cambiar de coche,
                    considera alguna opción sostenible como un auto híbrido o eléctrico.'
                  translate: true
