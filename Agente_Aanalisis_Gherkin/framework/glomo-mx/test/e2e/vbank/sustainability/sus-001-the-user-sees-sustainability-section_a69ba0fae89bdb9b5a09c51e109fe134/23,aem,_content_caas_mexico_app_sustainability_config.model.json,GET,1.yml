                  - Las horas que pasamos jugando videojuegos generan un impacto ambiental
                    por varios motivos. El más importante es la electricidad que estos
                    dispositivos consumen durante el tiempo que la consola está encendida,
                    así como la energía que ocupa la televisión y el internet.
                  - 'También es importante el formato de los videojuegos: no siempre
                    las versiones digitales significan menos emisiones. Si el juego
                    ocupa más de 1.3 GB en el disco duro de la consola, las emisiones
                    producidas por cada descarga varían entre 22 y 27.5 kg de carbono
