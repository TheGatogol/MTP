                    estas emisiones?</span>
                  - 'Una hectárea equivale a 10,000 metros cuadrados. Las emisiones
                    asociadas a la deforestación surgen por dos motivos: la cantidad
                    de carbono que los árboles talados ya no podrán absorber y los
                    mecanismos utilizados para la tala, desde maquinaria pesada hasta
                    incendios provocados. </br>La mayor parte de las áreas deforestadas
                    son utilizadas para crear zonas de pastoreo, actividad que produce
                    además, un 14.5% de las emisiones de gases de efecto invernadero
                    a nivel mundial.'
                  - <span style="font-weight:500;font-size:1rem;">¿Qué acciones puedo
                    tomar?</span>
                  - 'Desde buscar iniciativas que protejan las áreas naturales, hasta
                    impulsar actividades de reforestación a nivel local. </br>Otra
                    acción de gran impacto es reducir tu consumo de productos de origen
                    animal: no consumir carne o lácteos por un día puede disminuir
                    tu impacto hasta por un 12% al año.'
