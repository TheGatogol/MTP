        son los tipos de contaminación más comunes? ","desc":"La contaminación, que
        se extiende por tierra, mar y aire, siempre tiene un denominador en común:
        la actividad de la especie humana.","content":[{"type":"p","content":["La
        contaminación, que se extiende por tierra, mar y aire, siempre tiene un denominador
        en común: la actividad de la especie humana.  La contaminación ambiental afecta
        al medio en el que se desarrolla la vida animal y vegetal.  Esta categoría
        se divide a su vez en subtipos, tales como:"]},{"type":"list-bullet","content":["La
        contaminación atmosférica se produce por la emisión de sustancias químicas
        a la atmósfera que afectan directamente a la calidad del aire.","La contaminación
        hídrica que afecta a océanos, mares, ríos, lagos y aguas subterráneas por
        el vertido de químicos, aguas industriales, insecticidas, plaguicidas agrícolas,
        y productos de uso doméstico, como productos de limpieza, aceites de cocina
        usados e incluso aceites de motor","La contaminación del suelo se produce
        cuando se filtran sustancias químicas como los plaguicidas utilizados en la
        agricultura, los residuos de metales como los que contienen las baterías o
        pilas, junto con otras muchas sustancias acumuladas en los basureros."]},{"type":"p","content":["Conocer
        los tipos de contaminación que existen es importante a la hora de tomar conciencia
        y cuidar al planeta."," ","Te invitamos a visitar el sitio bbva.com/es/sostenibilidad/
        para que conozcas más sobre sostenibilidad en BBVA."]}],"relatedTip":{"id":"07_efficiency_tips","img":"deletelogo","title":"Evita
