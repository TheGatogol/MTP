        materiales.","location":{"dashboard":{"isActive":true},"list":{"isActive":true}}}},{"id":"news12_sustaintability","img":"https://assets.caasbbva.com/spain/app/sustainability/images/energy_efficiency.PNG","date":"31-01-2022","title":"¿Qué
        es la biodiversidad?","desc":"Es la variedad de la vida en la Tierra, en todas
        sus formas y en todas sus interacciones.","content":[{"type":"p","content":["Es
        la variedad de la vida en la Tierra, en todas sus formas y en todas sus interacciones.
        Desde las estructuras invisibles como los genes a las superestructuras de
        los ecosistemas, pasando por todas y cada una de las especies animales, vegetales,
        hongos, incluso virus y bacterias que conforman el planeta. La biodiversidad
        es clave para la supervivencia tanto de las especies como de los seres humanos
        y, por lo tanto, para la sostenibilidad del planeta."," ","El término biodiversidad
        se acuñó en 1985 y nació de la contracción en inglés ‘biological diversity’
        (diversidad biológica). Desde entonces, no ha parado de crecer su importancia
        aunque por una causa indeseable: la pérdida de la biodiversidad como una de
        las peores consecuencias de la actividad humana y del cambio climático generado
        por ella."," ","La base de la supervivencia está relacionada con la biodiversidad,
        empezando por el aire que respiran o el agua con que se hidratan los seres
        vivos. Sin abejas no habría frutas polinizadas, sin plantas no existiría el
        oxígeno. Los árboles absorben la contaminación de las grandes ciudades y actúan
        como sumideros del dióxido de carbono (CO2), mientras que los arrecifes de
        coral ayudan a frenar ciclones y tsunamis."," ","Las medidas para proteger
        la biodiversidad deberían ser tan extensas e interactivas como la biodiversidad
        misma. Empezando por la responsabilidad individual, de cada miembro de la
        especie humana, para contribuir en la medida de sus posibilidades al gran
        reto de la supervivencia colectiva."," ","Te invitamos a visitar el sitio
        bbva.com/es/sostenibilidad/ para que conozcas más sobre sostenibilidad en
        BBVA."]}],"relatedTip":{"id":"09_efficiency_tips","img":"trashcan","title":"Separa,
        recicla y reutiliza","linkText":"Leer más","desc":"Hacer una buena gestión
        de los residuos domésticos disminuye la contaminación y, además, ayuda a reutilizar
        materiales.","location":{"dashboard":{"isActive":true},"list":{"isActive":true}}}},{"id":"news11_sustaintability","img":"https://assets.caasbbva.com/spain/app/sustainability/images/energy_efficiency.PNG","date":"24-12-2021","title":"¿Qué
        es la deforestación y cómo afecta al medioambiente?","desc":"La pérdida de
        las masas forestales tiene su principal origen en diversas actividades humanas.","content":[{"type":"p","content":["La
        pérdida de las masas forestales tiene su principal origen en diversas actividades
        humanas, desde el uso intensivo del suelo para la agricultura y la ganadería
        hasta la explotación de minerales en el subsuelo de los bosques, pasando por
        la tala de árboles a gran escala y la construcción de infraestructuras.","
        ","También influyen los aspectos demográficos: el abandono de las zonas rurales
        y la tendencia a la concentración de la población en las ciudades. Según la
        ONU, a mediados de siglo vivirá en las ciudades el 90% de la población global.
        No obstante, este fenómeno también implica una consecuencia adversa: la falta
        de mantenimiento y limpieza de las masas forestales que durante milenios han
        asegurado las poblaciones campesinas, lo que se traduce en un mayor riesgo
        de incendios devastadores, que además emiten grandes cantidades de gases de
        efecto invernadero."," ","Las medidas para evitar la deforestación están sobre
        la mesa desde el siglo pasado y acaba de empezar la década de la restauración
        de ecosistemas, un programa de Naciones Unidas que pretende regenerar millones
        de hectáreas destruidas o degradadas, además de océanos y lagos dañados, a
        través de apoyos políticos y financieros e investigaciones científicas. ","
        ","Igualmente se aplican acciones de mercado como la certificación de productos
        procedentes de bosques con gestión sostenible o servicios ambientales como
        el mantenimiento de las zonas altas de las cuencas hidrográficas. "," ","Tener
        una mayor conciencia ecológica respecto a la importancia de los bosques, puede
        ayudar a su preservación apoyando con distintas acciones, como consumir productos
        de papel de forma racional y con marcado de reciclado, perservar el área verde
        cerca del hogar y sobretodo cuidar el agua."," ","Te invitamos a visitar el
        sitio bbva.com/es/sostenibilidad/ para que conozcas más sobre sostenibilidad
        en BBVA."]}],"relatedTip":{"id":"07_efficiency_tips","img":"deletelogo","title":"Evita
        los productos de un solo uso","linkText":"Leer más","desc":"El uso de productos
