        para el Ahorro de Energía Eléctrica (FIDE)."},"list":{"isActive":true}}},{"id":"sustainability_fund","title":"Fondo
        de inversión sostenible","content":[{"type":"p","content":["Opciones de inversión
        que, además del retorno económico, piensa en la sostenibilidad. Se apuesta
        principalmente por el fomento de energías renovables o por el mantenimiento
        de zonas verdes pero también por la lucha contra la desigualdad social o el
