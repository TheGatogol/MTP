        integral de movilidad urbana sustentable (PIMUS)"},"list":{"isActive":true}}},{"id":"recycled_plastic","title":"Plástico
        reciclado","content":[{"type":"p","content":["Material que se obtiene por
        la reutilización de plásticos. Su gran resistencia a la degradación permite
        alargar la vida útil del recurso, fabricar nuevos productos y disminuir el
        volumen de residuos. "]}],"location":{"dashboard":{"isActive":false,"desc":"Material
        que se obtiene por la reutilización de plásticos."},"list":{"isActive":true}}},{"id":"Recycling","title":"Reciclaje","content":[{"type":"p","content":["Proceso
        que tiene como objetivo convertir residuos en nuevos productos o en materia
        prima para un nuevo uso. Como el reciclaje permite alargar la vida útil de
        los materiales y ayuda a la preservación de los recursos naturales del planeta,
        es un elemento de la economía circular."]}],"location":{"dashboard":{"isActive":false,"desc":"Proceso
        por el que se convierten residuos en nuevos productos o materia prima."},"list":{"isActive":true}}},{"id":"residue","title":"Residuo","content":[{"type":"p","content":["Materiales
        o objetos que usamos en nuestras actividades diarias y a los que damos una
        segunda oportunidad de uso en vez de desecharlos."]}],"location":{"dashboard":{"isActive":false,"desc":"Materia
        u objeto desechado por haber perdido su utilidad."},"list":{"isActive":true}}},{"id":"sustainability","title":"Sostenibilidad","content":[{"type":"p","content":["Significa
        satisfacer nuestras necesidades actuales sin comprometer la capacidad de las
        generaciones futuras para satisfacer las suyas. La sostenibilidad busca lograr
        un equilibrio entre el cuidado del medioambiente y la igualdad de oportunidades
        para las personas."]}],"location":{"dashboard":{"isActive":false,"desc":"Equilibrio
        para cubrir nuestras necesidades sin dañar a las futuras generaciones."},"list":{"isActive":true}}}],"news":[{"id":"news29_sustaintabilityBBVA","img":"https://assets.caasbbva.com/spain/app/sustainability/images/energy_efficiency.PNG","date":"30-09-2022","title":"¿Qué
        es el Acuerdo de París y qué supone para el planeta?","desc":"Por primera
        vez tanto los países desarrollados como en vías de desarrollo se comprometen
        a reducir las emisiones de gases de efecto invernadero (GEI), fundamentalmente
        las de dióxido de carbono (CO2)","content":[{"type":"p","content":["El triple
        objetivo del Acuerdo de París sigue siendo limitar el aumento medio de la
        temperatura global a 2 grados centígrados respecto a los niveles preindustriales,
        redoblar esfuerzos para no superar la marca de 1,5 grados a final de este
        siglo y alcanzar la neutralidad climática en 2050, es decir, que la cantidad
        de CO2 liberado a la atmósfera por la actividad humana sea equivalente a la
        que absorben los sumideros naturales, como los bosques."," ","El cumplimiento
        del Acuerdo de París es voluntario y, por primera vez, la presentación de
        compromisos que derivan de ella involucra a todas las naciones, a actores
        no estatales como gobiernos regionales y locales, empresas, inversores y a
        la sociedad civil. Estos actores se agrupan en la plataforma NAZCA, que cuenta
        con más de 18,200 integrantes y tiene más de 2,000 acciones e iniciativas
        climáticas."," ","Además, el Acuerdo impulsa la inversión sostenible al alinear
        la financiación con sus objetivos climáticos a partir de criterios ambientales,
        sociales y de gobierno corporativo. La finalidad de esta iniciativa es que
        las entidades financieras y los mercados redirijan flujos de capital hacia
        proyectos verdes."," ","En otras palabras, su implementación implica la superación
        paulatina de las energías fósiles (carbón, petróleo y gas), el principio del
        reinado de las energías renovables (solar fotovoltaica, eólica, biomasa, hidráulica,
        biocarburante, etc.) y revertir la tradicional tendencia de crecer a costa
        de contaminar más."]}],"relatedTip":{"id":"06_efficiency_tips","img":"bicycle","title":"Camina
        o usa la bicicleta cuando sea posible","linkText":"Leer más","desc":"En ocasiones,
        utilizamos el auto para trayectos cortos que podríamos hacer a pie o en bicicleta.
        Cambia tu modo de transporte en ellos, así ahorrarás gasolina y reducirás
        tus emisiones. Además, tu salud te lo agradecerá.","location":{"dashboard":{"isActive":true},"list":{"isActive":true}}}},{"id":"news28_sustaintabilityBBVA","img":"https://assets.caasbbva.com/spain/app/sustainability/images/energy_efficiency.PNG","date":"30-09-2022","title":"¿Qué
        es la economía de la dona?","desc":"Satisfacer las necesidades básicas del
        ser humano sin exprimir los recursos limitados del planeta. De esta premisa
        nace la “economía de la dona” basada en la regeneración del planeta y la distribución
        del bienestar.","content":[{"type":"p","content":["La economista inglesa Kate
        Raworth, no pudo elegir una mejor imagen como símil para explicar hacia dónde
        debe caminar la humanidad y, por tanto, la economía: una dona. Pero ¿qué es
        realmente la economía de la dona? Raworth, que trabaja en la Universidad de
        Oxford, parte de una realidad: todas las personas deben tener cubiertas las
        necesidades esenciales y, a la vez, el planeta tiene unos límites que no debemos
        cruzar."," ","El modelo de Raworth propone lo siguiente: Imagínate dos círculos
        concéntricos, en el anillo interior se encuentran las necesidades básicas
        para el bienestar del ser humano: agua potable, comida, salud, educación,
        trabajo, justicia, participación política, equidad social, igualdad de género,
        vivienda y conectividad."," ","En el anillo exterior están los límites medioambientales:
        cambio climático, acidificación de los océanos, contaminación química, reducción
        de la capa de ozono, pérdida de la biodiversidad, extracción de agua dulce
        y otros peligros para la sostenibilidad del planeta."," ","El espacio que
        queda entre los dos anillos -la dona- es el sitio donde la humanidad puede
        prosperar, un lugar ecológicamente seguro y socialmente justo."," ","Este
        modelo económico establece la ruta para encontrar el bienestar común. La cuestión
        es reducir las desigualdades y garantizar la sostenibilidad medioambiental."]}],"relatedTip":{"id":"07_efficiency_tips","img":"deletelogo","title":"Evita
        los productos de un solo uso","linkText":"Leer más","desc":"El uso de productos
        que se usan y se tiran genera una gran cantidad de residuos y la necesidad
        de generar nuevos materiales, porque en ocasiones no pueden reciclarse. Esto
        aumenta el consumo de recursos y de energía.","location":{"dashboard":{"isActive":true},"list":{"isActive":true}}}},{"id":"news27_sustaintabilityBBVA","img":"https://assets.caasbbva.com/spain/app/sustainability/images/energy_efficiency.PNG","date":"11-08-2022","title":"¿Cómo
        podemos ahorrar energía en nuestros hogares?","desc":"Pequeñas acciones para
        reducir el consumo de luz.","content":[{"type":"p","content":["En el día a
        día, adaptando los hábitos de consumo y racionalizando el uso que se da a
        los aparatos eléctricos, es posible reducir el monto del recibo de luz de
        manera considerable. Además de apostar por los electrodomésticos con certificación
        ecológica, realizar de manera constante algunos pequeños cambios hará que
        nuestra economía familiar lo agradezca y podamos contribuir al cuidado del
        planeta."," ","3 buenas prácticas para ahorrar energía:"," "]},{"type":"list-bullet","content":["Desenchufar
        aparatos eléctricos: a nivel general, es importante no dejar más aparatos
        de los necesarios enchufados, porque, aunque en pequeña cantidad, siguen consumiendo
        energía. Si se tiene claro que no se va a utilizar uno de ellos, lo mejor
        es desconectarlo hasta que se vuelva a usar.","Cambiar tus focos por lámparas
        LED: estas lámparas consumen hasta 80% menos energía eléctrica que los focos
        convencionales y duran hasta 10 veces más.","Optar por electrodomésticos amigables
        con el ambiente: existen electrodomésticos de grado ecológico, como refrigeradores,
        lavadoras y secadoras. Estos son energéticamente eficientes y ahorran en su
        consumo de agua."]},{"type":"p","content":["Para ayudarte a reducir tu consumo
        eléctrico, BBVA y Walmart tienen una promoción para ti. Compra línea blanca
        amigable con el medio ambiente y bicicletas en Walmart y Bodega Aurrera, tanto
        en tienda física como en su página web, a 15 meses sin intereses al pagar
        con tu tarjeta de crédito BBVA. ¡Aprovecha esta promoción antes del 31 de
        agosto!"," ","Consulta términos y condiciones de la promoción en tienda y/o
        en nuestra página de internet Bbvadescuentos > Menú > Autoservicio > Supermercados."]}],"relatedTip":{"id":"04_efficiency_tips","img":"homeappliances","title":"Selecciona
        el modo ahorro en los dispositivos electrónicos","linkText":"Leer más","desc":"El
        modo ahorro de energía de pantallas y otros dispositivos electrónicos disminuye
        su consumo de energía. También es recomendable usar fondos de pantalla oscuros
        y disminuir el brillo de las pantallas cuando no sea necesario tenerlo al
        máximo.","location":{"dashboard":{"isActive":true},"list":{"isActive":true}}}},{"id":"news26_sustaintabilityBBVA","img":"https://assets.caasbbva.com/spain/app/sustainability/images/energy_efficiency.PNG","date":"11-08-2022","title":"Comercio
        justo: ¿qué es y cómo puede ayudar al mundo?","desc":"Estamos en busca de
        una economía que promueva el reparto equitativo entre todos los actores de
        la cadena de producción, respete los derechos de los trabajadores y reduzca
        su impacto ambiental.","content":[{"type":"p","content":["Preguntarse si un
        producto es caro o barato antes de comprarlo es normal, pero no nos cuestionamos
        si su precio es justo. La economía globalizada facilita que una camisa hecha
        en Bangladesh o un café cultivado en Colombia lleguen rápidamente a un clóset
        o una despensa al otro lado del mundo. Pero ese precio final no se distribuye
        equitativamente y con la misma eficacia a los productores originales. Por
        ejemplo, el algodonero bangladesí o el cafetero colombiano reciben una parte
        que puede ser escasa respecto al valor de su trabajo. Lograr esa distribución
        más equilibrada es lo que promueve el movimiento del comercio justo o comercio
        ético."," ","La World Fair Trade Organization (WFTO) define el comercio justo
        como una alianza comercial, basada en el diálogo, la transparencia y el respeto,
        que busca una mayor equidad en el comercio internacional. También contribuye
        al desarrollo sostenible al ofrecer mejores condiciones comerciales y asegurar
        los derechos de los productores y trabajadores marginados."," ","De igual
        forma, la mayor parte de productos del comercio justo son sostenibles y están
        certificados como ecológicos, ya que en su producción y su transportación
        se busca una disminución de las emisiones de CO2. Estas prácticas también
        benefician a los consumidores porque un comercio justo hace más equilibrado
        todo el sistema económico. Cuanto más justas sean las reglas, mejor será la
        economía."," ","El comercio justo es uno de los movimientos globales que construyen,
        desde el inicio de la cadena productiva, relaciones económicas internacionales
        solidarias y más sostenibles. Se centra en los seres humanos, en la sostenibilidad
        social, ambiental y económica."]}],"relatedTip":{"id":"07_efficiency_tips","img":"deletelogo","title":"Evita
        los productos de un solo uso","linkText":"Leer más","desc":"El uso de productos
        que se usan y se tiran genera una gran cantidad de residuos y la necesidad
        de generar nuevos materiales, porque en ocasiones no pueden reciclarse. Esto
        aumenta el consumo de recursos y de energía.","location":{"dashboard":{"isActive":true},"list":{"isActive":true}}}},{"id":"news25_sustaintabilityBBVA","img":"https://assets.caasbbva.com/spain/app/sustainability/images/energy_efficiency.PNG","date":"15-07-2022","title":"Guía
        para pymes: cómo afrontar los Objetivos de Desarrollo Sostenible (ODS)","desc":"Te
        damos algunos consejos para que sepas cómo incorporar los Objetivos de Desarrollo
        Sostenible (ODS) en la gestión de tu organización empresarial.","content":[{"type":"p","content":["Los
        17 Objetivos de Desarrollo Sostenible, conocidos como ODS, son una llamada
        a la acción que tienen una agenda de desarrollo con la vista puesta en el
        año 2030, en un plan a favor de las personas, el planeta y la prosperidad.
        La novedad de esta agenda 2030 es su grado de ambición: la sostenibilidad
        como aspiración general y el reconocimiento de las empresas como un actor
        imprescindible."," ","Para contribuir a los ODS desde una pyme, te recomendamos
        dar estos cinco pasos:"," "]},{"type":"list-bullet","content":["Entender los
        ODS. Hay que conocer la agenda 2030 para valorar cuál puede ser la contribución
        de la empresa.","Definir prioridades. Los ODS prioritarios serán aquellos
        que puedan tener una mayor incidencia en la actividad empresarial.","Establecer
        objetivos. Estos deberán ir acompañados de una estrategia pública en los ODS.","Integración.
        La guía propone que el compromiso esté presente en todas las acciones y áreas
        de la organización y, por supuesto, los objetivos corporativos deben ser traducidos
        en acciones concretas.","Reportar y comunicar. Todo este esfuerzo tendría
        poco sentido si la empresa no es consciente de su contribución. También es
        necesario poder comunicar a la sociedad estas acciones."]},{"type":"p","content":["Con
        esta línea de trabajo, tu pyme puede implementar los Objetivos de Naciones
        Unidas en su gestión, abriendo camino a la innovación con foco en la sostenibilidad.
        Si esta integración llega a los productos y servicios, aparecerán nuevas oportunidades
        de negocio."]}],"relatedTip":{"id":"04_efficiency_tips","img":"homeappliances","title":"Selecciona
        el modo ahorro en los dispositivos electrónicos","linkText":"Leer más","desc":"El
