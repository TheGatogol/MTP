        de la temperatura del planeta provocada por gases de efecto invernadero."},"list":{"isActive":true}}},{"id":"cer","title":"CER","content":[{"type":"p","content":["Los
        certificados de compensación de emisiones (CER, por sus siglas en inglés),
        también llamados bonos de carbono, son un mecanismo para que las empresas
        y las entidades de gobierno compensen sus emisiones de carbono. Por cada tonelada
