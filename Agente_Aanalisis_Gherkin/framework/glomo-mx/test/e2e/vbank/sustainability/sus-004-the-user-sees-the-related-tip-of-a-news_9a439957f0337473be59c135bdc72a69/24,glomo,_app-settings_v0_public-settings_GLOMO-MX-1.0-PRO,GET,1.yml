        sostenibilidad como principal criterio para el consumo post COVID-19","desc":"Una
        pandemia necesariamente deja huella en todos los aspectos.","content":[{"type":"p","content":["Una
        pandemia necesariamente deja huella en todos los aspectos. Por ejemplo en
        un ciudadano que, siendo la misma persona, ya no es el mismo consumidor. La
        experiencia le hace modificar sus prioridades, pone por encima la salud y
        el medioambiente y está dispuesto a premiar o rechazar con su compra."," ","El
        consumidor en la era post COVID-19, tiende a ser híperconectado, informado
        y exigente. Está sufriendo una pandemia que en parte puede estar relacionada
        con la pérdida de biodiversidad y la degradación medioambiental, que además
        viene a sumarse a una amenaza aún mayor: el cambio climático. Es cada vez
        más consciente de que ambos desafíos, el de las pandemias y los efectos del
        calentamiento global, comparten soluciones."," ","A través de internet, esos
        ciudadanos pueden informarse en tiempo real sobre lo que compran o consumen
        y están dispuestos a cambiar sus preferencias. Tienden a ser menos tolerantes
        con los comportamientos que no son sostenibles. Esperan de las compañías una
        visión responsable en aspectos sociales y medioambientales, que no solo responda
        a los gustos de sus clientes, sino también a sus preocupaciones y anhelos.
        Dicho de otra forma, esperan relaciones más humanizadas con las empresas a
        través de todos los canales, en especial el online."," ","En consecuencia,
        los consumidores que sitúan la sostenibilidad entre sus aspiraciones, incluso
        por delante del precio, están atentos al comportamiento de las marcas e incorporan
        en sus hábitos cotidianos la reducción de consumos (energía, agua, materias
        primas, etc.) y del uso de materiales como el plástico."," ","Te invitamos
        a visitar el sitio bbva.com/es/sostenibilidad/ para que conozcas más sobre
        sostenibilidad en BBVA."]}],"relatedTip":{"id":"08_efficiency_tips","img":"shopping","title":"Lleva
        bolsas de tela para hacer las compras","linkText":"Leer más","desc":"Las bolsas
        de plástico de un solo uso son altamente contaminantes, además de que se necesita
        petróleo para fabricarlas. Sustitúyelas por bolsas de tela en tus compras.","location":{"dashboard":{"isActive":true},"list":{"isActive":true}}}},{"id":"news08_sustaintability","img":"https://assets.caasbbva.com/spain/app/sustainability/images/energy_efficiency.PNG","date":"17-11-2021","title":"¿Qué
        es el calentamiento global?","desc":"El calentamiento global resulta del aumento
        del efecto invernadero.","content":[{"type":"p","content":["El calentamiento
        global resulta del aumento del efecto invernadero, un proceso en el que la
        radiación térmica emitida por la tierra queda atrapada en la atmósfera debido
        a los gases con ese efecto. Su presencia es natural y necesaria para mantener
        la temperatura del planeta en unos valores habitables. El problema es que
        las emisiones de gases como el metano o el óxido nitroso se han disparado
        en comparación con las últimas décadas."," ","En el Acuerdo de París nacido
        en la Cumbre del Clima de 2015, se fijaron 2 objetivos para reducir las emisiones
        de gases causantes del calentamiento global:"]},{"type":"list-bullet","content":["Promover
        un desarrollo sostenible, resiliente al clima y con bajas emisiones de gases
        de efecto invernadero. ","Mantener el aumento global de la temperatura por
        debajo de 2 grados centígrados y proseguir los esfuerzos para limitarlo únicamente
        a 1.5 grados."]},{"type":"p","content":["Cada 24 de octubre se celebra el
        Día Internacional contra el Cambio Climático, con el objetivo de movilizar
        y sensibilizar a personas de todo el mundo acerca de los graves efectos del
        cambio climático y el peligro que conlleva el calentamiento global."," ","Te
        invitamos a visitar el sitio bbva.com/es/sostenibilidad/ para que conozcas
        más sobre sostenibilidad en BBVA."]}],"relatedTip":{"id":"07_efficiency_tips","img":"deletelogo","title":"Evita
        los productos de un solo uso","linkText":"Leer más","desc":"El uso de productos
        que se usan y se tiran genera una gran cantidad de residuos y la necesidad
        de generar nuevos materiales, porque en ocasiones no pueden reciclarse. Esto
        aumenta el consumo de recursos y de energía.","location":{"dashboard":{"isActive":true},"list":{"isActive":true}}}},{"id":"news07_sustaintability_energies","img":"https://assets.caasbbva.com/spain/app/sustainability/images/energy_efficiency.PNG","date":"30-09-2021","title":"La
        movilidad sostenible en México, importante para combatir el cambio climático","desc":"De
        acuerdo con el reciente informe emitido por el Grupo Intergubernamental de
        Expertos sobre el Cambio Climático.","content":[{"type":"p","content":["De
        acuerdo con el reciente informe emitido por el Grupo Intergubernamental de
        Expertos sobre el Cambio Climático (IPCC, por sus siglas en inglés), los científicos
        están observando cambios en el clima de la Tierra en todas las regiones y
        en el sistema climático en su conjunto y resaltan que este cambio es rápido
        y se está intensificando."," ","El informe del IPCC deja en manifiesto que
        “las acciones humanas todavía pueden determinar el curso futuro del clima.
        Hay pruebas claras de que el dióxido de carbono (CO2) es el principal causante
        del cambio climático, aunque otros gases de efecto invernadero y contaminantes
        atmosféricos también afectan al clima”."," ","<strong>Alternativas para avanzar
        en la movilidad sostenible</strong>"," ","El cambio a autos híbridos o eléctricos.
        Tal vez puede parecer una gran inversión, pero, debido a que paulatinamente
        se dejará de fabricar autos con motores de combustión, en poco tiempo el costo
        de un auto con tecnología eficiente y amigable con el medioambiente estará
        en un rango más competitivo y asequible para la mayoría de los bolsillos.","
        ","Utilizar bicicleta. Es uno de los mejores ejemplos de movilidad urbana
        sostenible. El traslado por este medio de transporte tiene una serie de ventajas
        importantes para las personas pues aumenta su actividad física mejorando su
        salud, así como su calidad de vida. "," ","Sin duda, en México se comienza
        a ver un pequeño cambio positivo en las personas para reducir la huella de
        carbono, pero es necesario ir incorporando estas alternativas de movilidad
        sustentable a la vida cotidiana ya que además de su eficiencia, se contribuye
        con acciones para detener el cambio climático."," ","Te invitamos a visitar
        el sitio bbva.com/es/sostenibilidad/ para que conozcas más sobre sostenibilidad
        en BBVA."]}],"relatedTip":{"id":"06_efficiency_tips","img":"bicycle","title":"Camina
        o usa la bicicleta cuando sea posible","linkText":"Leer más","desc":"En ocasiones,
        utilizamos el auto para trayectos cortos que podríamos hacer a pie o en bicicleta.
        Cambia tu modo de transporte en ellos, así ahorrarás gasolina y reducirás
        tus emisiones. Además, tu salud te lo agradecerá.","location":{"dashboard":{"isActive":true},"list":{"isActive":true}}}},{"id":"news08_sustaintability_energies","img":"https://assets.caasbbva.com/spain/app/sustainability/images/energy_efficiency.PNG","date":"30-09-2021","title":"¿Qué
        es el reciclaje y por qué es importante reciclar?","desc":" El reciclaje es
        el proceso de recolección y transformación de materiales","content":[{"type":"p","content":["El
        reciclaje es el proceso de recolección y transformación de materiales para
        convertirlos en nuevos productos, y que de otro modo serían desechados como
        basura."," ","Existen tres tipos principales. El reciclaje primario convierte
        los materiales en más de lo mismo, como papel en más papel. El secundario
        transforma un producto desechado en otros objetos aunque fabricados con el
        mismo material. Y el terciario descompone químicamente los materiales para
        producir con ellos algo muy diferente."," ","<strong>¿Por qué es importante
        reciclar? </strong>"," ","La Global Recycling Foundation señala múltiples
        ventajas, aunque pueden resumirse en que conserva los recursos naturales y
        reduce la sobreexplotación de materias primas protegiendo así los hábitats.
        Contribuye además a economizar energía ya que se necesita mucha más energía
        para extraer, refinar, transportar y procesar materias primas que para transformar
        materiales reciclados ya disponibles."," ","<strong>Un esfuerzo colectivo
        </strong>"," ","El reciclaje va mucho más allá de las cuestiones técnicas
        y económicas, implica un esfuerzo colectivo que involucra a toda la sociedad:
        desde los hábitos ciudadanos en la separación de residuos para facilitar el
        ciclo de reciclaje, hasta las administraciones públicas que deben facilitar
        ese servicio."," ","Te invitamos a visitar el sitio bbva.com/es/sostenibilidad/
        para que conozcas más sobre sostenibilidad en BBVA."]}],"relatedTip":{"id":"04_efficiency_tips","img":"homeappliances","title":"Selecciona
        el modo ahorro en los dispositivos electrónicos","linkText":"Leer más","desc":"El
        modo ahorro de energía de pantallas y otros dispositivos electrónicos disminuye
        su consumo de energía. También es recomendable usar fondos de pantalla oscuros
        y disminuir el brillo de las pantallas cuando no sea necesario tenerlo al
        máximo."},"location":{"dashboard":{"isActive":true},"list":{"isActive":true}}},{"id":"news05_sustaintability_energies","img":"https://assets.caasbbva.com/spain/app/sustainability/images/energy_efficiency.PNG","date":"27-08-2021","title":"¿Qué
        son las energías renovables y por qué son importantes?","desc":" Las energías
        renovables proceden de fuentes naturales en esencia inagotables.","content":[{"type":"p","content":["Las
        energías renovables proceden de fuentes naturales en esencia inagotables,
        como el viento, el sol, la fuerza del agua o la materia vegetal gestionada
        de forma sostenible, y al no emitir gases de efecto invernadero (GEI) son
        la principal herramienta para la transición energética hacia un mundo bajo
        en carbono."," ","<strong>Tipos de energías renovables </strong>"," ","La
        energía solar, en su variedad fotovoltaica, es una de las renovables con mayor
        grado de madurez y proyección."," ","La energía eólica instalada en el mundo
        creció un 10% en 2019, según datos del Global Wind Energy Council (GWEC).","
        ","Por su parte, la energía hidráulica aprovecha la fuerza del agua fluvial
        para que las centrales hidroeléctricas la conviertan primero en mecánica y
        posteriormente en eléctrica. "," ","La diversidad natural del planeta completa
        el álbum con fuentes renovables consagradas y emergentes, como los biocarburantes
        obtenidos a partir de restos agrícolas y animales."," "," ","<strong>Compromiso
        social y medioambiental </strong>"," ","Antes de iniciar el siglo, las energías
        renovables apenas figuraban en las políticas de Responsabilidad Social Empresarial
        (RSE), hoy son protagonistas en términos de sostenibilidad, eficiencia energética
        y respeto al medio ambiente en las memorias corporativas."," ","Grandes y
        pequeñas empresas trazan hojas de ruta sostenibles que involucran a sus cadenas
        de valor y exigen a sus proveedores buenas prácticas sostenibles. Existe incluso
        la Agencia Internacional de Energías Renovables (IRENA), un organismo intergubernamental,
        con 162 países adscritos."," ","Te invitamos a visitar el sitio bbva.com/es/sostenibilidad/
        para que conozcas más sobre sostenibilidad en BBVA."]}],"relatedTip":{"id":"09_efficiency_tips","img":"trashcan","title":"Separa,
        recicla y reutiliza","linkText":"Leer más","desc":"Hacer una buena gestión
        de los residuos domésticos disminuye la contaminación y, además, ayuda a reutilizar
        materiales.","location":{"dashboard":{"isActive":true},"list":{"isActive":true}}}},{"id":"news06_sustaintability_solar_panels","img":"https://assets.caasbbva.com/spain/app/sustainability/images/energy_efficiency.PNG","date":"27-08-2021","title":"¿Qué
        son los paneles solares, cómo funcionan y cuál es su futuro?","desc":" El
        sol puede proporcionar energía suficiente para dar electricidad a todo el
        planeta. Pero no puede hacerlo directamente.","content":[{"type":"p","content":["El
        sol puede proporcionar energía suficiente para dar electricidad a todo el
        planeta. Pero no puede hacerlo directamente. Los paneles solares son el intermediario
        que hace que la luz solar nos sirva de energía. Su diseño es simple y al mismo
        tiempo muy eficaz y permite el autoconsumo. En un futuro próximo, los paneles
        generarán electricidad incluso de noche."," ","<strong>El sol como energía
        alternativa</strong>"," ","Una sola hora de sol bastaría para abastecer las
        demandas energéticas de la humanidad durante todo un año. La afirmación no
        es exagerada y explica la importancia de que el ser humano sea capaz de convertir
        en energía eléctrica lo que el sol regala."," ","Pero ¿cómo se lleva a cabo
        ese proceso casi milagroso? A través de dos sencillas instalaciones: las instalaciones
        solares de paneles fotovoltaicos (más conocidas como placas o paneles solares)
        y las térmicas."," ","<strong>Futuro fotovoltaico</strong>"," ","La Universidad
        de Stanford (EE. UU.) desarrolló una instalación capaz de generar electricidad
        cuando el sol ya se ha ido. Las placas solares ‘a la inversa’ aprovechan la
        energía que irradian las placas después de muchas horas de sol. Este fenómeno
        se conoce como ‘enfriamiento radiativo’ y se produce cuando un cuerpo va perdiendo
        calor después de altas temperaturas. "," ","Recuperar ese calor que se desprende,
        incluso de noche, podría ser una solución para que los paneles rindan más.","
        ","Te invitamos a visitar el sitio bbva.com/es/sostenibilidad/ para que conozcas
        más sobre sostenibilidad en BBVA."]}],"relatedTip":{"id":"03_efficiency_tips","img":"idea","title":"Usa
        iluminación LED","linkText":"Leer más","desc":"Los focos LED pueden ayudarte
        a ahorrar 80% de la energía que consumen los focos tradicionales. Además,
        su tiempo de vida útil puede llegar a ser 30 veces mayor."},"location":{"dashboard":{"isActive":true},"list":{"isActive":true}}},{"id":"news01_sustaintability","img":"https://assets.caasbbva.com/spain/app/sustainability/images/energy_efficiency.PNG","date":"25-06-2021","title":"¿Qué
        es sostenibilidad? ","desc":" La manera de garantizar las necesidades presentes
        sin comprometer las futuras.","content":[{"type":"p","content":["<strong>Sostenibilidad
        es una palabra que oímos cada vez más, pero ¿qué quiere decir? ¿Por qué es
        tan importante?</strong>"," ","La sostenibilidad es un concepto cada vez más
        importante en la sociedad, porque está relacionado con el futuro que estamos
        construyendo en nuestro planeta. Su significado es satisfacer nuestras necesidades
        actuales sin comprometer la capacidad de las generaciones futuras para satisfacer
        las suyas. Por ello, uno de los términos que más tiene que ver con ella es
        el equilibrio."," "," ","<strong>¿Qué equilibrio buscamos?</strong>"," ","Muchas
        veces solo asociamos sostenibilidad con el medioambiente. Sin embargo, este
        equilibrio tiene que conseguirse en todos los ámbitos, por lo cual se habla
        de sostenibilidad medioambiental, social y económica."," ","Cada una de estas
        perspectivas de la sostenibilidad se enfoca en diferentes aspectos: "]},{"type":"list-bullet","content":["Medioambiental:
        lleva a cabo acciones relacionadas con el cuidado del planeta, como promover
        un uso más adecuado de los recursos y el consumo de energías renovables.","Social:
        defiende y protege los derechos humanos, laborales y culturales de las personas.
        Atiende cuestiones como la igualdad de género; el empleo pleno, productivo
        y decente, y la inclusividad.","Económica: promueve la independencia económica
        y el acceso a los recursos para toda la sociedad. "]},{"type":"p","content":["Como
        vemos, estas perspectivas tienen como objetivo prioritario lograr el equilibrio
        en la gestión de los recursos para que puedan llegar a todas las personas,
        mientras que se garantiza su uso a lo largo del tiempo."," "," ","<strong>El
        camino global hacia el equilibrio</strong>"," ","La sostenibilidad invita
        a crear una conciencia global, gracias a la cual todas las personas comprendan
        que vivimos en un planeta interconectado y que nuestras acciones afectan al
        mundo en general. Para alcanzar plenamente el desarrollo sostenible, es necesario
        tener un esfuerzo individual y colectivo. BBVA está comprometido con este
        objetivo y ofrece apoyo a sus clientes a través de las finanzas y las inversiones
        sostenibles."," "," ","<strong>Paso a paso</strong>"," ","Muchas veces no
        nos atrevemos a hacer cambios porque pensamos que van a requerir mucho tiempo,
        inversión económica o que su repercusión no va a ser significativa. Sin embargo,
        podemos comenzar con pequeñas acciones en casa y en nuestros hábitos diarios
        que nos ayuden a ser más sostenibles y a tener un impacto menos dañino en
        el planeta. Revisa nuestras recomendaciones y forma parte del cambio."," ","
        ","Te invitamos a visitar el sitio bbva.com/es/sostenibilidad/ para que conozcas
        más sobre sostenibilidad en BBVA."]}],"relatedTip":{"id":"09_efficiency_tips","img":"trashcan","title":"Separa,
        recicla y reutiliza","linkText":"Leer más","desc":"Hacer una buena gestión
        de los residuos domésticos disminuye la contaminación y, además, ayuda a reutilizar
        materiales."},"location":{"dashboard":{"isActive":true},"list":{"isActive":true}}},{"id":"news_032_news_generations","img":"https://assets.caasbbva.com/spain/app/sustainability/images/3_que-son-los-ods.png","date":"25-06-2021","title":"¿Qué
        son los gases de efecto invernadero?","desc":"La temperatura del planeta está
        subiendo. ¿Sabes por qué?","content":[{"type":"p","content":["Es un hecho
        que la temperatura del planeta se está elevando, lo oímos con mucha frecuencia
        de la voz de los expertos. La preocupación es real porque este aumento provoca
        una alteración en el clima, lo que trae más sequías, inundaciones y otros
        fenómenos meteorológicos extremos. La emisión de gases de efecto invernadero
        está provocando este cambio climático, pero ¿qué son y cómo se emiten?","
        "," ","<strong>¿De dónde provienen los gases de efecto invernadero?</strong>","
        ","En los últimos años, la humanidad consume energía y genera residuos a un
        ritmo muy perjudicial para el medioambiente. Prácticamente toda la actividad
        humana provoca una emisión grande y constante de gases de efecto invernadero.","
        ","La función de estos gases es retener en la atmósfera la radiación infrarroja
        del Sol. En cierto sentido, son necesarios porque sin ellos no sería posible
        vivir sobre la superficie terrestre, pues mantienen la temperatura adecuada
        para que los humanos y otras especies puedan sobrevivir. Sin embargo, el exceso
        de emisiones ha provocado un efecto no deseado: que la temperatura promedio
        del planeta se eleve demasiado."," "," ","<strong>¿Qué efecto tiene el aumento
        de estos gases?</strong>"," ","El problema surge cuando la actividad humana
        produce demasiados gases de efecto invernadero y en consecuencia se altera
        la atmósfera de la Tierra. Algunas actividades con las que más los producimos
        son el consumo de energía eléctrica, la generación de residuos, el uso de
        combustibles de origen fósil y la agricultura y ganadería intensivas."," ","La
        acumulación de gases en la atmósfera puede alcanzar niveles que dejan de ser
        adecuados para la vida, porque provocan un progresivo calentamiento global.
        En las últimas décadas, el incremento de la temperatura ha sido de unos cuantos
        grados centígrados, pero, por pocos que sean, las consecuencias son graves.
        Por ejemplo, aumentan las sequías en zonas fértiles, lo que puede generar
        desabasto de alimentos, y al mismo tiempo se derriten los hielos de los polos,
        lo que aumenta el nivel del mar y provoca inundaciones en lugares habitados.","
        "," ","<strong>¿Qué actividades cotidianas generan estos gases?</strong>","
        ","En la vida cotidiana, muchas de nuestras actividades producen gases de
        efecto invernadero. Por ejemplo, manejar el auto en distancias cortas en vez
        de caminar, dejar las luces de casa encendidas, desechar prendas de ropa y
        dispositivos electrónicos en vez de darles una segunda oportunidad, consumir
        productos que vienen desde lejos y por lo tanto requieren de mucha gasolina
        para su transporte, entre muchas otras."," ","Evitar la emisión masiva de
        este tipo de gases está a nuestro alcance, empezando con pequeños cambios.
        Revisa nuestras recomendaciones para conocer cómo puedes contribuir a su disminución
        en tu día a día. "," "," ","Te invitamos a visitar el sitio bbva.com/es/sostenibilidad/
        para que conozcas más sobre sostenibilidad en BBVA."]}],"relatedTip":{"id":"05_efficiency_tips","img":"carleaf","title":"Maneja
        el auto de forma más eficiente","linkText":"Leer más","desc":"No abusar de
        la primera marcha o hacer un buen uso de las marchas largas puede ayudarte
        a reducir el consumo de gasolina y, además, a generar menos emisiones de contaminación."},"location":{"dashboard":{"isActive":true},"list":{"isActive":true}}},{"id":"news_032_news_recomendations","img":"https://assets.caasbbva.com/spain/app/sustainability/images/3_que-son-los-ods.png","date":"25-06-2021","title":"Conoce
        cómo ahorrar energía eléctrica en casa","desc":"Con pequeñas acciones es posible
        reducir tu consumo de energía.","content":[{"type":"p","content":["Una de
        las formas de ahorrar electricidad en casa es conseguir la eficiencia energética,
        que puede definirse como un equilibrio entre el consumo de electricidad y
        las necesidades reales de las personas. Esta eficiencia ayuda a bajar el costo
        del recibo de la luz y a reducir las posibilidades de sufrir un apagón, algo
        que puede provocar que los electrodomésticos se descompongan. Lograr el equilibrio
        no necesariamente significa invertir en mejoras para el hogar; con simples
        cambios en el uso de los electrodomésticos y los dispositivos electrónicos
        es posible."," "," ","<strong>¿Cómo reducir el consumo de los electrodomésticos?</strong>","
        ","Aprovechar la capacidad de la lavadora y el lavaplatos o hacer un buen
        uso del refrigerador pueden contribuir a reducir su consumo. A continuación
        te ofrecemos ideas que te ayudarán a ahorrar energía sin afectar la limpieza
        de tu ropa o tu vajilla ni la calidad de tus alimentos"]},{"type":"list-bullet","content":["Lava
        la ropa en una sola carga en la lavadora. Si tienes lavaplatos, ocúpalo con
        la mayor cantidad de platos posible. Este cambio contribuye a consumir menos
        energía y agua","Centrifuga la ropa para que salga más seca y procura tenderla
        al aire libre para aprovechar la luz solar y el viento","Abre la puerta del
        refrigerador lo menos posible y regula su temperatura a 5 ºC y a -18 ºC la
        del congelador. Si tu refrigerador no tiene termostato, regúlalo según la
        época del año: potencia al mínimo en invierno y media en verano.","Descongela
        los alimentos dentro del refrigerador para evitar el crecimiento de bacterias.
        También así aprovechas el frío para mantener estable la temperatura del aparato.","Separa
        el refrigerador unos 5 centímetros de la pared para que el calor generado
        por el motor se disipe con mayor facilidad."]},{"type":"p","content":["<strong>¿Cómo
        reducir el consumo de los dispositivos electrónicos?</strong>"," ","El celular,
        la televisión y la computadora son los dispositivos que más electricidad consumen,
        pero es posible reducirla prestando atención a algunos detalles:"]},{"type":"list-bullet","content":["Apaga
        los dispositivos completamente cuando no los estés usando, ya que siguen consumiendo
        energía en el modo reposo. Una herramienta que te puede ayudar son las extensiones
        con interruptor, así podrás apagar todos tus aparatos con un solo botón cuando
        te vayas a dormir o salgas de casa.","Reduce el brillo de las pantallas. Su
        iluminación es uno de los factores que más energía consume. Usar un brillo
        medio puede disminuir el consumo hasta en 20%, mientras que el mínimo lo reduce
        hasta en 40%. ","Desenchufa los cargadores cuando no cargues batería. Aunque
        el dispositivo no esté conectado, algunos cargadores siguen consumiendo energía.
        ","Desactiva las notificaciones que no sean necesarias para evitar que la
        pantalla de tu dispositivo se encienda con mucha frecuencia. "]},{"type":"p","content":["Aunque
        parezcan acciones pequeñas, todos suman a la hora de reducir el consumo eléctrico
        de nuestros dispositivos y electrodomésticos. Gracias a ellas podremos conseguir
        ahorrar en nuestros recibos de luz y, además, reducir el volumen de nuestras
        emisiones de carbono, lo que hará que nuestro día a día sea más sostenible.
        "," "," ","Te invitamos a visitar el sitio bbva.com/es/sostenibilidad/ para
        que conozcas más sobre sostenibilidad en BBVA."]}],"relatedTip":{"id":"03_efficiency_tips","img":"Idea","title":"Usa
