        o una alteración en el medio ambiente causada por la intervención humana."},"list":{"isActive":true}}},{"id":"sustainability_development_aim","title":"Objetivos
        de Desarrollo Sostenible","content":[{"type":"p","content":["Iniciativa de
        la ONU que consiste en 17 principios y 169 metas para erradicar la pobreza,
        proteger el planeta y garantizar la paz y la prosperidad de todas las personas."]}],"location":{"dashboard":{"isActive":false,"desc":"17
        retos que apoyan la igualdad entre personas, cuidar el planeta y el progreso."},"list":{"isActive":true}}},{"id":"pimus","title":"PIMUS","content":[{"type":"p","content":["Un
        plan integral de movilidad urbana sustentable (PIMUS) es una herramienta para
        integrar la movilidad de las personas en los planes de desarrollo urbano y
        económico. Su objetivo es que los municipios y las ciudades tengan espacios
        públicos de calidad y se agilicen los traslados de las personas a través de
        diferentes modos de transporte conectados entre sí, con estándares de calidad,
