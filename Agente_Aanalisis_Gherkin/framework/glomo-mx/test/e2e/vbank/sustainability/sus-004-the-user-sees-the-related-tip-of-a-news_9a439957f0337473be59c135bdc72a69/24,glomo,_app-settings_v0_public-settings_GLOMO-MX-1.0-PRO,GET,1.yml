        su consumo de energía. También es recomendable usar fondos de pantalla oscuros
        y disminuir el brillo de las pantallas cuando no sea necesario tenerlo al
        máximo.","location":{"dashboard":{"isActive":true},"list":{"isActive":true}}}},{"id":"news24_sustaintabilityBBVA","img":"https://assets.caasbbva.com/spain/app/sustainability/images/energy_efficiency.PNG","date":"15-07-2022","title":"Fondos
        sostenibles: invertir en verde es el mejor ahorro","desc":"Los fondos verdes
        o sostenibles  son instituciones de inversión colectiva que eligen los activos
        que conforman su cartera  con base en criterios ambientales, sociales y de
        gobierno corporativo.","content":[{"type":"p","content":["Las finanzas sostenibles
        tienen la capacidad de canalizar el ahorro influyendo en el tipo de desarrollo
        que se busca. Su objetivo es contribuir al crecimiento económico a largo plazo,
        unido a un desarrollo más humano, donde se establezca un equilibrio entre
        lo económico, lo ambiental y lo social."," ","Al invertir en un fondo sostenible
        se está financiando, indirectamente y a cambio de una rentabilidad, a aquellas
        empresas responsables en términos sociales, premiando su comportamiento y
        contribuyendo a su crecimiento."," ","El sector de fondos de inversión se
        está adaptando a un nuevo contexto económico. Este busca  una forma original
        de entender los negocios tras la irrupción de tecnologías y de una mayor conciencia
        social. Ahora la industria de gestión de activos está cargada de retos y oportunidades.","
        ","Finalmente, los fondos de inversión sostenible parten de una estrategia
        de diferenciación y hay aseguradoras, bancos y gestoras de activos que incorporan
        estas gestiones en su misión y visión para atraer nuevo capital hacia una
        inversión más responsable."]}],"relatedTip":{"id":"09_efficiency_tips","img":"trashcan","title":"Separa,
        recicla y reutiliza","linkText":"Leer más","desc":"Hacer una buena gestión
        de los residuos domésticos disminuye la contaminación y, además, ayuda a reutilizar
        materiales.","location":{"dashboard":{"isActive":true},"list":{"isActive":true}}}},{"id":"news23_sustaintabilityBBVA","img":"https://assets.caasbbva.com/spain/app/sustainability/images/energy_efficiency.PNG","date":"17-06-2022","title":"¿Qué
        es la ecología? La ciencia que entiende el planeta.","desc":"La ecología nos
        hace entender que todas las especies están conectadas entre sí y con su medio,
        formando los ecosistemas.","content":[{"type":"p","content":["Alexander von
        Humboldt, un científico y explorador alemán, fue uno de los padres de la ecología.
        A principios del siglo XIX, recorrió los territorios de lo que hoy es Venezuela,
        Colombia, México y Perú. En todos sus viajes, Humboldt buscaba entender la
        relación entre las especies animales y vegetales con el medio. Sus viajes
        por América abrieron camino para otros grandes exploradores científicos como
        Darwin e inspiraron a más personas."," ","En el mismo siglo, Ernst Haeckel,
        un estudioso de la biología, propuso por primera vez el término ecología para
        referirse al estudio de las relaciones de los seres vivos entre sí y con el
        medioambiente."," ","Durante el siglo XX, la ecología se desarrolló y ganó
        estatus científico con la aparición de nuevas teorías y conceptos, así como
        la publicación de estudios detallados y profundos sobre los ecosistemas. Hoy
        es una ciencia que intenta avanzar en el entendimiento de las dinámicas complejas
        que rigen nuestro planeta."," ","Nosotros, como seres humanos, formamos parte
        de los sistemas ecológicos y, como todos los organismos, los alteramos. Debido
        a nuestra diversidad cultural y actividades económicas, tales como la ganadería
        y la agricultura, la alteración del medio es mucho más profunda."," ","La
        ciencia de la ecología debe ayudarnos a entender de qué manera los ecosistemas
        reaccionan a nuestro impacto y a hacer propuestas que mejoren nuestra relación
        con el entorno."]}],"relatedTip":{"id":"07_efficiency_tips","img":"deletelogo","title":"Evita
        los productos de un solo uso","linkText":"Leer más","desc":"El uso de productos
        que se usan y se tiran genera una gran cantidad de residuos y la necesidad
        de generar nuevos materiales, porque en ocasiones no pueden reciclarse. Esto
        aumenta el consumo de recursos y de energía.","location":{"dashboard":{"isActive":true},"list":{"isActive":true}}}},{"id":"news22_sustaintabilityBBVA","img":"https://assets.caasbbva.com/spain/app/sustainability/images/energy_efficiency.PNG","date":"17-06-2022","title":"¿Qué
        podemos reciclar y dónde debemos depositar los residuos?","desc":"Podemos
        reciclar muchas cosas, el reto consiste en aprender a aprovechar los residuos
        y darles una segunda vida.","content":[{"type":"p","content":["Podemos reciclar
        muchas cosas: aparatos electrónicos, pilas, y la mayoría de productos y envases
        que terminan su vida útil en un hogar. Sin embargo, aún hay residuos que necesitan
        un proceso de reciclaje más complejo, por ejemplo: tubos de pasta de dientes,
        encendedores desechables, bolsas de frituras y envolturas de plástico.","
        ","El reto consiste en aprender a reciclar correctamente y aprovechar los
        productos para una segunda vida. Esto incluye visitar un punto de recolección
        cuando sea necesario. Un punto de recolección es el lugar donde se almacenan
        temporalmente residuos que podrían ser peligrosos si se arrojaran en contenedores
        convencionales. Aquí te ponemos ejemplos de productos del hogar difíciles
        de reciclar y qué hacer con ellos."," ","Las pilas están compuestas principalmente
        por metales pesados como plomo y mercurio, los cuales pueden causar graves
        daños a la salud. Por eso, es muy importante ubicar contenedores de acopio
        de pilas, para disponer de forma segura de estos residuos. Generalmente los
        puedes encontrar en escuelas, universidades, supermercados, centros comerciales
        etc."," ","Los medicamentos caducados o fuera de uso no se pueden tirar a
        la basura, al inodoro o por el desagüe, ya que tienen componentes químicos
        potencialmente contaminantes. Puedes desecharlos en cualquiera de los hospitales,
        farmacias y demás puntos de recolección del Sistema Nacional de Gestión de
        Residuos de Envases de Medicamentos."," ","Haciendo uso de contenedores para
        separar correctamente los residuos de tu hogar puedes ayudar al cuidado del
        medio ambiente."]}],"relatedTip":{"id":"09_efficiency_tips","img":"trashcan","title":"Separa,
        recicla y reutiliza","linkText":"Leer más","desc":"Hacer una buena gestión
        de los residuos domésticos disminuye la contaminación y, además, ayuda a reutilizar
        materiales.","location":{"dashboard":{"isActive":true},"list":{"isActive":true}}}},{"id":"news21_sustaintabilityBBVA","img":"https://assets.caasbbva.com/spain/app/sustainability/images/energy_efficiency.PNG","date":"16-05-2022","title":"Concluye
        el primer proyecto de colaboración entre la Cooperación Alemana al Desarrollo
        Sustentable y BBVA México","desc":"El estudio tiene el objetivo de fortalecer
        las capacidades técnicas del personal del banco y de sus clientes en la transición
        hacia la sostenibilidad.","content":[{"type":"p","content":["Gracias a uno
        de los programas de la Cooperación Alemana al Desarrollo Sustentable (GIZ,
        por sus siglas en alemán), “Apoyo a la Implementación de la Transición Energética
        en México” (TrEM) se desarrolló con el apoyo de BBVA México el estudio “Generación
        Distribuida - Introducción y Conceptos clave”. Con este material se concluye
        uno de los proyectos de trabajo que tienen en conjunto estas dos instituciones.","
        ","El estudio tiene como uno de los objetivos, fortalecer las capacidades
        técnicas del personal del banco, abarcando conceptos básicos de tecnología,
        así como aspectos económicos y regulatorios de la Generación Solar Distribuida
        (GSD). De esta manera, BBVA México continúa robusteciendo sus conocimientos
        técnicos para así poder ser el asesor de sus clientes en la transición hacia
        la sostenibilidad."," ","Adriana Aragón, directora del Programa TrEM, señaló
        que la alianza con BBVA México ha sido clave para dinamizar el mercado de
        GSD en México mediante la oferta de nuevos productos especializados que permiten
        un mayor despliegue de tecnologías sustentables."," ","El estudio fue dado
        a conocer a especialistas, académicos, personas del sector de energías renovables,
        potenciales clientes y público en general  a través del webinar “Generación
        Solar Distribuida en México”. El documento está disponible a través de los
        sitios web de BBVA México y de la GIZ."]}],"relatedTip":{"id":"04_efficiency_tips","img":"homeappliances","title":"Selecciona
        el modo ahorro en los dispositivos electrónicos","linkText":"Leer más","desc":"El
        modo ahorro de energía de pantallas y otros dispositivos electrónicos disminuye
        su consumo de energía. También es recomendable usar fondos de pantalla oscuros
        y disminuir el brillo de las pantallas cuando no sea necesario tenerlo al
        máximo.","location":{"dashboard":{"isActive":true},"list":{"isActive":true}}}},{"id":"news20_sustaintabilityBBVA","img":"https://assets.caasbbva.com/spain/app/sustainability/images/energy_efficiency.PNG","date":"16-05-2022","title":"BBVA
        México impulsa el aprendizaje de finanzas personales en niños","desc":"BBVA
        México lanza la sección “Ciudad dinero” para fomentar en niños y niñas el
        aprendizaje del ahorro, establecer metas y cómo alcanzarlas.","content":[{"type":"p","content":["BBVA
        México, en su sitio web, pone a disposición de todos los niños una nueva sección
        llamada ''Ciudad dinero'', que busca enseñar y facilitarles el aprendizaje
        de los conceptos básicos de ahorro, a establecer metas y definir estrategias
        para alcanzarlas. La sección incluye información y consejos para los adultos,
        así como dinámicas descargables que ayudan a los niños a cultivar la paciencia
        y a vivir la experiencia de ver cumplidas sus metas."," ","Las experiencias
        en el sitio inician desde conocer los conceptos básicos como ahorro y gasto.
        A través de dinámicas los niños obtienen ingresos, hacen pagos y presupuestos.
        También hay dinámicas para establecer metas de ahorro y tener la vivencia
        de los beneficios que se tienen con él. Se espera que durante el año se superen
        las 50,000 visitas a los contenidos y dinámicas del sitio."," ","''Ciudad
        dinero'' se encontrará en constante actualización e irá incorporando dinámicas
        descargables, videocuentos y consejos para los niños y para los adultos, y
        es una acción más que se encuentra alineada a la prioridad estratégica de
        BBVA para mejorar la salud financiera de sus clientes."," ","Puedes visitar
        “Ciudad dinero” en https://www.bbva.mx/educacion-financiera/ninos.html"]}],"relatedTip":{"id":"09_efficiency_tips","img":"trashcan","title":"Separa,
        recicla y reutiliza","linkText":"Leer más","desc":"Hacer una buena gestión
        de los residuos domésticos disminuye la contaminación y, además, ayuda a reutilizar
        materiales.","location":{"dashboard":{"isActive":true},"list":{"isActive":true}}}},{"id":"news18_sustaintabilityBBVA","img":"https://assets.caasbbva.com/spain/app/sustainability/images/energy_efficiency.PNG","date":"28-04-2022","title":"El
        trabajo remoto ayuda al medioambiente, pero hay que aprender cómo.","desc":"El
        trabajo remoto hace de nuestro mundo un lugar más sostenible. Estamos ante
        una gran oportunidad y debemos aprovecharla.","content":[{"type":"p","content":["El
        trabajo remoto, en casi todas sus facetas, debería implicar una mejora para
        el medioambiente. El no tener que usar el coche para ir a la oficina cada
        mañana puede ser la medida más útil para reducir las emisiones de gases de
        efecto invernadero."," ","Tras más de dos años de emergencia sanitaria, muchos
        hogares aún no están adaptados a las necesidades laborales. Hay personas que
        siguen trabajando en lugares improvisados (sobre su cama o utilizando la mesa
        del comedor) y no han creado un sitio adecuado para hacerlo de forma confortable.","
        ","Para conseguir que el trabajo remoto sea sostenible, es fundamental tratar
        de reducir al máximo el consumo de energía eléctrica. Para empezar, es clave
        aprovechar la luz natural tantas horas del día como nos sea posible; también
        podemos apagar la computadora al terminar de trabajar para evitar un consumo
        de energía innecesaria, que además genera un desgaste adicional del equipo.","
        ","El trabajo remoto ha traído algunos beneficios. Por ejemplo, la reducción
        del uso de papel en las oficinas o el ahorro de agua y electricidad al no
        tener que lavar y planchar tanta ropa como cuando vamos a la oficina todos
        los días. Si a todo esto añadimos fuentes de energía renovables, los efectos
        sobre el medioambiente se multiplicarían por diez."," ","El trabajo remoto
        no se puede improvisar, pero hay que ser conscientes de que puede ser una
        palanca casera para que este mundo sea un lugar cada vez más sostenible.","
        ","Te invitamos a visitar el sitio bbva.com/es/sostenibilidad/ para que conozcas
        más sobre sostenibilidad en BBVA."]}],"relatedTip":{"id":"04_efficiency_tips","img":"homeappliances","title":"Selecciona
        el modo ahorro en los dispositivos electrónicos","linkText":"Leer más","desc":"El
        modo ahorro de energía de pantallas y otros dispositivos electrónicos disminuye
        su consumo de energía. También es recomendable usar fondos de pantalla oscuros
        y disminuir el brillo de las pantallas cuando no sea necesario tenerlo al
        máximo.","location":{"dashboard":{"isActive":true},"list":{"isActive":true}}}},{"id":"news19_sustaintabilityBBVA","img":"https://assets.caasbbva.com/spain/app/sustainability/images/energy_efficiency.PNG","date":"28-04-2022","title":"Cómo
        aplicar la movilidad sostenible.","desc":"Para combatir al cambio climático
        es indispensable cuestionarnos cómo nos movemos en la ciudad en la que vivimos.","content":[{"type":"p","content":["La
        movilidad sostenible es el conjunto de medios, estrategias y políticas relativas
        al desplazamiento y transporte de personas y mercancías con bajo costo social,
        ambiental y energético. Esto se puede aplicar a trayectos internacionales
        o locales."," ","En los últimos años, la principal forma de abordar la movilidad
        sostenible ha sido a través de la reducción de emisiones de gases de efecto
        invernadero. Sin embargo, la solución podría ser más compleja que solo sustituir
        los vehículos actuales por otros menos contaminantes. Piensa en tu trayecto
        diario. ¿Qué ves? Lo más probable es que coches. Si sustituimos todos esos
        vehículos por sus versiones verdes, de tamaño y ocupación similares, las calles
        seguirían saturadas. La movilidad sostenible implica encontrar medios de transporte
        menos contaminantes, pero también formas de descongestionar el espacio público.","
        ","En México, se ha desarrollado el plan M4S (Saludable, Segura, Sustentable
        y Solidaria) que establece varios ejes clave para el desarrollo sostenible.
        Entre ellos se encuentra el tema de movilidad, que define la planificación
        de corredores verdes en donde se promueven la movilidad peatonal y de bicicleta,
        el uso del transporte público, la restricción de vehículos y la monitorización
        de la calidad del aire."," ","Otra de las claves de éxito de un plan de movilidad
        sostenible, es la combinación de formas de transporte, como la bicicleta,
        autobús y metro, para llegar a tu destino. Para ello, es importante dar opciones
        para que cualquier ciudadano vea más ventajas que problemas al dejar de lado
        el coche."," ","Sea cual sea la fórmula, no cabe duda que promover la movilidad
        sostenible, es pensar en una política de convivencia con alternativas útiles,
        intercambiables y seguras. La calle ya no es solo de los coches. Las intervenciones
        a pequeña escala pueden generar grandes cambios."," ","Te invitamos a visitar
        el sitio bbva.com/es/sostenibilidad/ para que conozcas más sobre sostenibilidad
        en BBVA."]}],"relatedTip":{"id":"06_efficiency_tips","img":"bicycle","title":"Camina
        o usa la bicicleta cuando sea posible","linkText":"Leer más","desc":"En ocasiones,
        utilizamos el auto para trayectos cortos que podríamos hacer a pie o en bicicleta.
        Cambia tu modo de transporte en ellos, así ahorrarás gasolina y reducirás
        tus emisiones. Además, tu salud te lo agradecerá.","location":{"dashboard":{"isActive":true},"list":{"isActive":true}}}},{"id":"news17_sustaintability","img":"https://assets.caasbbva.com/spain/app/sustainability/images/energy_efficiency.PNG","date":"26-03-2022","title":"Finanzas
        Sostenibles, informe anual BBVA 2021","desc":"En BBVA México incorporamos
        la sostenibilidad en nuestro día a día.","content":[{"type":"p","content":["En
        BBVA México incorporamos la sostenibilidad en nuestro día a día y en todo
        lo que hacemos, tanto en la relación con nuestros clientes como en los procesos
        internos. Somos conscientes del destacado papel de la banca en la transición
        hacia un mundo más sostenible. Buscamos acompañar a los clientes minoristas,
        empresas, corporativos e institucionales en la adopción de hábitos más sostenibles
        que les ayuden a reducir sus emisiones, utilizando herramientas y soluciones
        basadas en datos para controlar sus consumos y sus emisiones. Para ello, trabajamos
        constantemente en poner a disposición de todos un amplio catálogo de productos
        de inversión y financiamiento."," ","En BBVA nos hemos fijado como prioridad
        “ayudar a nuestros clientes en la transición hacia un futuro sostenible”,
        inspirándonos en los Objetivos de Desarrollo Sostenible (ODS) establecidos
        por la ONU, con foco en el cambio climático y en el desarrollo social inclusivo.","
        ","En el 2018 el Grupo BBVA, del que formamos parte, presentó su compromiso
        para contribuir al cumplimiento de los ODS fijados por las Naciones Unidas
        y a los retos derivados del Acuerdo de París sobre el clima. Este compromiso
        se basa en las siguientes tres líneas de acción: financiar, gestionar e involucrar.","
        ","El compromiso tiene el objetivo de financiar con 200,000 millones de euros
        (4.6 billones de pesos) a proyectos sostenibles que promuevan la lucha contra
        el cambio climático entre 2018 y 2025. Al cierre de diciembre de 2020, BBVA
        ya había alcanzado 50,154 millones de euros (1.2 billones de pesos) en financiamiento
        sostenible."," ","Conoce más de las iniciativas que en BBVA estamos desarrollando
        en nuestro informe anual 2021 en la sección de Finanzas Sostenibles: portal.bbva.mx/informes/2021/finanzas/","
        ","Te invitamos a visitar el sitio bbva.com/es/sostenibilidad/ para que conozcas
        más sobre sostenibilidad en BBVA."]}],"relatedTip":{"id":"09_efficiency_tips","img":"trashcan","title":"Separa,
        recicla y reutiliza","linkText":"Leer más","desc":"Hacer una buena gestión
        de los residuos domésticos disminuye la contaminación y, además, ayuda a reutilizar
        materiales.","location":{"dashboard":{"isActive":true},"list":{"isActive":true}}}},{"id":"news16_sustaintability","img":"https://assets.caasbbva.com/spain/app/sustainability/images/energy_efficiency.PNG","date":"26-03-2022","title":"Conmemoración
        del Día Mundial del Clima | BBVA México","desc":"Un día para reflexionar en
        cómo nuestra actividad puede impactar al cambio climático. Hagámoslo de manera
        positiva.","content":[{"type":"p","content":["El Día Mundial del Clima se
        celebra el 26 de marzo de cada año para sensibilizar a las personas de todo
        el mundo sobre la importancia de las acciones humanas y preguntarse cómo impactan
        en el cambio climático y cuáles son sus consecuencias. Aunque las variaciones
        climáticas son parte del proceso, en los últimos años se ha presentado una
        aceleración significativa afectando el ambiente natural."," ","En este sentido,
        el crecimiento de la población, el desarrollo industrial, la deforestación,
        la explotación de recursos naturales y las emisiones de gases de efecto invernadero,
        forman parte del aumento de la contaminación ambiental y de las alteraciones
        del ciclo natural. "," ","No obstante, se pueden realizar pequeñas acciones
        para contribuir a mejorar las condiciones climáticas del planeta."," ","Te
        compartimos algunas recomendaciones para reducir la contaminación:"]},{"type":"list-bullet","content":["Elige
        usar medios de transporte que contribuyan a la reducción de emisiones, como
        el transporte público, la bicicleta o compartir el auto con alguien que vaya
        hacia la misma dirección que tú. ","Para ahorrar energía, considera utilizar
        en tu casa u oficina focos de bajo consumo y desconectar los aparatos que
        no uses, como la licuadora, la televisión o los cargadores de celular.","Evita
        comprar más de lo necesario, ya que de acuerdo con información de la ONU los
        desperdicios de comida se convierten en toneladas de dióxido de carbono."]},{"type":"p","content":["Te
        invitamos a visitar el sitio bbva.com/es/sostenibilidad/ para que conozcas
        más sobre sostenibilidad en BBVA."]}],"relatedTip":{"id":"04_efficiency_tips","img":"homeappliances","title":"Selecciona
        el modo ahorro en los dispositivos electrónicos","linkText":"Leer más","desc":"El
        modo ahorro de energía de pantallas y otros dispositivos electrónicos disminuye
        su consumo de energía. También es recomendable usar fondos de pantalla oscuros
        y disminuir el brillo de las pantallas cuando no sea necesario tenerlo al
        máximo.","location":{"dashboard":{"isActive":true},"list":{"isActive":true}}}},{"id":"news15_sustaintability","img":"https://assets.caasbbva.com/spain/app/sustainability/images/energy_efficiency.PNG","date":"28-02-2022","title":"¿De
        dónde viene el desarrollo sostenible?","desc":"El Informe Brundtland, la primera
        gran sacudida a la conciencia mundial sobre el desarrollo sostenible.","content":[{"type":"p","content":["Sucedió
        a finales de los ochenta del pasado siglo, cuando la doctora Gro Harlem Brundtland
        siendo primera ministra de Noruega, encabezó una comisión internacional con
        el encargo de la Organización de las Naciones Unidas (ONU) para replantear
        las políticas de desarrollo económico."," ","Así, el Informe Brundtland, firmado
        en Oslo el 20 de marzo de 1987 y titulado originalmente “Nuestro futuro común”,
        definía el desarrollo sostenible como: aquel que satisface las necesidades
        del presente sin comprometer la capacidad de las futuras generaciones para
        satisfacer las propias. El Principio 3º de la Declaración de Río sobre el
        Medioambiente y el Desarrollo (1992) asumió la definición del Informe Brundtland.","
        ","En la Conferencia Mundial sobre Desarrollo Sostenible de Johannesburgo,
        10 años después, se reafirmó el término como eje clave de la agenda internacional.  El
        25 de septiembre de 2015, durante la 70º Asamblea General de la ONU en Nueva
        York, 193 jefes de Estado y de Gobierno firmaron la Agenda 2030, con 17 Objetivos
        de Desarrollo Sostenible (ODS) y 169 metas económicas, sociales y medioambientales,
        que serán la guía del desarrollo de las próximas, además de una estrategia
        clave para luchar contra el calentamiento global."," ","Igualmente se aplican
        acciones de mercado como la certificación de productos procedentes de bosques
        con gestión sostenible o servicios ambientales como el mantenimiento de las
        zonas altas de las cuencas hidrográficas. "," ","Sobre el concepto de desarrollo
        sostenible existen una gran variedad de matices y significados, esto se refleja
        claramente en las bibliografías sobre sostenibilidad, con focos que pueden
        priorizar más el crecimiento económico o bien la preservación de la biodiversidad.","
        ","Te invitamos a visitar el sitio bbva.com/es/sostenibilidad/ para que conozcas
        más sobre sostenibilidad en BBVA."]}],"relatedTip":{"id":"07_efficiency_tips","img":"deletelogo","title":"Evita
        los productos de un solo uso","linkText":"Leer más","desc":"El uso de productos
        que se usan y se tiran genera una gran cantidad de residuos y la necesidad
        de generar nuevos materiales, porque en ocasiones no pueden reciclarse. Esto
        aumenta el consumo de recursos y de energía.","location":{"dashboard":{"isActive":true},"list":{"isActive":true}}}},{"id":"news14_sustaintability","img":"https://assets.caasbbva.com/spain/app/sustainability/images/energy_efficiency.PNG","date":"28-02-2022","title":"¿Cuáles
        son las causas del cambio climático y cómo nos afecta?","desc":"El cambio
        climático altera la composición de la atmósfera global y causa múltiples consecuencias
        negativas para la naturaleza y la vida.","content":[{"type":"p","content":["Los
        expertos de las Naciones Unidas dicen que el cambio climático altera la composición
        de la atmósfera global y causa múltiples consecuencias negativas para la naturaleza
        y la vida. La humanidad sabe bien a qué se refieren, porque ya está aquí en
        forma de desertificación, subida del nivel del mar o de temperaturas extremas.
        Se puede hacer frente a la emergencia, pero hay que actuar con más decisión,
        más recursos y más rápido."," ","El Panel Intergubernamental sobre Cambio
        Climático (IPCC) señala que el inicio del fenómeno se puede establecer en
        el comienzo de la era industrial, más o menos en torno al año 1750. La conclusión
        parece clara: han bastado menos de tres siglos para modificar el equilibrio
        climático."," ","Conviene recordar que la base de todo radica en reducir.
        Dicho de otro modo, no es solo depositar cada residuo en el contenedor correcto
        sino tratar de no generar tantos desperdicios, y adoptar hábitos conocidos
        como “residuo cero” o “zero waste”, cuyos principios aspiran a reutilizar
        los productos para que no vuelvan a la naturaleza en forma de basura."," ","La
        Convención Marco de Naciones Unidas sobre el Cambio Climático afirma que después
        de más de un siglo y medio de industrialización, deforestación y agricultura
        a gran escala, las cantidades de gases de efecto invernadero (GEI) en la atmósfera
        se han incrementado a niveles nunca antes vistos en tres millones de años.","
        ","El problema es que el nivel de emisiones GEI ha crecido bastante más de
        lo debido. El CO2 por ejemplo, el más abundante de todos estos gases con dos
        tercios del total, se ha disparado principalmente por el uso de combustibles
        fósiles como el carbón o la gasolina."," ","Uno de los efectos directos es
        que los océanos se han calentado y la cantidad de hielo ha bajado, mientras
        el nivel del mar ha subido 19 centímetros de 1901 a 2010. Esta tendencia parece
        inevitable, ya que, según el IPCC, las consecuencias del cambio climático
        persistirán durante muchos siglos, incluso si se detienen las emisiones de
        GEI."," ","El calentamiento global tiene consecuencias no solo biofísicas,
        sino también sociales. Por ello, desde el punto de vista social crece la voluntad
        de llamada contra la emergencia climática, para que se actúe ya."," ","Te
        invitamos a visitar el sitio bbva.com/es/sostenibilidad/ para que conozcas
        más sobre sostenibilidad en BBVA."]}],"relatedTip":{"id":"01_efficiency_tips","img":"shower","title":"Cierra
        la llave mientras te cepillas los dientes","linkText":"Leer más","desc":"Es
        una acción sencilla que puede ayudarnos a ahorrar hasta 6 litros por minuto,
        que pueden llegar a sumar 550,000 litros de agua a lo largo de toda tu vida.","location":{"dashboard":{"isActive":true},"list":{"isActive":true}}}},{"id":"news13_sustaintability","img":"https://assets.caasbbva.com/spain/app/sustainability/images/energy_efficiency.PNG","date":"31-01-2022","title":"Trucos
        y consejos para reciclar en casa","desc":"A medida en que la recolección de
        basura selectiva se amplía, los hogares deben adoptar pequeños sistemas domésticos
        de gestión de sus desechos.","content":[{"type":"p","content":["A medida en
        que la recolección de basura selectiva se amplía, los hogares deben adoptar
        pequeños sistemas domésticos de gestión de sus desechos que permitan separarlos
        y facilitar su llegada al punto de reciclaje correspondiente. Los botes o
        cajas de distintos colores ayudan a clasificar el vidrio, plástico y cartón,
        así como las pilas, celulares o pequeños electrodomésticos."," ","Es muy práctico
        utilizar distintos botes de colores para diferenciar los residuos que irán
        a los contenedores de reciclado. Además de todo eso, es conveniente tener
        en casa un recopilador de pilas para después llevarlas a los puntos de recolección,
        donde se reciben y almacenan temporalmente aquellos residuos que podrían ser
        peligrosos en los contenedores convencionales."," ","Conviene recordar que
        la base de todo radica en reducir. Dicho de otro modo, no es solo depositar
        cada residuo en el contenedor correcto sino tratar de no generar tantos desperdicios,
        y adoptar hábitos conocidos como “residuo cero” o “zero waste”, cuyos principios
        aspiran a reutilizar los productos para que no vuelvan a la naturaleza en
        forma de basura."," ","Igualmente se aplican acciones de mercado como la certificación
        de productos procedentes de bosques con gestión sostenible o servicios ambientales
        como el mantenimiento de las zonas altas de las cuencas hidrográficas. ","
