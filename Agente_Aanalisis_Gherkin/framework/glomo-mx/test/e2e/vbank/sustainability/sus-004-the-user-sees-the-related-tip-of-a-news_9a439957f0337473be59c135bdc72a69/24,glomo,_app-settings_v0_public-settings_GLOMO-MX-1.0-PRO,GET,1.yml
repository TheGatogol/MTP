        la energía que se obtiene de fuentes naturales e inagotables."},"list":{"isActive":true}}},{"id":"greenhouse_gases","title":"Gases
        de efecto invernadero","content":[{"type":"p","content":["Los gases de efecto
        invernadero (GEI) retienen en la atmósfera la radiación que la Tierra refleja
        procedente del Sol. Esto ha permitido que la temperatura del planeta sea adecuada
