        cómo ahorrar energía eléctrica en casa","content":[{"type":"p","content":["Una
        de las formas de ahorrar electricidad en casa es conseguir la eficiencia energética,
        que puede definirse como un equilibrio entre el consumo de electricidad y las
        necesidades reales de las personas. Esta eficiencia ayuda a bajar el costo del
        recibo de la luz y a reducir las posibilidades de sufrir un apagón, algo que puede
        provocar que los electrodomésticos se descompongan. Lograr el equilibrio no necesariamente
        significa invertir en mejoras para el hogar; con simples cambios en el uso de
        los electrodomésticos y los dispositivos electrónicos es posible."," "," ","<strong>¿Cómo
        reducir el consumo de los electrodomésticos?</strong>"," ","Aprovechar la capacidad
        de la lavadora y el lavaplatos o hacer un buen uso del refrigerador pueden contribuir
        a reducir su consumo. A continuación te ofrecemos ideas que te ayudarán a ahorrar
        energía sin afectar la limpieza de tu ropa o tu vajilla ni la calidad de tus alimentos"]},{"type":"list-bullet","content":["Lava
        la ropa en una sola carga en la lavadora. Si tienes lavaplatos, ocúpalo con la
        mayor cantidad de platos posible. Este cambio contribuye a consumir menos energía
        y agua","Centrifuga la ropa para que salga más seca y procura tenderla al aire
        libre para aprovechar la luz solar y el viento","Abre la puerta del refrigerador
        lo menos posible y regula su temperatura a 5 ºC y a -18 ºC la del congelador.
        Si tu refrigerador no tiene termostato, regúlalo según la época del año: potencia
        al mínimo en invierno y media en verano.","Descongela los alimentos dentro del
        refrigerador para evitar el crecimiento de bacterias. También así aprovechas el
        frío para mantener estable la temperatura del aparato.","Separa el refrigerador
        unos 5 centímetros de la pared para que el calor generado por el motor se disipe
        con mayor facilidad."]},{"type":"p","content":["<strong>¿Cómo reducir el consumo
        de los dispositivos electrónicos?</strong>"," ","El celular, la televisión y la
        computadora son los dispositivos que más electricidad consumen, pero es posible
        reducirla prestando atención a algunos detalles:"]},{"type":"list-bullet","content":["Apaga
        los dispositivos completamente cuando no los estés usando, ya que siguen consumiendo
        energía en el modo reposo. Una herramienta que te puede ayudar son las extensiones
        con interruptor, así podrás apagar todos tus aparatos con un solo botón cuando
        te vayas a dormir o salgas de casa.","Reduce el brillo de las pantallas. Su iluminación
        es uno de los factores que más energía consume. Usar un brillo medio puede disminuir
        el consumo hasta en 20%, mientras que el mínimo lo reduce hasta en 40%. ","Desenchufa
        los cargadores cuando no cargues batería. Aunque el dispositivo no esté conectado,
        algunos cargadores siguen consumiendo energía. ","Desactiva las notificaciones
        que no sean necesarias para evitar que la pantalla de tu dispositivo se encienda
