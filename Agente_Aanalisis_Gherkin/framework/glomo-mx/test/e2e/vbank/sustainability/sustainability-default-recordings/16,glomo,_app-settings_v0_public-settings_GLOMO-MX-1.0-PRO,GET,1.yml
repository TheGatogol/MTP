        para cubrir nuestras necesidades sin dañar a las futuras generaciones."}},"id":"sustainability","title":"Sostenibilidad","content":[{"type":"p","content":["Significa
        satisfacer nuestras necesidades actuales sin comprometer la capacidad de las generaciones
        futuras para satisfacer las suyas. La sostenibilidad busca lograr un equilibrio
        entre el cuidado del medioambiente y la igualdad de oportunidades para las personas."]}]}],"news":[{"date":"27-08-2021","img":"https://assets.caasbbva.com/spain/app/sustainability/images/energy_efficiency.PNG","location":{"list":{"isActive":true},"dashboard":{"isActive":true}},"id":"news05_sustaintability_energies","title":"¿Qué
        son las energías renovables y por qué son importantes?","content":[{"type":"p","content":["Las
        energías renovables proceden de fuentes naturales en esencia inagotables, como
        el viento, el sol, la fuerza del agua o la materia vegetal gestionada de forma
        sostenible, y al no emitir gases de efecto invernadero (GEI) son la principal
        herramienta para la transición energética hacia un mundo bajo en carbono."," ","<strong>Tipos
        de energías renovables </strong>"," ","La energía solar, en su variedad fotovoltaica,
        es una de las renovables con mayor grado de madurez y proyección."," ","La energía
        eólica instalada en el mundo creció un 10% en 2019, según datos del Global Wind
        Energy Council (GWEC)."," ","Por su parte, la energía hidráulica aprovecha la
        fuerza del agua fluvial para que las centrales hidroeléctricas la conviertan primero
        en mecánica y posteriormente en eléctrica. "," ","La diversidad natural del planeta
        completa el álbum con fuentes renovables consagradas y emergentes, como los biocarburantes
        obtenidos a partir de restos agrícolas y animales."," "," ","<strong>Compromiso
        social y medioambiental </strong>"," ","Antes de iniciar el siglo, las energías
        renovables apenas figuraban en las políticas de Responsabilidad Social Empresarial
        (RSE), hoy son protagonistas en términos de sostenibilidad, eficiencia energética
        y respeto al medio ambiente en las memorias corporativas."," ","Grandes y pequeñas
        empresas trazan hojas de ruta sostenibles que involucran a sus cadenas de valor
        y exigen a sus proveedores buenas prácticas sostenibles. Existe incluso la Agencia
        Internacional de Energías Renovables (IRENA), un organismo intergubernamental,
        con 162 países adscritos."," ","Te invitamos a visitar el sitio bbva.com/es/sostenibilidad/
        para que conozcas más sobre sostenibilidad en BBVA."]}],"desc":" Las energías
        renovables proceden de fuentes naturales en esencia inagotables.","relatedTip":{"img":"desktop","linkText":"Leer
        más","id":"04_efficiency_tips","title":"Selecciona el modo ahorro en los dispositivos
        electrónicos","desc":"El modo ahorro de energía de pantallas y otros dispositivos
        electrónicos disminuye su consumo de energía. También es recomendable usar fondos
        de pantalla oscuros y disminuir el brillo de las pantallas cuando no sea necesario
        tenerlo al máximo."}},{"date":"27-08-2021","img":"https://assets.caasbbva.com/spain/app/sustainability/images/energy_efficiency.PNG","location":{"list":{"isActive":true},"dashboard":{"isActive":true}},"id":"news06_sustaintability_solar_panels","title":"¿Qué
        son los paneles solares, cómo funcionan y cuál es su futuro?","content":[{"type":"p","content":["El
        sol puede proporcionar energía suficiente para dar electricidad a todo el planeta.
        Pero no puede hacerlo directamente. Los paneles solares son el intermediario que
        hace que la luz solar nos sirva de energía. Su diseño es simple y al mismo tiempo
        muy eficaz y permite el autoconsumo. En un futuro próximo, los paneles generarán
        electricidad incluso de noche."," ","<strong>El sol como energía alternativa</strong>","
        ","Una sola hora de sol bastaría para abastecer las demandas energéticas de la
        humanidad durante todo un año. La afirmación no es exagerada y explica la importancia
        de que el ser humano sea capaz de convertir en energía eléctrica lo que el sol
        regala."," ","Pero ¿cómo se lleva a cabo ese proceso casi milagroso? A través
        de dos sencillas instalaciones: las instalaciones solares de paneles fotovoltaicos
        (más conocidas como placas o paneles solares) y las térmicas."," ","<strong>Futuro
        fotovoltaico</strong>"," ","La Universidad de Stanford (EE. UU.) desarrolló una
        instalación capaz de generar electricidad cuando el sol ya se ha ido. Las placas
        solares u2018a la inversau2019 aprovechan la energía que irradian las placas después
        de muchas horas de sol. Este fenómeno se conoce como u2018enfriamiento radiativou2019
        y se produce cuando un cuerpo va perdiendo calor después de altas temperaturas.
        "," ","Recuperar ese calor que se desprende, incluso de noche, podría ser una
        solución para que los paneles rindan más."," ","Te invitamos a visitar el sitio
        bbva.com/es/sostenibilidad/ para que conozcas más sobre sostenibilidad en BBVA."]}],"desc":"
        El sol puede proporcionar energía suficiente para dar electricidad a todo el planeta.
        Pero no puede hacerlo directamente.","relatedTip":{"img":"idea","linkText":"Leer
        más","id":"03_efficiency_tips","title":"Usa iluminación LED","desc":"Los focos
        LED pueden ayudarte a ahorrar 80% de la energía que consumen los focos tradicionales.
        Además, su tiempo de vida útil puede llegar a ser 30 veces mayor."}},{"date":"25-06-2021","img":"https://assets.caasbbva.com/spain/app/sustainability/images/energy_efficiency.PNG","location":{"list":{"isActive":true},"dashboard":{"isActive":true}},"id":"news01_sustaintability","title":"¿Qué
        es sostenibilidad? ","content":[{"type":"p","content":["<strong>Sostenibilidad
        es una palabra que oímos cada vez más, pero ¿qué quiere decir? ¿Por qué es tan
        importante?</strong>"," ","La sostenibilidad es un concepto cada vez más importante
        en la sociedad, porque está relacionado con el futuro que estamos construyendo
        en nuestro planeta. Su significado es satisfacer nuestras necesidades actuales
        sin comprometer la capacidad de las generaciones futuras para satisfacer las suyas.
        Por ello, uno de los términos que más tiene que ver con ella es el equilibrio.","
        "," ","<strong>¿Qué equilibrio buscamos?</strong>"," ","Muchas veces solo asociamos
        sostenibilidad con el medioambiente. Sin embargo, este equilibrio tiene que conseguirse
        en todos los ámbitos, por lo cual se habla de sostenibilidad medioambiental, social
        y económica."," ","Cada una de estas perspectivas de la sostenibilidad se enfoca
        en diferentes aspectos: "]},{"type":"list-bullet","content":["Medioambiental:
        lleva a cabo acciones relacionadas con el cuidado del planeta, como promover un
        uso más adecuado de los recursos y el consumo de energías renovables.","Social:
        defiende y protege los derechos humanos, laborales y culturales de las personas.
        Atiende cuestiones como la igualdad de género; el empleo pleno, productivo y decente,
        y la inclusividad.","Económica: promueve la independencia económica y el acceso
        a los recursos para toda la sociedad. "]},{"type":"p","content":["Como vemos,
        estas perspectivas tienen como objetivo prioritario lograr el equilibrio en la
        gestión de los recursos para que puedan llegar a todas las personas, mientras
        que se garantiza su uso a lo largo del tiempo."," "," ","<strong>El camino global
        hacia el equilibrio</strong>"," ","La sostenibilidad invita a crear una conciencia
        global, gracias a la cual todas las personas comprendan que vivimos en un planeta
        interconectado y que nuestras acciones afectan al mundo en general. Para alcanzar
        plenamente el desarrollo sostenible, es necesario tener un esfuerzo individual
        y colectivo. BBVA está comprometido con este objetivo y ofrece apoyo a sus clientes
        a través de las finanzas y las inversiones sostenibles."," "," ","<strong>Paso
        a paso</strong>"," ","Muchas veces no nos atrevemos a hacer cambios porque pensamos
        que van a requerir mucho tiempo, inversión económica o que su repercusión no va
        a ser significativa. Sin embargo, podemos comenzar con pequeñas acciones en casa
        y en nuestros hábitos diarios que nos ayuden a ser más sostenibles y a tener un
        impacto menos dañino en el planeta. Revisa nuestras recomendaciones y forma parte
        del cambio."," "," ","Te invitamos a visitar el sitio bbva.com/es/sostenibilidad/
        para que conozcas más sobre sostenibilidad en BBVA."]}],"desc":" La manera de
        garantizar las necesidades presentes sin comprometer las futuras.","relatedTip":{"img":"trashcan","linkText":"Leer
        más","id":"09_efficiency_tips","title":"Separa, recicla y reutiliza","desc":"Hacer
        una buena gestión de los residuos domésticos disminuye la contaminación y, además,
        ayuda a reutilizar materiales."}},{"date":"25-06-2021","img":"https://assets.caasbbva.com/spain/app/sustainability/images/3_que-son-los-ods.png","location":{"list":{"isActive":true},"dashboard":{"isActive":true}},"id":"news_032_news_generations","title":"¿Qué
        son los gases de efecto invernadero?","content":[{"type":"p","content":["Es un
        hecho que la temperatura del planeta se está elevando, lo oímos con mucha frecuencia
        de la voz de los expertos. La preocupación es real porque este aumento provoca
        una alteración en el clima, lo que trae más sequías, inundaciones y otros fenómenos
        meteorológicos extremos. La emisión de gases de efecto invernadero está provocando
        este cambio climático, pero ¿qué son y cómo se emiten?"," "," ","<strong>¿De dónde
        provienen los gases de efecto invernadero?</strong>"," ","En los últimos años,
        la humanidad consume energía y genera residuos a un ritmo muy perjudicial para
        el medioambiente. Prácticamente toda la actividad humana provoca una emisión grande
        y constante de gases de efecto invernadero."," ","La función de estos gases es
        retener en la atmósfera la radiación infrarroja del Sol. En cierto sentido, son
        necesarios porque sin ellos no sería posible vivir sobre la superficie terrestre,
        pues mantienen la temperatura adecuada para que los humanos y otras especies puedan
        sobrevivir. Sin embargo, el exceso de emisiones ha provocado un efecto no deseado:
        que la temperatura promedio del planeta se eleve demasiado."," "," ","<strong>¿Qué
        efecto tiene el aumento de estos gases?</strong>"," ","El problema surge cuando
        la actividad humana produce demasiados gases de efecto invernadero y en consecuencia
        se altera la atmósfera de la Tierra. Algunas actividades con las que más los producimos
        son el consumo de energía eléctrica, la generación de residuos, el uso de combustibles
        de origen fósil y la agricultura y ganadería intensivas."," ","La acumulación
        de gases en la atmósfera puede alcanzar niveles que dejan de ser adecuados para
        la vida, porque provocan un progresivo calentamiento global. En las últimas décadas,
        el incremento de la temperatura ha sido de unos cuantos grados centígrados, pero,
        por pocos que sean, las consecuencias son graves. Por ejemplo, aumentan las sequías
        en zonas fértiles, lo que puede generar desabasto de alimentos, y al mismo tiempo
        se derriten los hielos de los polos, lo que aumenta el nivel del mar y provoca
        inundaciones en lugares habitados."," "," ","<strong>¿Qué actividades cotidianas
        generan estos gases?</strong>"," ","En la vida cotidiana, muchas de nuestras actividades
        producen gases de efecto invernadero. Por ejemplo, manejar el auto en distancias
        cortas en vez de caminar, dejar las luces de casa encendidas, desechar prendas
        de ropa y dispositivos electrónicos en vez de darles una segunda oportunidad,
        consumir productos que vienen desde lejos y por lo tanto requieren de mucha gasolina
        para su transporte, entre muchas otras."," ","Evitar la emisión masiva de este
        tipo de gases está a nuestro alcance, empezando con pequeños cambios. Revisa nuestras
        recomendaciones para conocer cómo puedes contribuir a su disminución en tu día
        a día. "," "," ","Te invitamos a visitar el sitio bbva.com/es/sostenibilidad/
        para que conozcas más sobre sostenibilidad en BBVA."]}],"desc":"La temperatura
