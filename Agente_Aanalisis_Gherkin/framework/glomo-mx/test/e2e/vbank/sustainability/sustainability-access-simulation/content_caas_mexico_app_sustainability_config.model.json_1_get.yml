              },
              "items":
              {
                "dataType": "string",
                "value": ["\u003Cspan style=\"font-weight:500;font-size:1rem;\"\u003E¿Qué produce esas emisiones?\u003C/span\u003E", "La electricidad que consume la televisión al estar encendida es el factor que más emisiones produce. Aunque no hay que olvidar el consumo residual generado por el modo reposo, que puede suponer hasta 15kg de carbono al año. Además, el tipo de televisión hace que el consumo sea diferente, provocando más emisiones la tecnología plasma que el LCD.", "\u003Cspan style=\"font-weight:500;font-size:1rem;\"\u003E¿Qué acciones pueden reducir esas emisiones?\u003C/span\u003E", "Apagar los dispositivos y evitar que se queden en modo reposo cuando no estén siendo utilizados ayuda a disminuir el consumo de energía."],
