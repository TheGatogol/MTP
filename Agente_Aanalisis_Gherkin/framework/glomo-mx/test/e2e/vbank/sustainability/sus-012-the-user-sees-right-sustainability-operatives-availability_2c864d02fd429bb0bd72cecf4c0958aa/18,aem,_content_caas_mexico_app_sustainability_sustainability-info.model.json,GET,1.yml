                    un 53.2% de tus emisiones totales.</b> El resto están asociadas
                    a consumos y hábitos que no podemos estimar.
                  - 'Para calcular este estimado, utilizamos el valor en pesos (MXN)
                    de los recibos y pagos antes mencionados. '
                  - '<b>Multiplicamos estas cantidades por las variables</b> ofrecidas
                    por el Instituto Nacional de Ecología y Cambio Climático (INECC).
                    Para ello, consultamos siempre la última publicación de datos
                    oficiales. '
                  - Esta información es rigurosa y está contrastada, aunque no sustituye
                    técnicas de cálculo más precisas. <b>Ten en cuenta</b> que no
                    se trata de información orientada al asesoramiento financiero
                    y que <b>no debe ser tomada como el único factor de decisión a
                    la hora de realizar operaciones o contrataciones.</b>
