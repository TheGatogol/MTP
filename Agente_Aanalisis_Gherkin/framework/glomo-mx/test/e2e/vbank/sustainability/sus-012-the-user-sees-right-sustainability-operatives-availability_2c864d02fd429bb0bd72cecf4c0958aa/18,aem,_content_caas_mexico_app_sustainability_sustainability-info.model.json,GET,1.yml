                  value:
                  - 'Para calcular tu huella de carbono, tomamos en cuenta tus <b>recibos
                    de luz y gas</b> domiciliados a tu cuenta BBVA, así como tus pagos
                    en gasolineras realizados con tus tarjetas BBVA a lo largo del
                    año. Este cálculo es aproximado y no hace referencia al total
                    de tus emisiones. '
