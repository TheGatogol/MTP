        detail:
        - content: |-
            Un crédito hipotecario es un préstamo a largo plazo que un banco otorga para adquirir una vivienda, terreno, remodelar una propiedad o incluso para obtener liquidez. El inmueble queda como garantía de pago hasta que se liquida el crédito.

            Por lo general, se requiere un enganche que puede variar entre el 10% y el 45% del costo total de la propiedad, dependiendo de la institución financiera. Además, la mayoría de los créditos hipotecarios ofrecen tasas de interés fijas, lo que permite pagar una cantidad estable durante todo el plazo del crédito.
