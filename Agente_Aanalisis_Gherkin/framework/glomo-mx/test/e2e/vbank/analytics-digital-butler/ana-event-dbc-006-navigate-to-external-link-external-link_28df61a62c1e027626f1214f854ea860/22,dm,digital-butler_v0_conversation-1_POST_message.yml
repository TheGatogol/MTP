when:
  backend: digitalButlerHost
  method: POST
  path: /digital-butler/v0/conversations/1a2s3d4f-1q2w-1z2x-1a2s-1a2s3d4f5g6h/messages
  match:
    body.message: 'Asesor'
then:
  - delay: 1s
  - return:
      :status: 200 OK
      data:
        conversationId: '1a2s3d4f-1q2w-1z2x-1a2s-1a2s3d4f5g6h'
        messageTracking: 
          category: 'Balances'
          subCategory: 'Check Account and Check Card'
          intent: 'consulting.balance'
        messages:
          - id: 'productFamilyBalanceManyResponse'
            messageType: BOT_TEXT
            detail:
              - content: 'Entendido. En el siguiente enlace puedes llamar a un asesor. Ten contigo el número de alguna de tus tarjetas y el NIP, los necesitarás para validar tu identidad'
          - id: 'productFamilyBalanceManyResponse'
            messageType: LINK
            detail:
              - linkType: ACTION
                id: 'phone-call'
                icon: bbvaTelephone
                title: Llamar a linea BBVA
                messageType: LINK
                params:
                  - name: numberPhone
                    value: '5552262663'
          - messageType: BINARY_FEEDBACK
            detail:
              - channel: app
                content: ¿He resuelto tu consulta?
                forms:
                  negative:
                    id: ''
                  positive:
                    id: ''
                  origin:
                    id: ''