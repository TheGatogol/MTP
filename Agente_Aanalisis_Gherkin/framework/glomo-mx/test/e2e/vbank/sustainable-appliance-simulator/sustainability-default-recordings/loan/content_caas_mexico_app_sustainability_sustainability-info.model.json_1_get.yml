                  "dataType": "string",
                  "title": "Listado items",
                  "value": [
                    "Para calcular tu huella de carbono, tenemos en cuenta tus  <span style=\"font-weight:500;\">recibos de luz y gas</span> domiciliados en BBVA y los  <span style=\"font-weight:500;\">consumos en gasolineras</span> pagados con tus tarjetas BBVA del año en curso. Este cálculo es aproximado y no hace referencia al total de tus emisiones. ",
