                    "Utilizamos el valor en euros de los recibos y pagos antes mencionados y lo multiplicamos por las variables ofrecidas por la Oficina Española del Cambio Climático de MITECO para las emisiones asociadas a combustible y por la Comisión Nacional de los Mercados y la Competencia para las emisiones asociadas a los recibos.",
                    "Para ello, consultamos siempre la última publicación de  <span style=\"font-weight:500;\">datos oficiales</span>.",
                    "<span style=\"font-weight:500;\">Esta información es rigurosa y está contrastada</span>, aunque no sustituye técnicas de cálculo más precisas. ",
                    "Ten en cuenta que  <span style=\"font-weight:500;\">no se trata de información orientada al asesoramiento financiero</span> y que no debe ser tomada como único factor de decisión a la hora de realizar operaciones o contrataciones."
