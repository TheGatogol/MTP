    :body: '{"id":"caasinitiativecontent-a85627e986","title":"recommendations","brandSlug":"","lastModifiedDate":1654186459265,"templateName":"caasinitiativecontent","htmlPageItems":[],"cssClassNames":"caasinitiativecontent page basicpage","language":"en-US",":itemsOrder":["root"],":items":{"root":{"columnClassNames":{"contentfragmentlist":"aem-GridColumn aem-GridColumn--default--12"},"gridClassNames":"aem-Grid aem-Grid--12 aem-Grid--default--12","columnCount":12,"allowedComponents":{"components":[{"path":"/content/caas/mexico/app/sustainability/recommendations/jcr:content/root/bbva/pwebs/components/par/corecomponents/contentfragment","title":"Content Fragment"},{"path":"/content/caas/mexico/app/sustainability/recommendations/jcr:content/root/bbva/pwebs/components/par/corecomponents/dynamiccontentfragment","title":"Dynamic Content Fragment"},{"path":"/content/caas/mexico/app/sustainability/recommendations/jcr:content/root/bbva/pwebs/components/par/corecomponents/contentfragmentlist","title":"Content Fragment List"}],"applicable":false},":itemsOrder":["contentfragmentlist"],":items":{"contentfragmentlist":{"id":"contentfragmentlist",":type":"bbva/pwebs/components/par/corecomponents/contentfragmentlist","items":[{"description":"","name":"regular-temperatura-nevera","title":"regular temperatura nevera","model":"caascfm/models/global-cells-recommendation","elements":{"id":{"dataType":"string","value":"RECNA0009ADVNA0012","title":"Id","translate":true,"multiValue":false,":type":"string"},"image-url":{"dataType":"string","title":"Asset","multiValue":false,":type":"string"},"title":{"dataType":"string","value":"¿Qué supone regular la temperatura de la nevera?","title":"Title","translate":true,"multiValue":false,":type":"string"},"offer":{"dataType":"string","title":"offer","multiValue":false,":type":"string"},"items":{"dataType":"string","value":["La electricidad que utiliza la nevera supone casi la cuarta parte de la factura de la luz.\u003Cspan style=\"font-weight:500\"\u003E Bajar un grado\u003C/span\u003E su temperatura puede llegar a suponer que su consumo se \u003Cspan style=\"font-weight:500\"\u003Eincremente un 5%\u003C/span\u003E.\u003Cbr/\u003EPrueba estas ideas para optimizar el uso del frigorífico y reducir su consumo:","Llevando a cabo estos cambios conseguirás ahorrar energía y\u003Cspan style=\"font-weight:500\"\u003E mejorar la conservacion de tus alimentos\u003C/span\u003E, lo que evitará su desperdicio."],"title":"Items","translate":true,"multiValue":true,":type":"string"},"itemsposition":{"dataType":"string","title":"itemsPosition","multiValue":true,":type":"string"},"bullets":{"dataType":"string","value":["Mantén la temperatura del frigorífico a \u003Cspan style=\"font-weight:500\"\u003E5ºC\u003C/span\u003E y a \u003Cspan style=\"font-weight:500\"\u003E-18ºC\u003C/span\u003E la del congelador. Los alimentos se \u003Cspan style=\"font-weight:500\"\u003Econservarán en perfecto estado\u003C/span\u003E.","Si tu nevera no tiene termostato, \u003Cspan style=\"font-weight:500;\"\u003Eregula la intensidad del frío\u003C/span\u003E en función de la estación. Mantén su potencia al mínimo en invierno y súbela a media intensidad en verano.","\u003Cspan style=\"font-weight:500;\"\u003EDescongela\u003C/span\u003E los alimentos \u003Cspan style=\"font-weight:500;\"\u003Edentro del frigorífico, evita que pierdan propiedades\u003C/span\u003E y se aprovecha su frío para mantener la temperatura de la nevera.","Procura mantener la nevera y el congelador \u003Cspan style=\"font-weight:500\"\u003Elibre de escarcha\u003C/span\u003E ya que actúa como aislante.","Abre la nevera el menor tiempo posible y \u003Cspan style=\"font-weight:500\"\u003Eevita introducir alimentos que estén calientes\u003C/span\u003E."],"title":"Bullets","translate":true,"multiValue":true,":type":"string"},"button-text":{"dataType":"string","value":"Aceptar","title":"Button Text","translate":true,"multiValue":false,":type":"string"},"linkid":{"dataType":"string","title":"linkId","multiValue":false,":type":"string"},"share-link":{"dataType":"string","value":"https://www.bbva.es/general/sostenibilidad/soluciones-para-personas/huella-de-carbono-personas/repositorio/regular-temperatura-nevera.html","title":"share-link","multiValue":false,":type":"string"}},":type":"dam:Asset","elementsOrder":["id","image-url","title","offer","items","itemsposition","bullets","button-text","linkid","share-link"]},{"description":"","name":"detalle-de-ideas5111","title":"productos locales y temporada","model":"caascfm/models/global-cells-recommendation","elements":{"id":{"dataType":"string","value":"587gbha80d5o2fz7kyan","title":"Id","translate":true,"multiValue":false,":type":"string"},"image-url":{"dataType":"string","title":"Asset","multiValue":false,":type":"string"},"title":{"dataType":"string","value":"¿Por qué es preferible comprar productos locales y de temporada?","title":"Title","translate":true,"multiValue":false,":type":"string"},"offer":{"dataType":"string","title":"offer","multiValue":false,":type":"string"},"items":{"dataType":"string","value":["Al hacer la compra también generamos emisiones. La mayoría de ellas proceden del \u003Cspan style=\"font-weight:500;\"\u003Etransporte de los productos\u003C/span\u003E desde el lugar en el que se han cultivado o producido, así como de su \u003Cspan style=\"font-weight:500;\"\u003Econservación en cámaras frigoríficas.\u003C/span\u003E\u003Cbr/\u003ETen en cuenta estas ideas al planificar tu menú:","Teniendo en cuenta estas consideraciones tus \u003Cspan style=\"font-weight:500;\"\u003Econsumos serán más responsables social y medioambientalmente.\u003C/span\u003E Además, contribuirás a la mejora de la economía local."],"title":"Items","translate":true,"multiValue":true,":type":"string"},"itemsposition":{"dataType":"string","title":"itemsPosition","multiValue":true,":type":"string"},"bullets":{"dataType":"string","value":["\u003Cspan style=\"font-weight:500;\"\u003ERevisa la procedencia de los alimentos\u003C/span\u003E que consumes, transportarlos desde largas distancias produce un gran volumen de emisiones.","\u003Cspan style=\"font-weight:500;\"\u003EProcura que sean de temporada,\u003C/span\u003E conservarlos en cámara o producirlos en invernaderos eleva sus emisiones y puede \u003Cspan style=\"font-weight:500;\"\u003Edisminuir sus propiedades.\u003C/span\u003E","Siempre que sea posible, \u003Cspan style=\"font-weight:500;\"\u003Ecompra en negocios cercanos a tu domicilio\u003C/span\u003E para evitar utilizar el coche. Revisa, además, si tienen \u003Cspan style=\"font-weight:500;\"\u003Epolíticas contra el desaprovechamiento\u003C/span\u003E de producto.","Compra lo que necesites y procura \u003Cspan style=\"font-weight:500;\"\u003Eno desperdiciar alimentos.\u003C/span\u003E"],"title":"Bullets","translate":true,"multiValue":true,":type":"string"},"button-text":{"dataType":"string","value":"Aceptar","title":"Button Text","translate":true,"multiValue":false,":type":"string"},"linkid":{"dataType":"string","title":"linkId","multiValue":false,":type":"string"},"share-link":{"dataType":"string","value":"https://www.bbva.es/general/sostenibilidad/soluciones-para-personas/huella-de-carbono-personas/repositorio/consumir-productos-locales.html","title":"share-link","multiValue":false,":type":"string"}},":type":"dam:Asset","elementsOrder":["id","image-url","title","offer","items","itemsposition","bullets","button-text","linkid","share-link"]},{"description":"","name":"detalle-de-ideas1","title":"temperatura del hogar","model":"caascfm/models/global-cells-recommendation","elements":{"id":{"dataType":"string","value":"qwidkujf1fwuztjzccgn","title":"Id","translate":true,"multiValue":false,":type":"string"},"image-url":{"dataType":"string","value":"/content/dam/caas/global/glomo/sustainability/recommendations/images/4.2.2-c-min.png","title":"Asset","multiValue":false,":type":"string"},"title":{"dataType":"string","value":"¿Cómo es posible mantener una temperatura agradable en el hogar?","title":"Title","translate":true,"multiValue":false,":type":"string"},"offer":{"dataType":"string","title":"offer","multiValue":false,":type":"string"},"items":{"dataType":"string","value":["El uso de las bombas de calor en invierno y del aire acondicionado en verano supone un \u003Cspan style=\"font-weight:500;\"\u003Eimportante impacto en el consumo de electricidad.\u003C/span\u003E\u003Cbr/\u003EPrueba estas ideas para optimizar el uso de estos sistemas y reducir su consumo manteniendo un entorno agradable:","Llevando a cabo estos cambios conseguirás \u003Cspan style=\"font-weight:500;\"\u003Eahorrar energía sin perjudicar la comodidad\u003C/span\u003E de tu hogar."],"title":"Items","translate":true,"multiValue":true,":type":"string"},"itemsposition":{"dataType":"string","title":"itemsPosition","multiValue":true,":type":"string"},"bullets":{"dataType":"string","value":["Regula la temperatura a \u003Cspan style=\"font-weight:500;\"\u003E20 o 21 ºC en invierno. Cada grado\u003C/span\u003E incrementado supone un \u003Cspan style=\"font-weight:500;\"\u003Eaumento del 8%\u003C/span\u003E en tus facturas.","En \u003Cspan style=\"font-weight:500;\"\u003Everano\u003C/span\u003E, mantén el aire acondicionado a \u003Cspan style=\"font-weight:500;\"\u003E24 o 25 ºC.\u003C/span\u003E Aunque utilizarlo a 26 ºC es mejor para la salud.","\u003Cspan style=\"font-weight:500;\"\u003EEvita mantener encendidos\u003C/span\u003E estos aparatos cuando \u003Cspan style=\"font-weight:500;\"\u003Etu casa permanezca vacía.\u003C/span\u003E"],"title":"Bullets","translate":true,"multiValue":true,":type":"string"},"button-text":{"dataType":"string","value":"Aceptar","title":"Button Text","translate":true,"multiValue":false,":type":"string"},"linkid":{"dataType":"string","title":"linkId","multiValue":false,":type":"string"},"share-link":{"dataType":"string","value":"https://www.bbva.es/general/sostenibilidad/soluciones-para-personas/huella-de-carbono-personas/repositorio/temperatura-agradable-hogar.html","title":"share-link","multiValue":false,":type":"string"}},":type":"dam:Asset","elementsOrder":["id","image-url","title","offer","items","itemsposition","bullets","button-text","linkid","share-link"]},{"description":"","name":"detalle-de-ideas3","title":"Cómo optimizar la potencia contratada","model":"caascfm/models/global-cells-recommendation","elements":{"id":{"dataType":"string","value":"99gbps3l5tdfk9mr7gr9","title":"Id","translate":true,"multiValue":false,":type":"string"},"image-url":{"dataType":"string","value":"/content/dam/caas/global/glomo/sustainability/recommendations/images/4.2.2-c-min.png","title":"Asset","multiValue":false,":type":"string"},"title":{"dataType":"string","value":"¿Cómo optimizar la potencia contratada?","title":"Title","translate":true,"multiValue":false,":type":"string"},"offer":{"dataType":"string","title":"offer","multiValue":false,":type":"string"},"items":{"dataType":"string","value":["Es posible ahorrar en tu factura de luz \u003Cspan style=\"font-weight:500;\"\u003Ehasta 50 euros al año por cada kW que rebajes.\u003C/span\u003E\u003Cbr/\u003EComprueba en tu factura cuál es la potencia contratada y estima con estas ideas si es la más óptima:","Adecuando la potencia contratada a la demandada conseguirás \u003Cspan style=\"font-weight:500;\"\u003Eahorrar en tus consumos y hacer un uso más responsable\u003C/span\u003E de la energía."],"title":"Items","translate":true,"multiValue":true,":type":"string"},"itemsposition":{"dataType":"string","title":"itemsPosition","multiValue":true,":type":"string"},"bullets":{"dataType":"string","value":["Utiliza una calculadora de potencia. Esta herramienta online te permite \u003Cspan style=\\\"font-weight:500;\\\"\u003Esimular la potencia eléctrica recomendada\u003C/span\u003E añadiendo algunos datos sobre tu casa, como sus metros cuadrados o el tipo de electrodomésticos.","Instala un contador de luz inteligente o un monitor de consumo. Te permitirán conocer \u003Cspan style=\\\"font-weight:500;\\\"\u003Ecómo se reparte tu consumo eléctrico a lo largo del día\u003C/span\u003E y cuál es la potencia máxima demandada.","Consulta a un o una electricista profesional. Te ayudará a \u003Cspan style=\\\"font-weight:500;\\\"\u003Econocer cuál es la potencia eléctrica que necesitas.\u003C/span\u003E","Infórmate sobre la posibilidad de contratar \u003Cspan style=\\\"font-weight:500;\\\"\u003Edos potencias eléctricas diferentes a lo largo del día,\u003C/span\u003E una para las horas valle y otra para las punta."],"title":"Bullets","translate":true,"multiValue":true,":type":"string"},"button-text":{"dataType":"string","value":"Aceptar","title":"Button Text","translate":true,"multiValue":false,":type":"string"},"linkid":{"dataType":"string","title":"linkId","multiValue":false,":type":"string"},"share-link":{"dataType":"string","title":"share-link","multiValue":false,":type":"string"}},":type":"dam:Asset","elementsOrder":["id","image-url","title","offer","items","itemsposition","bullets","button-text","linkid","share-link"]},{"description":"","name":"oferta-paneles-solares","title":"oferta paneles solares","model":"caascfm/models/global-cells-recommendation","elements":{"id":{"dataType":"string","value":" iberdrola-offer-modal","title":"Id","translate":true,"multiValue":false,":type":"string"},"image-url":{"dataType":"string","value":"/global/glomo/sustainability/recommendations/images/offer-partner-iberdrola.jpg","title":"Asset","multiValue":false,":type":"string"},"title":{"dataType":"string","value":" Instalación de paneles solares Smart Solar de Iberdrola","title":"Title","translate":true,"multiValue":false,":type":"string"},"offer":{"dataType":"string","value":" Descuento 5%","title":"offer","multiValue":false,":type":"string"},"items":{"dataType":"string","value":[" \u003Cspan style=\\\"font-weight:500;\\\"\u003EAhorra mes a mes mientras cuidas el planeta:\u003C/span\u003E"," \u003Cspan style=\\\"font-weight:500;\\\"\u003EConsigue financiación ventajosa:\u003C/span\u003E"],"title":"Items","translate":true,"multiValue":true,":type":"string"},"itemsposition":{"dataType":"string","value":["0","6"],"title":"itemsPosition","multiValue":true,":type":"string"},"bullets":{"dataType":"string","value":[" Cuida el medioambiente generando energía libre de emisiones de carbono."," Sin preocupaciones: Servicio integral que incluya el estudio personalizado, la instalación y posterior mantenimiento."," Gestión gratuita de trámites: Iberdrola tramitará licencias, autorizaciones y el registro legal de la instalación."," Gestión gratuita de subvenciones."," Ahorro de hasta un 70% en tu factura con instalación de baterías."," TIN 4,50%","  TAE desde 4,61% hasta 5,12%","  Hasta 10 años."," Sin comisión de apertura y cancelación."],"title":"Bullets","translate":true,"multiValue":true,":type":"string"},"button-text":{"dataType":"string","value":"Me interesa","title":"Button Text","translate":true,"multiValue":false,":type":"string"},"linkid":{"dataType":"string","value":"https://www.iberdrola.es/servicios/equipos/smart-solar/oferta-energia-solar?origen=24_46&utm_source=banner-comercial&utm_medium=banner&utm_campaign=20220218-oferta-solar-bbva&utm_term=banner","title":"linkId","multiValue":false,":type":"string"},"share-link":{"dataType":"string","value":"https://www.bbva.es/general/sostenibilidad/soluciones-para-personas/huella-de-carbono-personas/repositorio.html#acciones-cotidianas","title":"share-link","multiValue":false,":type":"string"}},":type":"dam:Asset","elementsOrder":["id","image-url","title","offer","items","itemsposition","bullets","button-text","linkid","share-link"]},{"description":"","name":"detalle-de-ideas51","title":"uso transporte publico","model":"caascfm/models/global-cells-recommendation","elements":{"id":{"dataType":"string","value":"f4s69jzkuyvtgfkqj5bd","title":"Id","translate":true,"multiValue":false,":type":"string"},"image-url":{"dataType":"string","title":"Asset","multiValue":false,":type":"string"},"title":{"dataType":"string","value":"¿Qué supone utilizar transporte público en los desplazamientos diarios?","title":"Title","translate":true,"multiValue":false,":type":"string"},"offer":{"dataType":"string","title":"offer","multiValue":false,":type":"string"},"items":{"dataType":"string","value":["El combustible que consume \u003Cspan style=\"font-weight:500;\"\u003Enuestro vehículo particular\u003C/span\u003E cuando lo utilizamos en los desplazamientos cotidianos puede llegar a suponer el \u003Cspan style=\"font-weight:500;\"\u003E50% de la energía que consumimos.\u003C/span\u003E\u003Cbr/\u003ETen en cuenta estas ideas para reducir su uso:","Llevando a cabo estos cambios contribuyes a la \u003Cspan style=\"font-weight:500;\"\u003Ereducción de emisiones de carbono y los problemas de tráfico\u003C/span\u003E que se dan especialmente en horas punta."],"title":"Items","translate":true,"multiValue":true,":type":"string"},"itemsposition":{"dataType":"string","title":"itemsPosition","multiValue":true,":type":"string"},"bullets":{"dataType":"string","value":["Recuerda que los \u003Cspan style=\\\"font-weight:500;\\\"\u003Etransportes eléctricos son más eficientes\u003C/span\u003E que los que utilizan combustibles fósiles. Si usas el metro y el tren \u003Cspan style=\\\"font-weight:500;\\\"\u003Etus emisiones se reducirán entre un 65 y un 75%\u003C/span","Cuando no exista una combinación de transporte público, \u003Cspan style=\\\"font-weight:500\\\"\u003Eintenta compartir coche.\u003C/span\u003E Con 3 o más ocupantes las emisiones de un coche se reparten de forma similar a cuando se viaja en autobús.","Utiliza servicios de alquiler de \u003Cspan style=\\\"font-weight:500;\\\"\u003Emovilidad eléctrica como patinetes, bicicletas o coches\u003C/span\u003E si están disponibles en tu cuidad."],"title":"Bullets","translate":true,"multiValue":true,":type":"string"},"button-text":{"dataType":"string","value":"Aceptar","title":"Button Text","translate":true,"multiValue":false,":type":"string"},"linkid":{"dataType":"string","title":"linkId","multiValue":false,":type":"string"},"share-link":{"dataType":"string","value":"https://www.bbva.es/general/sostenibilidad/soluciones-para-personas/huella-de-carbono-personas/repositorio/desplazarte-transporte-publico.html","title":"share-link","multiValue":false,":type":"string"}},":type":"dam:Asset","elementsOrder":["id","image-url","title","offer","items","itemsposition","bullets","button-text","linkid","share-link"]},{"description":"","name":"usa-eficientemente-tus-electrodomésticos","title":"mejorar uso del lavavajillas","model":"caascfm/models/global-cells-recommendation","elements":{"id":{"dataType":"string","value":"RECNA0009ADVNA0011","title":"Id","translate":true,"multiValue":false,":type":"string"},"image-url":{"dataType":"string","value":"/content/dam/caas/global/glomo/sustainability/recommendations/images/4.2.2-b-min.png","title":"Asset","multiValue":false,":type":"string"},"title":{"dataType":"string","value":"¿Cómo mejorar el uso de la lavadora y el lavavajillas?","title":"Title","translate":true,"multiValue":false,":type":"string"},"offer":{"dataType":"string","title":"offer","multiValue":false,":type":"string"},"items":{"dataType":"string","value":["En tu \u003Cspan style=\"font-weight:500\"\u003Efactura de la luz\u003C/span\u003E, los consumos de la lavadora y del lavavajillas suponen \u003Cspan style=\"font-weight:500\"\u003Ealrededor del 12%.\u003C/span\u003E A esto hay que sumar, además, la cantidad de agua necesaria para que lleven a cabo su función.\u003Cbr/\u003EPrueba estas ideas para reducir esos consumos:","Llevando a cabo estos pequeños cambios conseguirás \u003Cspan style=\"font-weight:500\"\u003Eahorrar agua y energía\u003C/span\u003E y, además, ser un poco \u003Cspan style=\"font-weight:500\"\u003Emás responsable\u003C/span\u003E con el medioambiente, evitando la contaminación del agua y su consumo innecesario."],"title":"Items","translate":true,"multiValue":true,":type":"string"},"itemsposition":{"dataType":"string","title":"itemsPosition","multiValue":true,":type":"string"},"bullets":{"dataType":"string","value":["Utiliza el \u003Cspan style=\"font-weight:500\"\u003Emodo eco para reducir el consumo de agua\u003C/span\u003E y su temperatura.","Aprovecha al máximo su capacidad para \u003Cspan style=\"font-weight:500;\"\u003Ereducir el número de lavados\u003C/span\u003E semanales.","Centrifuga a \u003Cspan style=\"font-weight:500;\"\u003E1000 revoluciones\u003C/span\u003E para que la \u003Cspan style=\"font-weight:500;\"\u003Ecolada salga menos mojada\u003C/span\u003E y evita utilizar la secadora.","Procura utilizar \u003Cspan style=\"font-weight:500\"\u003Edetergentes ecológicos\u003C/span\u003E y añadir a tus lavados la cantidad adecuada."],"title":"Bullets","translate":true,"multiValue":true,":type":"string"},"button-text":{"dataType":"string","value":"Aceptar","title":"Button Text","translate":true,"multiValue":false,":type":"string"},"linkid":{"dataType":"string","title":"linkId","multiValue":false,":type":"string"},"share-link":{"dataType":"string","value":"https://www.bbva.es/general/sostenibilidad/soluciones-para-personas/huella-de-carbono-personas/repositorio/mejorar-uso-lavadora-y-lavavajillas.html","title":"share-link","multiValue":false,":type":"string"}},":type":"dam:Asset","elementsOrder":["id","image-url","title","offer","items","itemsposition","bullets","button-text","linkid","share-link"]},{"description":"","name":"detalle-de-ideas511111111","title":"justificantes innecesarios","model":"caascfm/models/global-cells-recommendation","elements":{"id":{"dataType":"string","value":"yacqy3bq1zf8hgk6dn02","title":"Id","translate":true,"multiValue":false,":type":"string"},"image-url":{"dataType":"string","title":"Asset","multiValue":false,":type":"string"},"title":{"dataType":"string","value":"¿Por qué es recomendable evitar solicitar justificantes innecesarios?","title":"Title","translate":true,"multiValue":false,":type":"string"},"offer":{"dataType":"string","title":"offer","multiValue":false,":type":"string"},"items":{"dataType":"string","value":["El papel utilizado para la impresión de recibos en cajeros y datáfonos puede generar \u003Cspan style=\"font-weight:500;\"\u003Ehasta 1kg de emisiones de carbono anuales por persona.\u003C/span\u003E\u003Cbr/\u003ETen en cuenta estas ideas cuando te ofrezcan justificantes:","Reduciendo el número de justificantes contribuyes a que \u003Cspan style=\"font-weight:500;\"\u003Edisminuya el volumen de desechos y el gasto de papel.\u003C/span\u003E Con este pequeño gesto se generan \u003Cspan style=\"font-weight:500;\"\u003Emenos emisiones y menos sustancias tóxicas\u003C/span\u003E para el medioambiente."],"title":"Items","translate":true,"multiValue":true,":type":"string"},"itemsposition":{"dataType":"string","title":"itemsPosition","multiValue":true,":type":"string"},"bullets":{"dataType":"string","value":["\u003Cspan style=\"font-weight:500;\"\u003EEvita solicitar copias cuando no sean necesarias,\u003C/span\u003E generarás menos residuos y contribuirás a \u003Cspan style=\"font-weight:500;\"\u003Eahorrar la energía y el agua\u003C/span\u003E necesarias para fabricar el papel.","Procura \u003Cspan style=\"font-weight:500;\"\u003Eimprimir solo los justificantes que necesites,\u003C/span\u003E la tinta es muy contaminante.","Lleva el \u003Cspan style=\"font-weight:500;\"\u003Econtrol\u003C/span\u003E de tus gastos e ingresos a través de \u003Cspan style=\"font-weight:500;\"\u003Etu aplicación BBVA.\u003C/span\u003E"],"title":"Bullets","translate":true,"multiValue":true,":type":"string"},"button-text":{"dataType":"string","value":"Aceptar","title":"Button Text","translate":true,"multiValue":false,":type":"string"},"linkid":{"dataType":"string","title":"linkId","multiValue":false,":type":"string"},"share-link":{"dataType":"string","title":"share-link","multiValue":false,":type":"string"}},":type":"dam:Asset","elementsOrder":["id","image-url","title","offer","items","itemsposition","bullets","button-text","linkid","share-link"]},{"description":"","name":"mantener-calefaccion","title":"mantener calefaccion","model":"caascfm/models/global-cells-recommendation","elements":{"id":{"dataType":"string","value":"RECNA0011ADVNA0016","title":"Id","translate":true,"multiValue":false,":type":"string"},"image-url":{"dataType":"string","value":"/content/dam/caas/global/glomo/sustainability/recommendations/images/4.2.4-min.png","title":"Asset","multiValue":false,":type":"string"},"title":{"dataType":"string","value":"¿Qué supone regular la temperatura del hogar?","title":"Title","translate":true,"multiValue":false,":type":"string"},"offer":{"dataType":"string","title":"offer","multiValue":false,":type":"string"},"items":{"dataType":"string","value":["El consumo de calefacción supone alrededor del \u003Cspan style=\"font-weight:500\"\u003E57% del gasto energético de los hogares\u003C/span\u003E. Además, por \u003Cspan style=\"font-weight:500\"\u003Ecada grado \u003C/span\u003Eque se incrementa, el consumo puede \u003Cspan style=\"font-weight:500\"\u003Eaumentar entre un 7% y un 11%\u003C/span\u003E.\u003Cbr/\u003EPrueba estas ideas para reducir ese consumo:","Llevando a cabo estos pequeños cambios conseguirás \u003Cspan style=\"font-weight:500\"\u003Eahorrar energía\u003C/span\u003E, reducir emisiones de carbono y ahorrar en tus facturas, evitando consumos innecesarios y \u003Cspan style=\"font-weight:500\"\u003Efavoreciendo al medioambiente\u003C/span\u003E."],"title":"Items","translate":true,"multiValue":true,":type":"string"},"itemsposition":{"dataType":"string","title":"itemsPosition","multiValue":true,":type":"string"},"bullets":{"dataType":"string","value":["Regula el termostato a una temperatura entre \u003Cspan style=\"font-weight:500\"\u003E19ºC y 21ºC\u003C/span\u003E, ideal para \u003Cspan style=\"font-weight:500\"\u003Emantener el confort\u003C/span\u003E de una vivienda.","Cierra las persianas y cortinas por la noche, ya que \u003Cspan style=\"font-weight:500;\"\u003Eevitan importantes pérdidas de calor\u003C/span\u003E.","\u003Cspan style=\"font-weight:500;\"\u003ENo cubras los radiadores\u003C/span\u003E ni pongas objetos cerca para una adecuada \u003Cspan style=\"font-weight:500;\"\u003Edifusión del aire caliente\u003C/span\u003E."],"title":"Bullets","translate":true,"multiValue":true,":type":"string"},"button-text":{"dataType":"string","value":"Aceptar","title":"Button Text","translate":true,"multiValue":false,":type":"string"},"linkid":{"dataType":"string","title":"linkId","multiValue":false,":type":"string"},"share-link":{"dataType":"string","value":"https://www.bbva.es/general/sostenibilidad/soluciones-para-personas/huella-de-carbono-personas/repositorio/optimizar-uso-de-calefaccion.html","title":"share-link","multiValue":false,":type":"string"}},":type":"dam:Asset","elementsOrder":["id","image-url","title","offer","items","itemsposition","bullets","button-text","linkid","share-link"]},{"description":"","name":"detalle-de-ideas12","title":"que es una caldera de biomasa","model":"caascfm/models/global-cells-recommendation","elements":{"id":{"dataType":"string","value":"RECNA0013ADVNA0018","title":"Id","translate":true,"multiValue":false,":type":"string"},"image-url":{"dataType":"string","value":"/content/dam/caas/global/glomo/sustainability/recommendations/images/4.2.2-c-min.png","title":"Asset","multiValue":false,":type":"string"},"title":{"dataType":"string","value":"¿Qué es y qué beneficios tiene una caldera de biomasa?","title":"Title","translate":true,"multiValue":false,":type":"string"},"offer":{"dataType":"string","title":"offer","multiValue":false,":type":"string"},"items":{"dataType":"string","value":["Las calderas de biomasa \u003Cspan style=\"font-weight:500;\"\u003Eutilizan como combustible residuos naturales\u003C/span\u003E como restos forestales, cáscaras de frutos secos o huesos de aceituna.\u003Cbr/\u003ETen en cuenta sus beneficios a la hora de cambiar tu caldera:","Sustituir tu caldera o la de tu comunidad por una de biomasa contribuye a \u003Cspan style=\"font-weight:500;\"\u003Ereducir tus emisiones asociadas al uso de agua caliente y de calefacción.\u003C/span\u003E"],"title":"Items","translate":true,"multiValue":true,":type":"string"},"itemsposition":{"dataType":"string","title":"itemsPosition","multiValue":true,":type":"string"},"bullets":{"dataType":"string","value":["Son consideradas las \u003Cspan style=\"font-weight:500;\"\u003Ecalderas más ecológicas\u003C/span\u003E por utilizar combustibles naturales.","Se pueden instalar en \u003Cspan style=\"font-weight:500;\"\u003Edomicilios particulares y en edificios comunitarios.\u003C/span\u003E","Puede llegar a \u003Cspan style=\"font-weight:500;\"\u003Ereducir el consumo energético hasta un 40%\u003C/span\u003E si se la compara con una caldera que utiliza gasoil, disminuyendo también el volumen de emisiones de carbono.","Los \u003Cspan style=\"font-weight:500;\"\u003Ecombustibles son más económicos\u003C/span\u003E y el mantenimiento de los sistemas es sencillo.","Tienen una \u003Cspan style=\"font-weight:500;\"\u003Ealta resistencia al desgaste\u003C/span\u003E y una vida útil larga."],"title":"Bullets","translate":true,"multiValue":true,":type":"string"},"button-text":{"dataType":"string","value":"Aceptar","title":"Button Text","translate":true,"multiValue":false,":type":"string"},"linkid":{"dataType":"string","title":"linkId","multiValue":false,":type":"string"},"share-link":{"dataType":"string","title":"share-link","multiValue":false,":type":"string"}},":type":"dam:Asset","elementsOrder":["id","image-url","title","offer","items","itemsposition","bullets","button-text","linkid","share-link"]},{"description":"","name":"detalle-de-ideas511111","title":"productos con menos embalaje","model":"caascfm/models/global-cells-recommendation","elements":{"id":{"dataType":"string","value":"i3lgqpf7nm3v52k1f7ph","title":"Id","translate":true,"multiValue":false,":type":"string"},"image-url":{"dataType":"string","title":"Asset","multiValue":false,":type":"string"},"title":{"dataType":"string","value":"¿Por qué es preferible elegir productos con menos embalaje?","title":"Title","translate":true,"multiValue":false,":type":"string"},"offer":{"dataType":"string","title":"offer","multiValue":false,":type":"string"},"items":{"dataType":"string","value":["Los residuos generados en los hogares proceden en gran parte de los \u003Cspan style=\"font-weight:500;\"\u003Eenvases que envuelven los alimentos\u003C/span\u003E que consumimos.\u003Cbr/\u003EPrueba estas ideas para reducir su volumen:","Evitando los embalajes innecesarios contribuyes a \u003Cspan style=\"font-weight:500;\"\u003Eutilizar menos recursos para fabricarlos, a reducir el volumen de deshechos y las posibilidades de que no se recicle\u003C/span\u003E adecuadamente y pueda permanecer miles de años en el planeta."],"title":"Items","translate":true,"multiValue":true,":type":"string"},"itemsposition":{"dataType":"string","title":"itemsPosition","multiValue":true,":type":"string"},"bullets":{"dataType":"string","value":["\u003Cspan style=\"font-weight:500;\"\u003EUtiliza envases retornables o reutilizables\u003C/span\u003E siempre que sea posible.","Procura comprar productos con \u003Cspan style=\"font-weight:500;\"\u003Eenvases reciclables y evita aquellos que tienen embalaje innecesario.\u003C/span\u003E","Siempre que sea posible, \u003Cspan style=\"font-weight:500;\"\u003Eutiliza envases de mayor capacidad\u003C/span\u003E y evita los de uso individualizado.","Salvo que sea necesario para preservar la calidad del producto, solicita que \u003Cspan style=\"font-weight:500;\"\u003Eno te lo envuelvan.\u003C/span\u003E","Elige establecimientos que ofrezcan \u003Cspan style=\"font-weight:500;\"\u003Ebolsas biodegradables o que te permitan llevar tus propios envases reutilizables.\u003C/span\u003E"],"title":"Bullets","translate":true,"multiValue":true,":type":"string"},"button-text":{"dataType":"string","value":"Aceptar","title":"Button Text","translate":true,"multiValue":false,":type":"string"},"linkid":{"dataType":"string","title":"linkId","multiValue":false,":type":"string"},"share-link":{"dataType":"string","title":"share-link","multiValue":false,":type":"string"}},":type":"dam:Asset","elementsOrder":["id","image-url","title","offer","items","itemsposition","bullets","button-text","linkid","share-link"]},{"description":"","name":"detalle-de-ideas21","title":"energía aerotérmica y la geotérmica","model":"caascfm/models/global-cells-recommendation","elements":{"id":{"dataType":"string","value":"RECNA0013ADVNA0019","title":"Id","translate":true,"multiValue":false,":type":"string"},"image-url":{"dataType":"string","value":"/content/dam/caas/global/glomo/sustainability/recommendations/images/4.2.2-c-min.png","title":"Asset","multiValue":false,":type":"string"},"title":{"dataType":"string","value":"¿Qué son y qué beneficios tienen la energía aerotérmica y la geotérmica?","title":"Title","translate":true,"multiValue":false,":type":"string"},"offer":{"dataType":"string","title":"offer","multiValue":false,":type":"string"},"items":{"dataType":"string","value":["Se trata de sistemas de calefacción que utilizan fuentes de energía renovables, ya que \u003Cspan style=\"font-weight:500;\"\u003Eaprovechan el calor del viento y del interior de la tierra\u003C/span\u003E respectivamente. Ten en cuenta sus beneficios si estás considerando cambiar tu sistema de calefacción:","Sustituir tu sistema de calefacción o caldera por sistemas aerotérmicos o geotérmicos ayuda a \u003Cspan style=\"font-weight:500;\"\u003Ereducir tus emisiones.\u003C/span\u003E"],"title":"Items","translate":true,"multiValue":true,":type":"string"},"itemsposition":{"dataType":"string","title":"itemsPosition","multiValue":true,":type":"string"},"bullets":{"dataType":"string","value":["\u003Cspan style=\"font-weight:500;\"\u003ENecesitan muy poca energía eléctrica\u003C/span\u003E para su funcionamiento ya que el calor lo extraen de las fuentes naturales, lo que supone un ahorro en tu factura de la luz.","Su fuente de energía principal es renovable y \u003Cspan style=\"font-weight:500;\"\u003Eno emite gases de efecto invernadero,\u003C/span\u003E por lo que es muy sostenible.","El aumento de instalaciones geotérmicas o aerotérmicas \u003Cspan style=\"font-weight:500;\"\u003Eestá reduciendo el consumo de carbón y de otros combustibles fósiles.\u003C/span\u003E"],"title":"Bullets","translate":true,"multiValue":true,":type":"string"},"button-text":{"dataType":"string","value":"Aceptar","title":"Button Text","translate":true,"multiValue":false,":type":"string"},"linkid":{"dataType":"string","title":"linkId","multiValue":false,":type":"string"},"share-link":{"dataType":"string","title":"share-link","multiValue":false,":type":"string"}},":type":"dam:Asset","elementsOrder":["id","image-url","title","offer","items","itemsposition","bullets","button-text","linkid","share-link"]},{"description":"","name":"detalle-de-ideas511","title":"impacto viajes","model":"caascfm/models/global-cells-recommendation","elements":{"id":{"dataType":"string","value":"643zd9bj4iwiuve6bp3n","title":"Id","translate":true,"multiValue":false,":type":"string"},"image-url":{"dataType":"string","title":"Asset","multiValue":false,":type":"string"},"title":{"dataType":"string","value":"¿Cómo es posible reducir el impacto de los viajes de larga distancia?","title":"Title","translate":true,"multiValue":false,":type":"string"},"offer":{"dataType":"string","title":"offer","multiValue":false,":type":"string"},"items":{"dataType":"string","value":["\u003Cspan style=font-weight:500;\u003EHacer un viaje en coche eleva sustancialmente tus emisiones de carbono,\u003C/span\u003E especialmente si viajas en solitario. Ten en cuenta estas ideas a la hora de planificar los desplazamientos en tus viajes:","Llevando a cabo estos cambios conseguirás \u003Cspan style=\"font-weight:500;\"\u003Ereducir el impacto de tus viajes,\u003C/span\u003E haciendo que tu movilidad sea más sostenible."],"title":"Items","translate":true,"multiValue":true,":type":"string"},"itemsposition":{"dataType":"string","title":"itemsPosition","multiValue":true,":type":"string"},"bullets":{"dataType":"string","value":["\u003Cspan style=\"font-weight:500;\"\u003EUtiliza el tren y el autobús\u003C/span\u003E para medias y largas distancias.","\u003Cspan style=\"font-weight:500;\"\u003EElige tren\u003C/span\u003E cuando sea posible, las emisiones son casi 10 veces más bajas que las del avión. En un trayecto entre Madrid y Barcelona \u003Cspan style=\"font-weight:500;\"\u003Eel avión emite 140,8kg de carbono y el tren 18,4kg","\u003Cspan style=\"font-weight:500;\"\u003EComparte coche\u003C/span\u003E con más personas, así el \u003Cspan style=\"font-weight:500;\"\u003Eimpacto individual será menor.\u003C/span\u003E","\u003Cspan style=\"font-weight:500;\"\u003EAlquila un vehículo con pocas emisiones\u003C/span\u003E en tu destino si lo necesitas para desplazarte."],"title":"Bullets","translate":true,"multiValue":true,":type":"string"},"button-text":{"dataType":"string","value":"Aceptar","title":"Button Text","translate":true,"multiValue":false,":type":"string"},"linkid":{"dataType":"string","title":"linkId","multiValue":false,":type":"string"},"share-link":{"dataType":"string","title":"share-link","multiValue":false,":type":"string"}},":type":"dam:Asset","elementsOrder":["id","image-url","title","offer","items","itemsposition","bullets","button-text","linkid","share-link"]},{"description":"","name":"ajustar-temperatura-del-hogar","title":"ajustar temperatura del hogar","model":"caascfm/models/global-cells-recommendation","elements":{"id":{"dataType":"string","value":"RECNA0009ADVNA0013","title":"Id","translate":true,"multiValue":false,":type":"string"},"image-url":{"dataType":"string","value":"/content/dam/caas/global/glomo/sustainability/recommendations/images/4.2.2-c-min.png","title":"Asset","multiValue":false,":type":"string"},"title":{"dataType":"string","value":"¿Cómo es posible mantener una temperatura agradable en el hogar?","title":"Title","translate":true,"multiValue":false,":type":"string"},"offer":{"dataType":"string","title":"offer","multiValue":false,":type":"string"},"items":{"dataType":"string","value":["El uso de las bombas de calor en invierno y del aire acondicionado en verano supone un \u003Cspan style=\"font-weight:500\"\u003Eimportante impacto en el consumo de electricidad\u003C/span\u003E.\u003Cbr/\u003EPrueba estas ideas para optimizar el uso de estos sistemas y reducir su consumo manteniendo un entorno agradable:","Llevando a cabo estos cambios conseguirás \u003Cspan style=\"font-weight:500\"\u003Eahorrar energía sin perjudicar la comodidad\u003C/span\u003E de tu hogar."],"title":"Items","translate":true,"multiValue":true,":type":"string"},"itemsposition":{"dataType":"string","title":"itemsPosition","multiValue":true,":type":"string"},"bullets":{"dataType":"string","value":["Regula la temperatura a \u003Cspan style=\"font-weight:500\"\u003E20 o 21ºC en invierno. Cada grado\u003C/span\u003E incrementado supone un \u003Cspan style=\"font-weight:500\"\u003Eaumento del 8%\u003C/span\u003E en tus facturas.","En \u003Cspan style=\"font-weight:500;\"\u003Everano,\u003C/span\u003E mantén el aire acondicionado a \u003Cspan style=\"font-weight:500\"\u003E24 o 25ºC\u003C/span\u003E. Aunque utilizarlo a 26ºC es mejor para la salud.","\u003Cspan style=\"font-weight:500;\"\u003EEvita mantener encendidos\u003C/span\u003E estos aparatos cuando \u003Cspan style=\"font-weight:500;\"\u003Etu casa permanezca vacia\u003C/span\u003E."],"title":"Bullets","translate":true,"multiValue":true,":type":"string"},"button-text":{"dataType":"string","value":"Aceptar","title":"Button Text","translate":true,"multiValue":false,":type":"string"},"linkid":{"dataType":"string","title":"linkId","multiValue":false,":type":"string"},"share-link":{"dataType":"string","value":"https://www.bbva.es/general/sostenibilidad/soluciones-para-personas/huella-de-carbono-personas/repositorio/temperatura-agradable-hogar.html","title":"share-link","multiValue":false,":type":"string"}},":type":"dam:Asset","elementsOrder":["id","image-url","title","offer","items","itemsposition","bullets","button-text","linkid","share-link"]},{"description":"","name":"utilizar-ahorro-energia","title":"utilizar ahorro energia","model":"caascfm/models/global-cells-recommendation","elements":{"id":{"dataType":"string","value":"RECNA0010ADVNA0015","title":"Id","translate":true,"multiValue":false,":type":"string"},"image-url":{"dataType":"string","value":"/content/dam/caas/global/glomo/sustainability/recommendations/images/4.2.3-b-min.png","title":"Asset","multiValue":false,":type":"string"},"title":{"dataType":"string","value":"¿Qué supone el uso del modo ahorro de energía?","title":"Title","translate":true,"multiValue":false,":type":"string"},"offer":{"dataType":"string","title":"offer","multiValue":false,":type":"string"},"items":{"dataType":"string","value":["Una parte importante del cosumo eléctrico de los hogares procede de los aparatos electrónicos. \u003Cspan style=\"font-weight:500\"\u003EEncender las pantallas de nuestros dispositivos es una de las operaciones que más energía demanda\u003C/span\u003E.\u003Cbr/\u003EPrueba estas ideas relacionadas con el modo ahorro de energía y disminuye su consumo:","Llevando a cabo estos cambios conseguirás \u003Cspan style=\"font-weight:500\"\u003Eahorrar batería\u003C/span\u003E en tus dispositivos y en tu factura de luz, \u003Cspan style=\"font-weight:500\"\u003Eprolongando\u003C/span\u003E, además, la \u003Cspan style=\"font-weight:500\"\u003Evida util de tus pantallas\u003C/span\u003E."],"title":"Items","translate":true,"multiValue":true,":type":"string"},"itemsposition":{"dataType":"string","title":"itemsPosition","multiValue":true,":type":"string"},"bullets":{"dataType":"string","value":["Reduce el brillo de tus pantallas. Utilizar un \u003Cspan style=\"font-weight:500\"\u003Ebrillo medio disminuye un 20%\u003C/span\u003E su consumo y usar un \u003Cspan style=\"font-weight:500\"\u003Ebrillo mínimo hasta un 40%\u003C/span\u003E.","Elige \u003Cspan style=\"font-weight:500;\"\u003Efondos de pantalla y salvapantallas oscuros, su proyección consume menos\u003C/span\u003E que las imágenes con colores vivos o en las que destaque el color blanco.","\u003Cspan style=\"font-weight:500;\"\u003EProcura bloquear\u003C/span\u003E el ordenador, el móvil o la tableta \u003Cspan style=\"font-weight:500;\"\u003Ecuando hagas una parada corta\u003C/span\u003E.","\u003Cspan style=\"font-weight:500;\"\u003EApaga\u003C/span\u003E el ordenador \u003Cspan style=\"font-weight:500;\"\u003Ecuando no lo estés utilizando\u003C/span\u003E.","\u003Cspan style=\"font-weight:500;\"\u003EDesactiva las notificaciones\u003C/span\u003E que no sean necesarias, \u003Cspan style=\"font-weight:500;\"\u003Eevitarás que la pantalla de tu dispositivo se encienda con mucha frecuencia\u003C/span\u003E."],"title":"Bullets","translate":true,"multiValue":true,":type":"string"},"button-text":{"dataType":"string","value":"Aceptar","title":"Button Text","translate":true,"multiValue":false,":type":"string"},"linkid":{"dataType":"string","title":"linkId","multiValue":false,":type":"string"},"share-link":{"dataType":"string","value":"https://www.bbva.es/general/sostenibilidad/soluciones-para-personas/huella-de-carbono-personas/repositorio/usar-el-modo-ahorro-de-energia.html","title":"share-link","multiValue":false,":type":"string"}},":type":"dam:Asset","elementsOrder":["id","image-url","title","offer","items","itemsposition","bullets","button-text","linkid","share-link"]},{"description":"","name":"¿cuáles-son-las-tarifas-eléctricas-","title":"¿Cuáles son las tarifas eléctricas?","model":"caascfm/models/global-cells-recommendation","elements":{"id":{"dataType":"string","value":"RECNA0005ADVNA0017","title":"Id","translate":true,"multiValue":false,":type":"string"},"image-url":{"dataType":"string","value":"/content/dam/caas/global/glomo/sustainability/recommendations/images/4.2.1-c-min.png.jpeg","title":"Asset","multiValue":false,":type":"string"},"title":{"dataType":"string","value":"¿Cuáles son las tarifas eléctricas?","title":"Title","translate":true,"multiValue":false,":type":"string"},"offer":{"dataType":"string","title":"offer","multiValue":false,":type":"string"},"items":{"dataType":"string","value":["El \u003Cspan style=\"font-weight:500;\"\u003Ecambio en la tarificación\u003C/span\u003E ha afectado a todos los contratos eléctricos, ya que ahora no existe la posibilidad de elegir tener precios distintos para momentos del día diferentes. Esta división se realizará en \u003Cspan style=\"font-weight:500;\"\u003E3 tramos en todas las tarifas.\u003C/span\u003E\u003Cbr/\u003ETen en cuenta estas ideas a la hora deutilizar tus electrodomésticos y ahorra en tu factura: ","Teniendo en cuenta los cambios de tarificación en tu día a día conseguirás ahorrar en tu factura y hacer un consumo más responsable de la energía."],"title":"Items","translate":true,"multiValue":true,":type":"string"},"itemsposition":{"dataType":"string","title":"itemsPosition","multiValue":true,":type":"string"},"bullets":{"dataType":"string","value":["Comprueba los horarios en los que el \u003Cspan style=\"font-weight:500;\"\u003Eprecio es más bajo,\u003C/span\u003E generalmente coinciden con la \u003Cspan style=\"font-weight:500;\"\u003Enoche y los fines de semana.\u003C/span\u003E","Procura \u003Cspan style=\"font-weight:500;\"\u003Eutilizar los electrodomésticos que más consumen en las horas más económicas.\u003C/span\u003E Si es posible, programa la lavadora y el lavavajillas para que funcionen durante la noche.","\u003Cspan style=\"font-weight:500;\"\u003EAdapta tus rutinas a la nueva tarificación\u003C/span\u003E y deja tareas como la plancha para el fin de semana, cuando no hay tramos de hora punta.","Contrata \u003Cspan style=\"font-weight:500;\"\u003Ediferentes potencias a lo largo del día:\u003C/span\u003E una para las horas valle y otra para las punta."],"title":"Bullets","translate":true,"multiValue":true,":type":"string"},"button-text":{"dataType":"string","value":"Aceptar","title":"Button Text","translate":true,"multiValue":false,":type":"string"},"linkid":{"dataType":"string","title":"linkId","multiValue":false,":type":"string"},"share-link":{"dataType":"string","value":"https://www.bbva.es/general/sostenibilidad/soluciones-para-personas/huella-de-carbono-personas/repositorio/consumir-electricidad-horas-valle.html","title":"share-link","multiValue":false,":type":"string"}},":type":"dam:Asset","elementsOrder":["id","image-url","title","offer","items","itemsposition","bullets","button-text","linkid","share-link"]},{"description":"","name":"detalle-de-ideas5111111","title":"reciclar correctamente","model":"caascfm/models/global-cells-recommendation","elements":{"id":{"dataType":"string","value":"tfx7yoqsk2dsltzq6upc","title":"Id","translate":true,"multiValue":false,":type":"string"},"image-url":{"dataType":"string","title":"Asset","multiValue":false,":type":"string"},"title":{"dataType":"string","value":"¿Qué supone reciclar correctamente los residuos?","title":"Title","translate":true,"multiValue":false,":type":"string"},"offer":{"dataType":"string","title":"offer","multiValue":false,":type":"string"},"items":{"dataType":"string","value":["Al reciclar un envase o un producto se \u003Cspan style=\"font-weight:500;\"\u003Eprolonga la vida útil de sus materias primas,\u003C/span\u003E se \u003Cspan style=\"font-weight:500;\"\u003Eevita que se exploten recursos innecesariamente\u003C/span\u003E y se \u003Cspan style=\"font-weight:500;\"\u003Ereduce el volumen de residuos.\u003C/span\u003E\u003Cbr/\u003ETen en cuenta estas ideas cuando separes los residuos de tu hogar:","Llevando a cabo estos cambios contribuyes a la \u003Cspan style=\"font-weight:500;\"\u003Ereutilización de los materiales y a evitar la deforestación, la extracción de materias primas\u003C/span\u003E y a reducir el impacto en carbono, ya que reciclar conlleva menos emisiones."],"title":"Items","translate":true,"multiValue":true,":type":"string"},"itemsposition":{"dataType":"string","title":"itemsPosition","multiValue":true,":type":"string"},"bullets":{"dataType":"string","value":["Utiliza espacios distintos para acumular y \u003Cspan style=\"font-weight:500;\"\u003Eseparar los diferentes residuos\u003C/span\u003E para facilitarte su depósito en el contenedor correspondiente.","Deposita tus \u003Cspan style=\"font-weight:500;\"\u003Eresiduos orgánicos en su contenedor\u003C/span\u003E si en tu municipio han destinado uno específico para ello.","Recuerda que los \u003Cspan style=\"font-weight:500;\"\u003Eresiduos más voluminosos o peligrosos\u003C/span\u003E como muebles, aparatos electrónicos, aceites, pilas o medicamentos han de ser llevados a \u003Cspan style=\"font-weight:500;\"\u003Epuntos de reciclado específicos.\u003C/span\u003E","Dale una segunda vida a tu ropa donándola a \u003Cspan style=\"font-weight:500;\"\u003Etiendas de segunda mano\u003C/span\u003E o llevándolas a \u003Cspan style=\"font-weight:500;\"\u003Epuntos de reciclaje\u003C/span\u003E para que se puedan reutilizar sus tejidos."],"title":"Bullets","translate":true,"multiValue":true,":type":"string"},"button-text":{"dataType":"string","value":"Aceptar","title":"Button Text","translate":true,"multiValue":false,":type":"string"},"linkid":{"dataType":"string","title":"linkId","multiValue":false,":type":"string"},"share-link":{"dataType":"string","title":"share-link","multiValue":false,":type":"string"}},":type":"dam:Asset","elementsOrder":["id","image-url","title","offer","items","itemsposition","bullets","button-text","linkid","share-link"]},{"description":"","name":"detalle-de-ideas51111111","title":"optimizar el consumo de agua","model":"caascfm/models/global-cells-recommendation","elements":{"id":{