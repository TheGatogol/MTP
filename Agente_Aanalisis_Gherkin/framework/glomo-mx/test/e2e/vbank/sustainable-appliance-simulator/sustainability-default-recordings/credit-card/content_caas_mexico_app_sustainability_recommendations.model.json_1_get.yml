C/span\u003E\u003Cbr/\u003EPrueba estas ideas para reducir ese consumo:","Llevando a cabo estos pequeños cambios conseguirás \u003Cspan style=\"font-weight:500;\"\u003Eahorrar energía,\u003C/span\u003E reducir emisiones de carbono y ahorrar en tus facturas, evitando consumos innecesarios y \u003Cspan style=\"font-weight:500;\"\u003Efavoreciendo al medioambiente.\u003C/span\u003E"],"title":"Items","translate":true,"multiValue":true,":type":"string"},"itemsposition":{"dataType":"string","title":"itemsPosition","multiValue":true,":type":"string"},"bullets":{"dataType":"string","value":["Regula el termostato a una temperatura entre \u003Cspan style=\"font-weight:500;\"\u003E19ºC y 21ºC,\u003C/span\u003E ideal para \u003Cspan style=\"font-weight:500;\"\u003Emantener el confort\u003C/span\u003E de una vivienda.","Cierra las persianas y cortinas por la noche, ya que \u003Cspan style=\"font-weight:500;\"\u003Eevitan importantes pérdidas de calor.\u003C/span\u003E","\u003Cspan style=\"font-weight:500;\"\u003ENo cubras los radiadores\u003C/span\u003E ni pongas objetos cerca para una adecuada \u003Cspan style=\"font-weight:500;\"\u003Edifusión del aire caliente.\u003C/span\u003E"],"title":"Bullets","translate":true,"multiValue":true,":type":"string"},"button-text":{"dataType":"string","value":"Aceptar","title":"Button Text","translate":true,"multiValue":false,":type":"string"},"linkid":{"dataType":"string","title":"linkId","multiValue":false,":type":"string"},"share-link":{"dataType":"string","title":"share-link","multiValue":false,":type":"string"}},":type":"dam:Asset","elementsOrder":["id","image-url","title","offer","items","itemsposition","bullets","button-text","linkid","share-link"]},{"description":"","name":"detalle-de-ideas4","title":"uso del modo ahorro de energía","model":"caascfm/models/global-cells-recommendation","elements":{"id":{"dataType":"string","value":"meqs6b7e3eqr9wv6j8rm","title":"Id","translate":true,"multiValue":false,":type":"string"},"image-url":{"dat