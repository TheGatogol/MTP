pan style=\"font-weight:500;\"\u003Ecuando no lo estés utilizando.\u003C/span\u003E","\u003Cspan style=\"font-weight:500;\"\u003EDesactiva las notificaciones\u003C/span\u003E que no sean necesarias, \u003Cspan style=\"font-weight:500;\"\u003Eevitarás que la pantalla de tu dispositivo se encienda con mucha frecuencia.\u003C/span\u003E"],"title":"Bullets","translate":true,"multiValue":true,":type":"string"},"button-text":{"dataType":"string","value":"Aceptar","title":"Button Text","translate":true,"multiValue":false,":type":"string"},"linkid":{"dataType":"string","title":"linkId","multiValue":false,":type":"string"},"share-link":{"dataType":"string","title":"share-link","multiValue":false,":type":"string"}},":type":"dam:Asset","elementsOrder":["id","image-url","title","offer","items","itemsposition","bullets","button-text","linkid","share-link"]},{"description":"","name":"detalle-de-ideas2","title":"regular la temperatura de la nevera","model":"caascfm/models/global-cells-recommendation","elements":{"id":{"dataType":"string","value":"r66ogtnomvcv6smgua67","title":"Id","translate":true,"multiValue":false,":type":"string"},"image-url":{"dataType":"string","value":"/content/dam/caas/global/glomo/sustainability/recommendations/images/4.2.2-c-min.png","title":"Asset","multiValue":false,":type":"string"},"title":{"dataType":"string","value":"¿Qué supone regular la temperatura de la nevera?","title":"Title","translate":true,"multiValue":false,":type":"string"},"offer":{"dataType":"string","title":"offer","multiValue":false,":type":"string"},"items":{"dataType":"string","value":["La electricidad que utiliza la nevera supone casi la cuarta parte de la factura de la luz. \u003Cspan style=\"font-weight:500;\"\u003EBajar un grado\u003C/span\u003E su temperatura puede llegar a suponer que su consumo se \u003Cspan style=\"font-weight:500;\"\u003Eincremente un 5%.\u003C/span\u003E\u003Cbr/\u003EPrueba estas ideas para optimizar el uso del frigorífico y reducir su consumo:","Llevando a cabo estos cambios conseguirás ahorrar energía y \u003Cspan style=\"font-weight:500;\"\u003Emejorar la conservación de tus alimentos,\u003C/span\u003E lo que evitará su desperdicio."],"title":"Items","translate":true,"multiValue":true,":type":"string"},"itemsposition":{"dataType":"string","title":"itemsPosition","multiValue":true,":type":"string"},"bullets":{"dataType":"string","value":["Mantén la temperatura del frigorífico a \u003Cspan style=\"font-weight:500;\"\u003E5 ºC\u003C/span\u003E y a \u003Cspan style=\"font-weight:500;\"\u003E-18 ºC\u003C/span\u003E la del congelador. Los alimentos se \u003Cspan style=\"font-weight:500;\"\u003Econservarán en perfecto estado.\u003C/span\u003E","Si tu nevera no tiene termostato, \u003Cspan style=\"font-weight:500;\"\u003Eregula la intensidad del frío\u003C/span\u003E en función de la estación. Mantén su potencia al mínimo en invierno y súbela a media intensidad en verano.","\u003Cspan style=\"font-weight:500;\"\u003EDescongela\u003C/span\u003E los alimentos \u003Cspan style=\"font-weight:500;\"\u003Edentro del frigorífico, evita que pierdan propiedades\u003C/span\u003E y se aprovecha su frío para mantener la temperatura de la nevera.","Procura mantener la nevera y el congelador \u003Cspan style=\"font-weight:500;\"\u003Elibre de escarcha\u003C/span\u003E ya que actúa como aislante.","Abre la nevera el menor tiempo posible y \u003Cspan style=\"font-weight:500;\"\u003Eevita introducir alimentos que estén calientes.\u003C/span\u003E"],"title":"Bullets","translate":true,"multiValue":true,":type":"string"},"button-text":{"dataType":"string","value":"Aceptar","title":"Button Text","translate":true,"multiValue":false,":type":"string"},"linkid":{"dataType":"string","title":"linkId","multiValue":false,":type":"string"},"share-link":{"dataType":"string","title":"share-link","multiValue":false,":type":"string"}},":type":"dam:Asset","elementsOrder":["id","image-url","title","offer","items","itemsposition","bullets","button-text","li