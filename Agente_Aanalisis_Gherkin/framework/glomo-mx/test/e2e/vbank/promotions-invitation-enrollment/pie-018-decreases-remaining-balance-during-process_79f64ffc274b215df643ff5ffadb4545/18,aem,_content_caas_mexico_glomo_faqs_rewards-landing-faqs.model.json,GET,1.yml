                  multiValue: false
                  value: ¿Cómo puedo aprovechar mis puntos?
                bullets:
                  dataType: string
                  ::type: text/plain
                  title: Bullets
                  multiValue: true
                  value:
                  - Al pagar en un comercio que tenga terminal BBVA, dile al vendedor
                    que quieres usar los puntos acumulados en tu tarjeta para pagar
                    total o parcialmente tu compra.
                  - Puedes pagar tus compras con puntos directo en tu app BBVA. En
                    la sección ‘Movimientos’ de tu tarjeta de crédito identifica las
                    compras que tengan la etiqueta ‘Quiero’ y luego selecciona la
                    opción ‘Pagar con puntos’.
                  - En algunos comercios electrónicos también te dan la oportunidad
                    de pagar con puntos.
                  - Mantente atento a las promociones especiales en las que tus puntos
                    valen más, así podrás ahorrar más dinero.
                  - Intercambia tus puntos por participaciones para el Sorteo Puntos
                    BBVA. Tú puedes ser el próximo ganador de miles de pesos en transferencias
                    electrónicas. No te quedes sin participar.
                  - Si eres titular de más de una tarjeta de crédito BBVA, puedes
                    transferir los puntos de una tarjeta a otra para juntarlos y poder
                    pagar total o parcialmente el monto de tus compras.
                  - Si tienes la Tarjeta Crea, considera que esta solo acumula puntos
                    y para poder usarlos debes ascender a la Tarjeta Azul.
