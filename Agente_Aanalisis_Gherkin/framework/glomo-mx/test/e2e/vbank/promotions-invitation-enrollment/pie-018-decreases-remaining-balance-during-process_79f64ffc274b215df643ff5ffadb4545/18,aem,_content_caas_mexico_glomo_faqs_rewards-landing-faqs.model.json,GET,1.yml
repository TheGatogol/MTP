              elements:
                answer:
                  dataType: string
                  ::type: text/html
                  title: Respuesta
                  multiValue: false
                  value: |
                    <p>Los meses sin intereses son una forma de pago diferido en cuotas mensuales que te permite comprar a plazos sin aumentar el precio final del producto, los plazos en los que puedes pagar van desde los 3 hasta los 24 meses.&nbsp;</p>
