              elements:
                answer:
                  dataType: string
                  ::type: text/html
                  title: Respuesta
                  multiValue: false
                  value: |
                    <p>Existen varias razones por las que tus puntos pueden eliminarse.&nbsp;</p>
                itemsposition:
                  dataType: string
                  ::type: string
                  title: Posición
                  multiValue: true
                linkURL:
                  dataType: string
                  ::type: string
                  title: Link Url
                  multiValue: false
                header:
                  dataType: string
                  ::type: string
                  title: Cabecera
                  multiValue: false
                alternativeTitle:
                  dataType: string
                  ::type: string
                  title: Titulo alternativo
                  multiValue: false
                alternativeAnswer:
                  dataType: string
                  ::type: text/html
                  title: Respuesta Alternativa
                  multiValue: true
                  value:
                  - |
                    <p>Puntos descontados: considera que las compras pagadas con puntos o a meses sin intereses no generan Puntos BBVA. Así que si hiciste una compra que generó puntos y posteriormente decides pagarla con tus puntos o pasarla a meses en tu app BBVA o en Línea BBVA, al finalizar la operación te descontaremos los puntos que generaste con esa compra.</p>
                  - |
                    <p>En caso de que hagas una compra y luego decidas hacer una devolución, también tendremos que descontar los puntos que hayas generado con dicha compra.</p>
                  - |
                    <p>Asimismo, tus puntos se eliminarán si cancelas tu tarjeta, si no la usas por más de 12 meses seguidos, si tienes un impago (‘mora’) en ella por más de 60 días o bien, si tu tarjeta tiene alguno de estos estatus: fallecimiento, reestructura, castigo, fraude, en poder de jurídico o demanda judicial.</p>
                  - |
                    <p>Puntos vencidos: los puntos tienen una vigencia de acuerdo con el tipo de tarjeta que tengas, por lo que te recomendamos que los uses antes de su fecha de vencimiento. Para conocer cuántos meses de vigencia tienen tus puntos revisa el documento de ‘Términos y condiciones’.</p>
