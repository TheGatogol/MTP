                  multiValue: true
                  value:
                  - |
                    <p>Cada vez que pagas tus compras con tu tarjeta de crédito BBVA estarás generando puntos que se van acumulando. Posteriormente esos puntos puedes usarlos para pagar tus compras, ya sea en comercios o directo en tu app BBVA en ‘Pagar con puntos’ que está en la opción ‘Quiero’ de tus transacciones. De esta forma estarás ahorrando dinero.</p>
