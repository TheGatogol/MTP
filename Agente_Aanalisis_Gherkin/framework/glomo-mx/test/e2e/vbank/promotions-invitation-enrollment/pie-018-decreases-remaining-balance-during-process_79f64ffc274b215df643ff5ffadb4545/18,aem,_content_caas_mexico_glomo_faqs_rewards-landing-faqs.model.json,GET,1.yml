                  title: Respuesta
                  multiValue: false
                  value: |
                    <p>Un cupón es un bono que se puede canjear en los comercios electrónicos para que pagues menos cuando hagas una compra. Los cupones tienen un código que deberás introducir cuando compres en el comercio donde aplica la promoción; una vez que lo introduzcas, el cupón será registrado y se aplicará al final de tu compra.</p>
