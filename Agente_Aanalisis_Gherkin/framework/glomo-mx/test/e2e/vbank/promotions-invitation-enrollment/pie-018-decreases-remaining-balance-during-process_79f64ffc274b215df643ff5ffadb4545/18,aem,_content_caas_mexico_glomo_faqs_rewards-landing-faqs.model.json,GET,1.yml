            - path: /content/dam/caas/mexico/glomo/faqs/rewards-landing-faqs/¿puedo-devolver-un-producto-comprado-con-una-promoción-
              lastPublishedDate: 1759481744142
              elementsOrder:
              - entity
              - header
              - title
              - alternativeTitle
              - answer
              - alternativeAnswer
              - itemsposition
              - bullets
              - linkText
              - linkURL
              lastModifiedDate: 1683115936389
              variations: []
              elements:
                answer:
                  dataType: string
                  ::type: text/html
                  title: Respuesta
                  multiValue: false
                  value: |
                    <p>Sí puedes hacer la devolución, pero no será posible conservar los beneficios que ganaste con tu promoción. Si tu compra fue a meses sin intereses, es necesario que tomes en cuenta varios puntos para evitar problemas y confusiones:</p>
                itemsposition:
                  dataType: string
                  ::type: text/html
                  title: Posición
                  multiValue: true
                  value:
                  - |
                    <p>1</p>
                  - |
                    <p>2</p>
                  - |
                    <p>3</p>
                  - |
                    <p>4</p>
                  - |
                    <p>5</p>
                linkURL:
                  dataType: string
                  ::type: string
                  title: Link Url
                  multiValue: false
                header:
                  dataType: string
                  ::type: string
                  title: Cabecera
                  multiValue: false
                alternativeTitle:
                  dataType: string
                  ::type: string
                  title: Titulo alternativo
                  multiValue: false
                alternativeAnswer:
                  dataType: string
                  ::type: text/html
                  title: Respuesta Alternativa
                  multiValue: true
                  value:
                  - |
                    <p>Ten en cuenta que los comercios no siempre están obligados a aceptar devoluciones si los productos fueron comprados con algún descuento o promoción especial. Para evitar una mala experiencia, te recomendamos preguntar sobre las políticas de devolución en el comercio antes de hacer tu compra.&nbsp;</p>
                linkText:
                  dataType: string
                  ::type: string
                  title: Link Text
                  multiValue: false
                title:
                  dataType: string
                  ::type: string
                  title: Título
                  multiValue: false
                  value: ¿Puedo devolver un producto comprado con una promoción?
                entity:
                  dataType: string
                  ::type: string
                  title: Entidad
                  multiValue: false
                  value: ¿Puedo devolver un producto comprado con una promoción?
                bullets:
                  dataType: string
                  ::type: text/html
                  title: Bullets
                  multiValue: true
                  value:
                  - |
                    <p>Avísale al comercio que harás la devolución y sigue sus instrucciones para evitar complicaciones.</p>
                  - |
                    <p>Cuando hayas devuelto el producto, se hará un pago en tu tarjeta de crédito por el monto total de esa compra. Esto quiere decir que la devolución fue validada.</p>
                  - |
                    <p>Si la única compra con tu tarjeta es la del producto devuelto, el pago se verá como un saldo a favor con el que cubrirás las cuotas mensuales de tu promoción.</p>
                  - |
                    <p>Si en tu tarjeta hay otras compras además de la del producto devuelto, con el pago se ajustará tu saldo disponible y disminuirá tu saldo a pagar.</p>
                  - |
                    <p>No te preocupes si el cobro mensual de tu compra sigue apareciendo en el corte de tu tarjeta, esto es normal porque la cancelación de los meses sin intereses no se hace de inmediato. Aunque aparezca el cobro, ese monto ya fue cubierto con el pago hecho a tu tarjeta en el momento de la devolución.&nbsp;</p>
              name: ¿puedo-devolver-un-producto-comprado-con-una-promoción-
              description: ''
              model: caascfm/models/mexico-glomo-points-redeem-purchase-options
              ::type: dam:Asset
              title: ¿Puedo devolver un producto comprado con una promoción?
