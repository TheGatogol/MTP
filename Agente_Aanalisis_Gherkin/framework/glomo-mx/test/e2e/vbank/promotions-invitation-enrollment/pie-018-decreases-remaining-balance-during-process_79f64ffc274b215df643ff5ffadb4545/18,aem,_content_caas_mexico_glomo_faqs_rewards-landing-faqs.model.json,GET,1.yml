                  title: Respuesta Alternativa
                  multiValue: true
                  value:
                  - |
                    <p>En BBVA te ofrecemos promociones para comprar a meses sin intereses con tu tarjeta de crédito. La promoción se aplica automáticamente al hacer tu compra en el comercio y elegir alguno de los plazos disponibles, el comercio te ofrecerá las opciones de plazos y tú eliges la que más se te acomode.&nbsp;</p>
                  - |
                    <p>La mayoría de nuestras tarjetas de crédito participan en promociones con meses sin intereses, pero algunas como la Tarjeta Crea y la Tarjeta Congelada no entran en este programa de recompensas.&nbsp;</p>
