                  multiValue: false
                  value: |
                    <p>Los Puntos BBVA forman parte de nuestro programa de recompensas y son el beneficio que te damos por usar tus tarjetas de crédito BBVA al pagar tus compras en comercios físicos o electrónicos, tanto en México como en el extranjero.&nbsp;</p>
