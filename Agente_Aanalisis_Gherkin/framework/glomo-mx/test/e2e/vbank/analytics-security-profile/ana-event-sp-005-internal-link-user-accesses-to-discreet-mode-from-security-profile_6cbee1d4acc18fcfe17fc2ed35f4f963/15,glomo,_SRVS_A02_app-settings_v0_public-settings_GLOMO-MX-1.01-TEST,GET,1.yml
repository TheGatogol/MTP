        las operaciones de equipos de cómputo o dispositivos móviles."]}],"synonyms":["Virus"],"isActive":true},{"id":16,"title":"Ransomware","content":[{"type":"p","content":["Es
        un ataque que busca limitar o bloquear los dispositivos móviles. Una vez bloqueado,
        se ponen en contacto con el usuario pidiéndole un rescate económico si desea
        volver a tener el control del teléfono."]}],"isActive":true},{"id":17,"title":"Spyware","content":[{"type":"p","content":["Es
