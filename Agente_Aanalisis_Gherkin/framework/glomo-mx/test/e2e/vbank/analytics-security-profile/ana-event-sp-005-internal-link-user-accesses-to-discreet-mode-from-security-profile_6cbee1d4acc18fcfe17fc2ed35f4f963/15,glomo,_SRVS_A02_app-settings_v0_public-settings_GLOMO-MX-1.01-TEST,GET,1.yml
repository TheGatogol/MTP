        información de la banda magnética de tarjetas de crédito o débito para clonarlas
        y usarlas en compras digitales o retiros de dinero."]}],"synonyms":["Clonaciones"],"isActive":true},{"id":6,"title":"Pharming","content":[{"type":"p","content":["Consiste
        en redirigir a las personas a una página web falsa mediante ventanas emergentes
        con el objetivo de robar datos personales y confidenciales."]}],"isActive":true},{"id":7,"title":"Baiting","content":[{"type":"p","content":["Es
        una técnica que consiste en abandonar con intencionalidad un dispositivo de
        almacenamiento externo (memoria USB) infectado con un ''malware''. El objetivo
        es que alguien lo conecte en su equipo personal o corporativo y esto permita
        acceder a sus datos personales y confidenciales."]}],"synonyms":["Fraude por
