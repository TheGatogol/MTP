        en Redes Sociales"],"isActive":true},{"id":10,"title":"Código de seguridad","content":[{"type":"p","content":["Son
        los 3 dígitos al reverso de una tarjeta de crédito y sirven como un proceso
        de seguridad adicional al momento de hacer compras por teléfono o en internet."]}],"synonyms":["CVV"],"isActive":true},{"id":11,"title":"Datos
        confidenciales","content":[{"type":"p","content":["Es información privada
        cuyo mal uso podría impactar la situación financiera de las personas. Estos
        datos pueden ir desde el saldo de las cuenta bancarias hasta las contraseñas,
        NIPs, usuarios y demás mecanismos de protección digital."]}],"isActive":true},{"id":12,"title":"Datos
        personales","content":[{"type":"p","content":["Es la información que identifica
        a alguien como Persona Física y su mal uso podría ocasionar una suplantación
        de identidad. Algunos ejemplos de datos personales son: nombre completo, fecha
        de nacimiento, dirección, sexo, etc."]}],"isActive":true},{"id":13,"title":"Ataque
        Denegación de Servicio (DDoS)","content":[{"type":"p","content":["Los ataques
        DDoS suelen ir orientados a dejar sin servicio a una plataforma o página web."]}],"synonyms":["Denegación
        de Servicio"],"isActive":true},{"id":14,"title":"Ataque de fuerza bruta","content":[{"type":"p","content":["Es
        un ataque que busca averiguar las contraseñas de los usuarios y consiste en
